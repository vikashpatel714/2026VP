{n:'6',t:'FCFS',aim:'First-Come First-Served: the process that arrives first runs first, until it finishes.',
code:R`#include <stdio.h>

code:R`#include <stdio.h>

code:R`#include <stdio.h>
int main(){

code:R`#include <stdio.h>
#include <pthread.h>
int counter=0;
void* work(void*a){
  for(int i=0;i<100000;i++)
    counter++;      // load, add, store: NOT atomic
  return NULL;
}
int main(){
  pthread_t t1,t2;
  pthread_create(&t1,NULL,work,NULL);
  pthread_create(&t2,NULL,work,NULL);

}`,

void* prod(void*a){ for(int i=1;i<=5;i++){
  sem_wait(&empty); sem_wait(&mutex);
  buf[in]=i; in=(in+1)%N; printf("Produced %d\n",i);
  sem_post(&mutex); sem_post(&full); } return NULL; }
void* cons(void*a){ for(int i=1;i<=5;i++){
  sem_wait(&full); sem_wait(&mutex);
  int x=buf[out]; out=(out+1)%N; printf("Consumed %d\n",x);
  sem_post(&mutex); sem_post(&empty); } return NULL; }
int main(){ pthread_t p,c;
  sem_init(&empty,0,N); sem_init(&full,0,0); sem_init(&mutex,0,1);

{n:'14',t:"Dining Philosophers",aim:'Five philosophers share five forks. Each needs two forks to eat. If all grab their left fork, nobody can eat (deadlock). Letting only 4 sit at once prevents this. Compile with -pthread.',
code:R`#include <stdio.h>
#include <pthread.h>
#include <semaphore.h>
#define N 5
sem_t fork_[N], room;
void* phil(void*a){ int i=(long)a;
  sem_wait(&room);
  sem_wait(&fork_[i]); sem_wait(&fork_[(i+1)%N]);
  printf("P%d eating\n",i);
  sem_post(&fork_[(i+1)%N]); sem_post(&fork_[i]);
  sem_post(&room); return NULL; }
int main(){ pthread_t t[N];
  sem_init(&room,0,N-1);
  for(int i=0;i<N;i++) sem_init(&fork_[i],0,1);
  for(long i=0;i<N;i++) pthread_create(&t[i],0,phil,(void*)i);
  for(int i=0;i<N;i++) pthread_join(t[i],0); return 0; }`,

{n:'15',t:"Banker's Algorithm",aim:'Deadlock avoidance: grant resources only if the system stays in a safe state, meaning there is an order in which every process can finish.',
code:R`#include <stdio.h>
int main(){
  int n=3,m=2, alloc[3][2]={{1,0},{2,1},{1,1}}, max[3][2]={{3,2},{3,2},{2,2}};
  int avail[2]={2,1}, fin[3]={0}, order[3], c=0;
  while(c<n){ int found=0;
    for(int i=0;i<n;i++) if(!fin[i]){
      int ok=1;
      for(int j=0;j<m;j++) if(max[i][j]-alloc[i][j] > avail[j]) ok=0;
      if(ok){ for(int j=0;j<m;j++) avail[j]+=alloc[i][j];
        fin[i]=1; order[c++]=i; found=1; }
    }
    if(!found){ printf("UNSAFE\n"); return 0; }
  }
  printf("SAFE: "); for(int i=0;i<n;i++) printf("P%d ",order[i]+1);
}`,
steps:[[3,'Allocation: P1 (1,0), P2 (2,1), P3 (1,1). Max: P1 (3,2), P2 (3,2), P3 (2,2).'],[4,'Available = (2,1). Need = Max - Alloc: P1 (2,2), P2 (1,1), P3 (1,1).'],[8,'P1: need (2,2) is more than avail (2,1), so it must wait.'],[8,'P2: need (1,1) fits in avail (2,1).'],[9,'P2 finishes and releases (2,1): avail = (4,2).'],[8,'P3: need (1,1) fits in (4,2). It finishes; avail = (5,3).'],[8,'Next pass: P1 need (2,2) fits in (5,3). avail = (6,3).'],[14,'Safe sequence found.','SAFE: P2 P3 P1 \n']]},
{n:'16',t:'Deadlock Detection',aim:'Detection: let the system run, then check whether some processes can never finish because they wait for resources held by each other.',
code:R`#include <stdio.h>
int main(){
  int n=3,m=2, alloc[3][2]={{1,0},{0,1},{0,0}}, req[3][2]={{0,1},{1,0},{0,0}};
  int work[2]={0,0}, fin[3]={0}, again=1;
  while(again){ again=0;
    for(int i=0;i<n;i++) if(!fin[i]){
      int ok=1;
      for(int j=0;j<m;j++) if(req[i][j]>work[j]) ok=0;
      if(ok){ for(int j=0;j<m;j++) work[j]+=alloc[i][j];
        fin[i]=1; again=1; }
    }
  }
  for(int i=0;i<n;i++) if(!fin[i]) printf("P%d is DEADLOCKED\n",i+1);
}`,
steps:[[3,'Allocation: P1 (1,0), P2 (0,1), P3 (0,0). Request: P1 (0,1), P2 (1,0), P3 (0,0).'],[4,'work = available = (0,0).'],[8,'P1 requests (0,1), more than work (0,0), so it must wait.'],[8,'P2 requests (1,0), more than work, so it must wait.'],[8,'P3 requests nothing, so it can finish.'],[9,'P3 releases its allocation (0,0); work stays (0,0).'],[12,'A full pass makes no more progress, so the loop ends.'],[13,'P1 holds R1 and wants R2; P2 holds R2 and wants R1. They wait for each other forever.','P1 is DEADLOCKED\nP2 is DEADLOCKED\n']]}];
