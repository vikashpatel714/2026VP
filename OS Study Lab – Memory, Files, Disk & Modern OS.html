ock;color:var(--accent2)}\n.hole .hb{height:210px;display:flex;flex-direction:column}\n.chunk{display:grid;place-items:center;color:#fff;font-weight:700;font-size:.78rem;text-shadow:0 1px 3px rgba(0,0,0,.7);overflow:hidden;min-height:0;border-bottom:1px solid rgba(255,255,255,.35);animation:pop .5s;text-align:center}\n.chunk small{font-weight:400;font-size:.65rem}\n.chunk.free{background:repeating-linear-gradient(45deg,rgba(128,128,128,.25) 0 6px,rgba(128,128,128,.08) 6px 12px);color:var(--muted);text-shadow:none;border:0}\n@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}\n.hole.scan{border-color:var(--warn);box-shadow:0 0 0 3px var(--warn),0 0 22px var(--warn);transform:translateY(-5px)}\n.hole.chosen{border-color:var(--good);box-shadow:0 0 0 3px var(--good),0 0 24px var(--good)}\n.hole.rej{opacity:.5;border-color:var(--bad)}\n.queue{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}\n.qchip{padding:5px 12px;border-radius:999px;border:1px solid var(--border);font-size:.85rem;background:var(--inbg)}\n.qchip.cur{border-color:var(--warn);box-shadow:0 0 12px var(--warn)}\n.qchip.done{border-color:var(--good)}.qchip.wait{border-color:var(--bad)}\n/* flow nodes */\n.flow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin:12px 0}\n.node{border:2px solid var(--border);background:var(--inbg);border-radius:12px;padding:10px 14px;text-align:center;font-size:.88rem;min-width:110px;transition:.35s}\n.node small{display:block;color:var(--muted)}\n.node.on{border-color:var(--warn);box-shadow:0 0 18px var(--warn);transform:scale(1.07);background:rgba(245,158,11,.18)}\n.node.good{border-color:var(--good);box-shadow:0 0 18px var(--good)}\n.node.bad{border-color:var(--bad);box-shadow:0 0 18px var(--bad)}\n.arrow{font-size:1.4rem;color:var(--accent2);animation:nudge 1.2s infinite}\n@keyframes nudge{50%{transform:translateX(5px)}}\n/* compaction */\n.cpbar{position:relative;height:78px;border:2px solid var(--border);border-radius:10px;overflow:hidden;background:var(--inbg)}\n.cpb{position:absolute;top:0;bottom:0;display:grid;place-items:center;align-content:center;color:#fff;font-weight:700;font-size:.8rem;text-shadow:0 1px 3px rgba(0,0,0,.7);border-right:2px solid rgba(255,255,255,.5);transition:left 1s ease,opacity .5s;text-align:center}\n.cpb small{font-weight:400;font-size:.65rem}\n.cpb.free{background:repeating-linear-gradient(45deg,rgba(128,128,128,.28) 0 6px,rgba(128,128,128,.1) 6px 12px);color:var(--muted);text-shadow:none}\n.shake{animation:shake .5s}\n@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}\n.part{height:56px;border:2px solid var(--accent2);border-radius:8px;position:relative;overflow:hidden;background:repeating-linear-gradient(45deg,rgba(239,68,68,.35) 0 7px,rgba(239,68,68,.12) 7px 14px)}\n.part div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));display:grid;place-items:center;color:var(--btntext);font-weight:700;transition:width .3s}\n/* paging */\n.scroll{overflow-x:auto}\n.pgwrap{position:relative;display:grid;grid-template-columns:1fr 150px 1fr;gap:70px;min-width:640px;padding:6px}\n.pgwrap svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:3}\n.arr{fill:none;stroke:var(--accent2);stroke-width:3;stroke-linecap:round;filter:drop-shadow(0 0 4px var(--accent2))}\n.arr.b{stroke:var(--accent)}\n.dot{fill:var(--accent2)}\n.col h4{margin:0 0 4px;text-align:center;color:var(--muted);font-size:.85rem}\n.pbox{border:2px solid var(--border);border-radius:8px;padding:5px 8px;margin:6px 0;font-size:.83rem;background:var(--inbg);transition:.3s;display:flex;justify-content:space-between;gap:6px;align-items:center}\n.pbox small{color:var(--muted)}\n.pbox.on{border-color:var(--warn);box-shadow:0 0 14px var(--warn);background:rgba(245,158,11,.25)}\n.pbox.other{background:repeating-linear-gradient(45deg,rgba(128,128,128,.22) 0 6px,rgba(128,128,128,.07) 6px 12px)}\n.pbox.map{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7)}\n.pbox.map small{color:#fff}\n.trow{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--border);border-radius:6px;margin:6px 0;text-align:center;transition:.3s;background:var(--inbg);font-size:.9rem}\n.trow.head{background:transparent;border:0;color:var(--muted);font-size:.8rem}\n.trow.on{border-color:var(--warn);box-shadow:0 0 14px var(--warn);background:rgba(245,158,11,.25)}\n.trow.skip{opacity:.4}\n.bits{font-family:Consolas,monospace;font-size:1.25rem;letter-spacing:2px;margin:8px 0}\n.bits span{padding:3px 8px;border-radius:6px}\n.bp{background:var(--accent);color:var(--btntext)}.bd{background:var(--accent2);color:var(--btntext)}\n.tlb{display:flex;gap:6px;align-items:center;font-size:.85rem}\n.tlb span.slot{border:2px dashed var(--border);border-radius:6px;padding:2px 10px;min-width:60px;text-align:center}\n.tlb span.slot.hit{border-color:var(--good);box-shadow:0 0 12px var(--good)}\n.big{font-size:1.05rem;padding:8px 12px;border-radius:10px;background:var(--inbg);margin-top:8px}\n/* segmentation */\n.pbar{position:relative;height:84px;border:2px solid var(--border);border-radius:8px;background:var(--inbg);margin:26px 0 30px}\n.sgb{position:absolute;top:0;bottom:0;display:grid;place-items:center;color:#fff;font-size:.72rem;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.7);border-right:1px solid rgba(255,255,255,.5);transition:.3s;overflow:hidden;text-align:center}\n.sgb.on{outline:3px solid var(--warn);box-shadow:0 0 18px var(--warn);z-index:2}\n.tick{position:absolute;top:100%;font-size:.66rem;color:var(--muted);transform:translateX(-50%);padding-top:3px}\n.marker{position:absolute;top:-24px;font-size:1.4rem;transform:translateX(-50%);transition:left .9s ease;opacity:0;color:var(--accent2);filter:drop-shadow(0 0 5px var(--accent2))}\n.marker.show{opacity:1}\n.trap{animation:shake .5s;border-color:var(--bad)!important;box-shadow:0 0 22px var(--bad)}\n/* VM */\n.vas{display:flex;flex-direction:column;height:300px;border:2px solid var(--border);border-radius:10px;overflow:hidden}\n.vas>div{display:grid;place-items:center;font-size:.8rem;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7);text-align:center}\n.v-stack{flex:1 1 0;background:#ef4444;animation:grow1 4s infinite alternate}\n.v-hole{flex:3 1 0;background:repeating-linear-gradient(45deg,rgba(128,128,128,.25) 0 8px,rgba(128,128,128,.08) 8px 16px)!important;color:var(--muted)!important;text-shadow:none!important}\n.v-heap{flex:1 1 0;background:#f59e0b;animation:grow2 4s infinite alternate}\n.v-data{flex:.6 1 0;background:#3b82f6}.v-code{flex:.8 1 0;background:#10b981}\n@keyframes grow1{to{flex-grow:2}}@keyframes grow2{to{flex-grow:2.2}}\n.pgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}\n.pgrid div{aspect-ratio:1;border-radius:6px;border:2px dashed var(--border);display:grid;place-items:center;font-size:.7rem;color:var(--muted);transition:.5s}\n.pgrid div.res{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--btntext);border:2px solid transparent;font-weight:700}\n.pgrid div.flash{transform:scale(1.2)}\n/* demand paging sim */\n.dpgrid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:14px}\n@media(max-width:860px){.dpgrid{grid-template-columns:1fr}}\n.vrow{display:grid;grid-template-columns:50px 1fr 1fr;gap:4px;border:2px solid var(--border);border-radius:6px;margin:4px 0;padding:3px 6px;font-size:.82rem;text-align:center;transition:.3s;background:var(--inbg)}\n.vrow.on{border-color:var(--good);box-shadow:0 0 12px var(--good)}\n.vrow.fault{border-color:var(--bad);box-shadow:0 0 14px var(--bad)}\n.bit{font-weight:800}.bit.v{color:var(--good)}.bit.i{color:var(--bad)}\n.fbox{border:2px solid var(--border);border-radius:8px;margin:6px 0;padding:10px;text-align:center;font-size:.85rem;background:var(--inbg);transition:.3s;min-height:44px}\n.fbox.on{border-color:var(--good);box-shadow:0 0 16px var(--good)}\n.fbox.out{border-color:var(--bad);box-shadow:0 0 16px var(--bad)}\n.fbox.in{border-color:var(--warn);box-shadow:0 0 16px var(--warn)}\n.refs{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}\n.refs span{padding:3px 9px;border-radius:6px;border:1px solid var(--border);font-family:monospace}\n.refs span.cur{background:var(--accent);color:var(--btntext);font-weight:800}\n.refs span.past{opacity:.5}\n.fly{position:fixed;z-index:80;transition:transform .7s ease;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:800;text-shadow:0 1px 2px #000;box-shadow:0 0 20px var(--accent)}\n.stat{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}\n.stat div{background:var(--inbg);border:1px solid var(--border);border-radius:10px;padding:6px 14px;text-align:center;font-size:.8rem;color:var(--muted)}\n.stat b{display:block;font-size:1.3rem;color:var(--accent2)}\n.bar3{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--border);margin:8px 0}\n.bar3 div{display:grid;place-items:center;font-size:.7rem;color:#fff;font-weight:700;text-shadow:0 1px 2px #000;overflow:hidden;white-space:nowrap}\ncanvas#chart{width:100%;height:280px;background:var(--inbg);border-radius:10px}\n.hier div{margin:6px 0;padding:6px 10px;border-radius:8px;color:#fff;font-weight:700;font-size:.82rem;text-shadow:0 1px 2px #000;animation:wid 1.5s ease both}\n@keyframes wid{from{width:10%}}\ndetails{background:var(--inbg);border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin:8px 0}\nsummary{cursor:pointer;font-weight:700}\n.reveal{opacity:0;transform:translateY(26px);transition:opacity .7s,transform .7s}\n.reveal.in{opacity:1;transform:none}\nfooter{text-align:center;color:var(--muted);font-size:.85rem;margin-top:30px}\n<\/style>\n<\/head>\n<body data-theme=\"galaxy\">\n<canvas id=\"bg\"><\/canvas>\n<div id=\"prog\"><\/div>\n<header class=\"top\"><div class=\"brand\">\ud83e\udde0 OS \u00b7 Memory Lab<\/div><div id=\"themes\" class=\"themes\"><\/div><\/header>\n<nav class=\"nav\" id=\"nav\"><\/nav>\n<main>\n\n<div class=\"hero\">\n  <h1>Memory Allocation &amp; Virtual Memory<\/h1>\n  <p>Operating Systems \u00b7 Visual notes with live simulations. Click, type, press play and watch the memory move. Pick a theme from the top bar anytime.<\/p>\n  <div class=\"road\">\n    <a href=\"#basics\">Basics<\/a><i>\u279c<\/i><a href=\"#alloc\">First / Best / Worst Fit<\/a><i>\u279c<\/i><a href=\"#frag\">Fragmentation<\/a><i>\u279c<\/i><a href=\"#paging\">Paging<\/a><i>\u279c<\/i><a href=\"#seg\">Segmentation<\/a><i>\u279c<\/i><a href=\"#segpag\">Segmented Paging<\/a><i>\u279c<\/i><a href=\"#vm\">Virtual Memory<\/a><i>\u279c<\/i><a href=\"#dp\">Demand Paging<\/a><i>\u279c<\/i><a href=\"#perf\">Performance<\/a>\n  <\/div>\n<\/div>\n\n<\!-- 01 BASICS -->\n<section id=\"basics\" class=\"sec reveal\" data-nav=\"Basics\">\n<h2><span class=\"num\">01<\/span> Memory Basics: Logical vs Physical<\/h2>\n<div class=\"grid2\">\n <div class=\"card notes\"><h3>\ud83d\udcdd Notes<\/h3><ul>\n  <li><b>Main memory<\/b> is the only large storage the CPU can access directly. A program must be brought into memory to run.<\/li>\n  <li><b>Logical (virtual) address<\/b> is generated by the CPU. <b>Physical address<\/b> is what the memory unit sees.<\/li>\n  <li><b>MMU<\/b> (Memory Management Unit) is hardware that maps logical to physical at run time.<\/li>\n  <li><b>Address binding<\/b> can happen at compile time (absolute code), load time (relocatable code) or execution time (needs MMU hardware).<\/li>\n  <li>With contiguous allocation the MMU uses a <b>relocation (base) register<\/b> and a <b>limit register<\/b>: every address is checked against the limit and then added to the base.<\/li>\n  <li>Protection: an address that crosses the limit causes a <b>trap<\/b> (addressing error) to the OS.<\/li>\n  <li>OS goals: <b>relocation, protection, sharing, logical organization, physical organization<\/b>.<\/li>\n <\/ul><\/div>\n <div class=\"card\"><h3>\ud83d\udd2c Simulation: Base + Limit hardware<\/h3>\n  <div class=\"ctrl\"><label>Logical addr<\/label><input id=\"mmuLa\" type=\"number\" value=\"346\" style=\"width:90px\"><label>Base<\/label><input id=\"mmuBase\" type=\"number\" value=\"14000\" style=\"width:90px\"><label>Limit<\/label><input id=\"mmuLim\" type=\"number\" value=\"3000\" style=\"width:80px\"><\/div>\n  <div class=\"ctrl\"><button class=\"btn pri\" onclick=\"mmuRun()\">\u25b6 Run<\/button><button class=\"btn\" onclick=\"$('#mmuLa').value=3500;mmuRun()\">Try 3500 (illegal)<\/button><\/div>\n  <div class=\"flow\">\n   <div class=\"node\" id=\"m1\">CPU<small id=\"m1t\">logical<\/small><\/div><span class=\"arrow\">\u279c<\/span>\n   <div class=\"node\" id=\"m2\">Limit check<small id=\"m2t\">&lt; limit ?<\/small><\/div><span class=\"arrow\">\u279c<\/span>\n   <div class=\"node\" id=\"m3\">+ Base<small id=\"m3t\">adder<\/small><\/div><span class=\"arrow\">\u279c<\/span>\n   <div class=\"node\" id=\"m4\">Memory<small id=\"m4t\">physical<\/small><\/div>\n  <\/div>\n  <div class=\"big\" id=\"mmuOut\">Press Run.<\/div>\n <\/div>\n<\/div>\n<div class=\"card\"><h3>\ud83d\udcca Memory hierarchy (speed vs size)<\/h3>\n <div class=\"hier\">\n  <div style=\"width:30%;background:#ef4444\">Registers \u00b7 ~1 ns \u00b7 bytes<\/div>\n  <div style=\"width:48%;background:#f59e0b\">Cache \u00b7 ~2\u201310 ns \u00b7 KB\u2013MB<\/div>\n  <div style=\"width:72%;background:#10b981\">Main memory (RAM) \u00b7 ~100 ns \u00b7 GB<\/div>\n  <div style=\"width:100%;background:#3b82f6\">Disk / SSD (swap, backing store) \u00b7 0.02\u20138 ms \u00b7 TB<\/div>\n <\/div>\n <div class=\"callout\">RAM is roughly <b>100,000\u00d7<\/b> faster than a hard disk. This gap is why page faults are so expensive (see Performance section).<\/div>\n<\/div>\n<\/section>\n\n<\!-- 02 ALLOCATION -->\n<section id=\"alloc\" class=\"sec reveal\" data-nav=\"Allocation\">\n<h2><span class=\"num\">02<\/span> Contiguous Allocation: First, Best, Worst Fit<\/h2>\n<div class=\"grid2\">\n <div class=\"card notes\"><h3>\ud83d\udcdd Notes<\/h3><ul>\n  <li><b>Contiguous allocation:<\/b> each process occupies one single block of consecutive memory.<\/li>\n  <li><b>Fixed (static) partitions:<\/b> memory is cut into fixed sizes in advance. Easy but wastes space inside partitions (<b>internal fragmentation<\/b>) and limits multiprogramming.<\/li>\n  <li><b>Variable (dynamic) partitions:<\/b> a partition is created exactly as big as the process. Free space becomes <b>holes<\/b> of different sizes scattered in memory. The OS keeps a list of holes.<\/li>\n  <li><b>Dynamic storage allocation problem:<\/b> satisfy a request of size <i>n<\/i> from the list of free holes.<\/li>\n  <li><b>First Fit:<\/b> take the <b>first<\/b> hole that is big enough. Fastest, simple, leaves small bits near the start.<\/li>\n  <li><b>Best Fit:<\/b> take the <b>smallest<\/b> hole that is big enough. Must search the whole list. Leaves the tiniest leftover, but many tiny useless holes.<\/li>\n  <li><b>Worst Fit:<\/b> take the <b>largest<\/b> hole. Must search the whole list. Leftover is big, but it destroys large holes and usually performs worst.<\/li>\n  <li><b>Next Fit<\/b> is First Fit that resumes from where the last search ended.<\/li>\n  <li>Simulations show First Fit and Best Fit are better than Worst Fit in both speed and utilization. <b>50-percent rule:<\/b> with N allocated blocks, about 0.5N blocks are lost to fragmentation.<\/li>\n <\/ul><\/div>\n <div class=\"card\"><h3>\ud83c\udfaf Idea in one picture<\/h3>\n  <div class=\"flow\" style=\"justify-content:flex-start\">\n   <div class=\"node\">Request<small>212 KB<\/small><\/div><span class=\"arrow\">\u279c<\/span>\n   <div class=\"node\">Hole list<small>100 \u00b7 500 \u00b7 200 \u00b7 300 \u00b7 600<\/small><\/div>\n  <\/div>\n  <table><tr><th>Algorithm<\/th><th>Picks<\/th><th>Hole used<\/th><th>Leftover<\/th><\/tr>\n  <tr><td>First Fit<\/td><td>first \u2265 212<\/td><td>500<\/td><td>288<\/td><\/tr>\n  <tr><td>Best Fit<\/td><td>smallest \u2265 212<\/td><td>300<\/td><td>88<\/td><\/tr>\n  <tr><td>Worst Fit<\/td><td>largest \u2265 212<\/td><td>600<\/td><td>388<\/td><\/tr><\/table>\n  <div class=\"callout\">Classic textbook case: with holes 100, 500, 200, 300, 600 and processes 212, 417, 112, 426 (in KB), only <b>Best Fit<\/b> places all four.<\/div>\n <\/div>\n<\/div>\n<div class=\"card\"><h3>\ud83e\uddea Allocation Simulator (watch the scan)<\/h3>\n <div class=\"ctrl\"><div class=\"tabs\" id=\"algTabs\"><\/div><\/div>\n <div class=\"ctrl\"><label>Holes (KB)<\/label><input id=\"alHoles\" value=\"100,500,200,300,600\" style=\"width:200px\"><label>Processes (KB)<\/label><input id=\"alProcs\" value=\"212,417,112,426\" style=\"width:180px\"><button class=\"btn\" onclick=\"alApply()\">Apply<\/button><\/div>\n <div class=\"ctrl\"><button class=\"btn pri\" onclick=\"alNext()\">\u23ed Next process<\/button><button class=\"btn\" onclick=\"alAuto()\">\u25b6 Auto play<\/button><button class=\"btn\" onclick=\"alReset()\">\u21ba Reset<\/button><\/div>\n <div class=\"queue\" id=\"alQueue\"><\/div>\n <div class=\"memrow\" id=\"memrow\"><\/div>\n <div class=\"log\" id=\"allog\"><\/div>\n<\/div>\n<div class=\"card\"><h3>\u2696\ufe0f Side-by-side result of all three algorithms<\/h3><div class=\"scroll\" id=\"alCompare\"><\/div><\/div>\n<\/section>\n\n<\!-- 03 FRAGMENTATION -->\n<section id=\"frag\" class=\"sec reveal\" data-nav=\"Fragmentation\">\n<h2><span class=\"num\">03<\/span> Fragmentation &amp; Compaction<\/h2>\n<div class=\"grid2\">\n <div class=\"card notes\"><h3>\ud83d\udcdd Notes<\/h3><ul>\n  <li><b>Internal fragmentation:<\/b> wasted space <i>inside<\/i> an allocated block (partition size \u2212 process size). Happens in fixed partitions and in paging (last page).<\/li>\n  <li><b>External fragmentation:<\/b> enough total free memory exists, but it is split into non-adjacent holes, so a big request fails. Happens in variable partitions and in segmentation.<\/li>\n  <li><b>Compaction:<\/b> slide all processes together so the free holes merge into one big hole. Possible only with <b>execution-time binding<\/b> (relocation register) and it costs a lot of CPU and I/O.<\/li>\n  <li><b>Better cure:<\/b> allow a process's memory to be <b>non-contiguous<\/b> (paging, segmentation).<\/li>\n <\/ul><\/div>\n <div class=\"card\"><h3>\ud83d\udd2c Internal fragmentation (8 MB partition)<\/h3>\n  <div class=\"ctrl\"><label>Process size<\/label><input type=\"range\" id=\"ifRange\" min=\"1\" max=\"8\" value=\"5\"><b id=\"ifVal\"><\/b><\/div>\n  <div class=\"part\"><div id=\"ifBar\"><\/div><\/div>\n  <div class=\"big\" id=\"ifOut\"><\/div>\n <\/div>\n<\/div>\n<div class=\"card\"><h3>\ud83c\udfac External fragmentation and compaction (sizes in MB)<\/h3>\n <div class=\"cpbar\" id=\"cpbar\"><\/div>\n <div class=\"ctrl\"><button class=\"btn pri\" onclick=\"cpRequest()\">Request P5 = 25 MB<\/button><button class=\"btn\" onclick=\"cpCompact()\">\ud83e\uddf9 Compact memory<\/button><button class=\"btn\" onclick=\"cpInit()\">\u21ba Reset<\/button><\/div>\n <div class=\"big\" id=\"cpOut\">Total free = 30 MB, but the largest single hole is only 12 MB.<\/div>\n<\/div>\n<\/section>\n\n<\!-- 04 PAGING -->\n<section id=\"paging\" class=\"sec reveal\" data-nav=\"Paging\">\n<h2><span class=\"num\">04<\/span> Non-Contiguous Allocation: Paging<\/h2>\n<div class=\"grid2\">\n <div class=\"card notes\"><h3>\ud83d\udcdd Notes<\/h3><ul>\n  <li><b>Paging:<\/b> physical memory is divided into fixed-size <b>frames<\/b>; logical memory into same-size <b>pages<\/b>. Any page can go in any free frame.<\/li>\n  <li><b>No external fragmentation.<\/b> Only small <b>internal fragmentation<\/b> in the last page.<\/li>\n  <li><b>Logical address = page number (p) | page offset (d).<\/b> For address space 2<sup>m<\/sup> and page size 2<sup>n<\/sup>: p has m\u2212n bits, d has n bits.<\/li>\n  <li><b>Page table:<\/b> one per process, maps page number to frame number. Physical address = <code>frame \u00d7 page size + offset<\/code>.<\/li>\n  <li>Page size is a power of 2 (typically 4 KB), so splitting an address is just taking bits.<\/li>\n  <li>Page table lives in memory (PTBR, PTLR registers). That doubles memory accesses, so a <b>TLB<\/b> (fast associative cache of recent page-table entries) is used. TLB hit: 1 memory access. TLB miss: 2 accesses.<\/li>\n  <li><b>Protection:<\/b> valid-invalid bit, read/write/execute bits in each entry. <b>Sharing:<\/b> processes can map the same frame (shared code, reentrant pages).<\/li>\n  <li>Big address spaces need <b>hierarchical / hashed / inverted<\/b> page tables.<\/li>\n <\/ul><\/div>\n <div class=\"card\"><h3>\ud83d\udd2c Address translation simulator<\/h3>\n  <div class=\"ctrl\"><label>Logical address (0\u20134095)<\/label><input id=\"pgla\" type=\"number\" value=\"2100\" min=\"0\" max=\"4095\" style=\"width:90px\"><button class=\"btn pri\" onclick=\"pgGo()\">\u25b6 Translate<\/button><button class=\"btn\" onclick=\"$('#pgla').value=Math.floor(Math.random()*4096);pgGo()\">\ud83c\udfb2 Random<\/button><\/div>\n  <div class=\"ctrl\"><span style=\"color:var(--muted);font-size:.85rem\">Page size = 1 KB (1024 B) \u2192 2 bits page number + 10 bits offset<\/span><\/div>\n  <div class=\"bits\" id=\"pgbits\">\u2014 \u2014<\/div>\n  <div class=\"tlb\">TLB (2 slots, FIFO): <span class=\"slot\" id=\"tlb0\">\u2014<\/span><span class=\"slot\" id=\"tlb1\">\u2014<\/span><span id=\"tlbmsg\"><\/span><\/div>\n  <div class=\"big\" id=\"pgOut\">Press Translate.<\/div>\n <\/div>\n<\/div>\n<div class=\"card scroll\"><div class=\"pgwrap\" id=\"pgwrap\">\n <svg><\/svg>\n <div class=\"col\"><h4>LOGICAL MEMORY (pages)<\/h4><div id=\"pgLog\"><\/div><\/div>\n <div class=\"col\"><h4>PAGE TABLE<\/h4><div class=\"trow head\"><span>page<\/span><span>frame<\/span><\/div><div id=\"pgTab\"><\/div><\/div>\n <div class=\"col\"><h4>PHYSICAL MEMORY (frames)<\/h4><div id=\"pgPhys\"><\/div><\/div>\n<\/div><\/div>\n<\/section>\n\n<\!-- 05 SEGMENTATION -->\n<section id=\"seg\" class=\"sec reveal\" data-nav=\"Segmentation\">\n<h2><span class=\"num\">05<\/span> Segmentation<\/h2>\n<div class=\"grid2\">\n <div class=\"card notes\"><h3>\ud83d\udcdd Notes<\/h3><ul>\n  <li><b>Segmentation<\/b> follows the programmer's view: a program is a collection of <b>variable-size segments<\/b> (main program, procedures, stack, heap, symbol table, arrays).<\/li>\n  <li><b>Logical address = (segment number s, offset d).<\/b><\/li>\n  <li><b>Segment table<\/b>: each entry holds <b>base<\/b> (start in physical memory) and <b>limit<\/b> (length). STBR and STLR registers locate the table.<\/li>\n  <li>Translation: if <code>d &lt; limit<\/code> then physical = <code>base + d<\/code>, else <b>trap<\/b> (segmentation fault).<\/li>\n  <li>Protection and sharing are natural: attach read/write/execute bits to a whole segment (e.g. code segment read-only, shared).<\/li>\n  <li><b>Pros:<\/b> matches program structure, easy sharing and protection, no internal fragmentation.<\/li>\n  <li><b>Cons:<\/b> <b>external fragmentation<\/b> returns (variable sizes), allocation needs First/Best/Worst Fit again.<\/li>\n <\/ul><\/div>\n <div class=\"card\"><h3>\ud83d\udd2c Segment translation simulator<\/h3>\n  <div class=\"ctrl\"><label>Segment s<\/label><select id=\"sgS\"><\/select><label>Offset d<\/label><input id=\"sgD\" type=\"number\" value=\"53\" style=\"width:90px\"><button class=\"btn pri\" onclick=\"sgGo()\">\u25b6 Translate<\/button><\/div>\n  <div class=\"ctrl\"><button class=\"btn\" onclick=\"sgPre(2,53)\">(2, 53)<\/button><button class=\"btn\" onclick=\"sgPre(3,852)\">(3, 852)<\/button><button class=\"btn\" onclick=\"sgPre(0,1222)\">(0, 1222) \u2192 trap<\/button><button class=\"btn\" onclick=\"sgPre(1,852)\">(1, 852) \u2192 trap<\/button><\/div>\n  <table id=\"sgTab\"><\/table>\n  <div class=\"big\" id=\"sgOut\">Press Translate.<\/div>\n <\/div>\n<\/div>\n<div class=\"card\"><h3>\ud83d\uddfa\ufe0f Physical memory map (0 \u2013 7000)<\/h3>\n <div class=\"pbar\" id=\"sgBar\"><div class=\"marker\" id=\"sgMark\">\u25bc<\/div><\/div>\n<\/div>\n<\/section>\n\n<\!-- 06 SEGMENTED PAGING -->\n<section id=\"segpag\" class=\"sec reveal\" data-nav=\"Segmented Paging\">\n<h2><span class=\"num\">06<\/span> Segmented Paging (Segmentation + Paging)<\/h2>\n<div class=\"grid2\">\n <div class=\"card notes\"><h3>\ud83d\udcdd Notes<\/h3><ul>\n  <li><b>Idea:<\/b> divide the program into segments (logical view), then <b>page each segment<\/b>. Each segment gets its own page table.<\/li>\n  <li><b>Logical address = segment s | page p | offset d.<\/b><\/li>\n  <li>Segment table entry holds the <b>page-table base<\/b> and the <b>segment length<\/b> (in pages), not a memory base.<\/li>\n  <li>Steps: (1) use <i>s<\/i> to find the segment's page table; check <code>p &lt; length<\/code>. (2) use <i>p<\/i> to find the frame <i>f<\/i>. (3) physical = <code>f \u00d7 page size + d<\/code>.<\/li>\n  <li><b>Pros:<\/b> no external fragmentation (paging), keeps sharing and protection per segment. <b>Cons:<\/b> extra table lookups (2 tables, so 3 memory accesses without TLB), more table space. Used by the Intel 386 family.<\/li>\n <\/ul><\/div>\n <div class=\"card\"><h3>\ud83d\udd2c Segmented paging simulator (page = 1 KB)<\/h3>\n  <div class=\"ctrl\"><label>s<\/label><select id=\"spS\"><\/select><label>p<\/label><input id=\"spP\" type=\"number\" value=\"1\" min=\"0\" max=\"3\" style=\"width:60px\"><label>d<\/label><input id=\"spD\" type=\"number\" value=\"100\" min=\"0\" max=\"1023\" style=\"width:80px\"><button class=\"btn pri\" onclick=\"spGo()\">\u25b6 Translate<\/button><\/div>\n  <div class=\"flow\">\n   <div class=\"node\" id=\"sp1\">Logical<small id=\"sp1t\">s | p | d<\/small><\/div><span class=\"arrow\">\u279c<\/span>\n   <div class=\"node\" id=\"sp2\">Segment table<small id=\"sp2t\">s \u2192 page table<\/small><\/div><span class=\"arrow\">\u279c<\/span>\n   <div class=\"node\" id=\"sp3\">Page table of s<small id=\"sp3t\">p \u2192 frame<\/small><\/div><span class=\"arrow\">\u279c<\/span>\n   <div class=\"node\" id=\"sp4\">Physical<small id=\"sp4t\">f \u00d7 1024 + d<\/small><\/div>\n  <\/div>\n  <div class=\"big\" id=\"spOut\">Press Translate.<\/div>\n <\/div>\n<\/div>\n<div class=\"card\"><h3>\ud83d\udcda Tables<\/h3><div class=\"grid3\" id=\"spTabs\"><\/div><\/div>\n<div class=\"card\"><h3>\ud83c\udd9a Paging vs Segmentation vs Segmented Paging<\/h3><div class=\"scroll\">\n<table><tr><th><\/th><th>Paging<\/th><th>Segmentation<\/th><th>Segmented Paging<\/th><\/tr>\n<tr><td>Unit size<\/td><td>Fixed (page)<\/td><td>Variable (segment)<\/td><td>Segments split into fixed pages<\/td><\/tr>\n<tr><td>View<\/td><td>Invisible to programmer<\/td><td>Programmer's logical view<\/td><td>Both<\/td><\/tr>\n<tr><td>Address<\/td><td>p | d<\/td><td>s | d<\/td><td>s | p | d<\/td><\/tr>\n<tr><td>Table entry<\/td><td>frame number<\/td><td>base + limit<\/td><td>page-table base + length<\/td><\/tr>\n<tr><td>Internal frag.<\/td><td class=\"no\">Yes (last page)<\/td><td class=\"ok\">No<\/td><td class=\"no\">Yes (last page)<\/td><\/tr>\n<tr><td>External frag.<\/td><td class=\"ok\">No<\/td><td class=\"no\">Yes<\/td><td class=\"ok\">No<\/td><\/tr>\n<tr><td>Sharing / protection<\/td><td>Per page<\/td><td>Per segment (easy)<\/td><td>Per segment (easy)<\/td><\/tr><\/table><\/div><\/div>\n<\/section>\n\n<\!-- 07 VIRTUAL MEMORY -->\n<section id=\"vm\" class=\"sec reveal\" data-nav=\"Virtual Memory\">\n<h2><span class=\"num\">07<\/span> Virtual Memory Concepts<\/h2>\n<div class=\"grid2\">\n <div class=\"card notes\"><h3>\ud83d\udcdd Notes<\/h3><ul>\n  <li><b>Virtual memory<\/b> separates <b>logical memory<\/b> (what the programmer sees) from <b>physical memory<\/b>. A program can be larger than RAM.<\/li>\n  <li>Reason it works: programs rarely need all code at once (error routines, unused options, big arrays). Only the <b>working set<\/b> is needed. This is <b>locality of reference<\/b>.<\/li>\n  <li><b>Benefits:<\/b> program size not limited by RAM, more programs run at once (higher CPU utilization and throughput), less I/O to load or swap a program, simpler programming.<\/li>\n  <li><b>Virtual address space<\/b> is the logical layout: code at 0, then data, heap growing up, stack growing down. The gap between heap and stack is <b>sparse<\/b> and uses no physical memory until used.<\/li>\n  <li>Enables <b>shared libraries<\/b>, <b>shared memory<\/b> between processes, and fast <code>fork()<\/code> via <b>copy-on-write<\/b>.<\/li>\n  <li>Implemented by <b>demand paging<\/b> (or demand segmentation). Pages not in RAM live on the <b>backing store<\/b> (swap space on disk).<\/li>\n  <li>Risk: too little RAM for the working sets causes <b>thrashing<\/b> (constant page faults, CPU idles).<\/li>\n <\/ul><\/div>\n <div class=\"card\"><h3>\ud83c\udf0c Virtual address space layout<\/h3>\n  <div style=\"display:flex;gap:10px;align-items:stretch\">\n   <div style=\"display:flex;flex-direction:column;justify-content:space-between;color:var(--muted);font-size:.75rem\"><span>max<\/span><span>0<\/span><\/div>\n   <div class=\"vas\" style=\"flex:1\"><div class=\"v-stack\">Stack \u2193 (grows down)<\/div><div class=\"v-hole\">Unused virtual space<br>(no RAM used until touched)<\/div><div class=\"v-heap\">Heap \u2191 (grows up)<\/div><div class=\"v-data\">Data<\/div><div class=\"v-code\">Code<\/div><\/div>\n  <\/div>\n <\/div>\n<\/div>\n<div class=\"card\"><h3>\ud83c\udf9e\ufe0f 32 virtual pages, only 8 live in RAM (working set moves)<\/h3>\n <div class=\"pgrid\" id=\"vmGrid\"><\/div>\n <div class=\"ctrl\"><span class=\"pgrid\" style=\"display:inline-grid;grid-template-columns:auto auto;gap:6px\"><div class=\"res\" style=\"width:22px;height:22px;aspect-ratio:auto\"><\/div><\/span> in RAM &nbsp;&nbsp; <span style=\"display:inline-block;width:22px;height:22px;border:2px dashed var(--border);border-radius:6px;vertical-align:middle\"><\/span> on disk only<\/div>\n<\/div>\n<\/section>\n\n<\!-- 08 DEMAND PAGING -->\n<section id=\"dp\" class=\"sec reveal\" data-nav=\"Demand Paging\">\n<h2><span class=\"num\">08<\/span> Demand Paging<\/h2>\n<div class=\"grid2\">\n <div class=\"card notes\"><h3>\ud83d\udcdd Notes<\/h3><ul>\n  <li><b>Demand paging<\/b> = bring a page into memory <b>only when it is needed<\/b>. Like paging + swapping, but with a <b>lazy swapper (pager)<\/b> that never swaps in a page that will not be used.<\/li>\n  <li><b>Pure demand paging:<\/b> start a process with <b>no pages<\/b> in memory. The first instruction faults, and so on until the working set is loaded.<\/li>\n  <li><b>Valid\u2013invalid bit<\/b> in every page-table entry: <b>v<\/b> = page is legal and in memory; <b>i<\/b> = page is not in memory (or illegal).<\/li>\n  <li>An access to an <b>i<\/b> page raises a <b>page fault<\/b> (trap to the OS).<\/li>\n  <li><b>Hardware support:<\/b> page table with valid/invalid bit, secondary memory (swap space on fast disk), and the ability to <b>restart any instruction<\/b> after a fault.<\/li>\n  <li>Extra rule: if the page is truly illegal (outside the address space), the OS aborts the process, otherwise it loads the page.<\/li>\n  <li>If no free frame exists, a <b>page-replacement<\/b> algorithm (FIFO, LRU, Optimal\u2026) picks a victim. A <b>dirty (modify) bit<\/b> avoids writing back unmodified victims.<\/li>\n <\/ul><\/div>\n <div class=\"card\"><h3>\ud83c\udfac Page-fault handling, step by step<\/h3>\n  <div class=\"flow\" id=\"pfFlow\"><\/div>\n  <div class=\"ctrl\" style=\"justify-content:center\"><button class=\"btn pri\" onclick=\"pfPlay()\">\u25b6 Play steps<\/button><\/div>\n  <div class=\"big\" id=\"pfText\">Press Play to follow one page fault from start to finish.<\/div>\n <\/div>\n<\/div>\n<div class=\"card\"><h3>\ud83e\uddea Demand paging simulator (4 frames, FIFO replacement)<\/h3>\n <div class=\"ctrl\"><label>Reference string<\/label><input id=\"dpRefs\" value=\"7 0 1 2 0 3 0 4 2 3 0 3 2\" style=\"width:280px\"><button class=\"btn\" onclick=\"dpReset()\">Apply / Reset<\/button><\/div>\n <div class=\"refs\" id=\"dpRefRow\"><\/div>\n <div class=\"ctrl\"><button class=\"btn pri\" onclick=\"dpStep()\">\u23ed Next reference<\/button><button class=\"btn\" onclick=\"dpAuto()\">\u25b6 Auto play<\/button><span style=\"color:var(--muted);font-size:.85rem\">or click a page chip to access it manually:<\/span><span id=\"dpChips\" class=\"refs\" style=\"margin:0\"><\/span><\/div>\n <div class=\"stat\"><div>Accesses<b id=\"stAcc\">0<\/b><\/div><div>Page faults<b id=\"stFlt\">0<\/b><\/div><div>Hits<b id=\"stHit\">0<\/b><\/div><div>Fault rate p<b id=\"stP\">\u2013<\/b><\/div><\/div>\n <div class=\"dpgrid\">\n  <div><h4 style=\"margin:0;color:var(--muted)\">PAGE TABLE (virtual pages 0\u20137)<\/h4><div id=\"dpPT\"><\/div><\/div>\n  <div><h4 style=\"margin:0;color:var(--muted)\">RAM FRAMES<\/h4><div id=\"dpRAM\"><\/div><\/div>\n  <div><h4 style=\"margin:0;color:var(--muted)\">DISK (backing store)<\/h4><div id=\"dpDisk\"><\/div><\/div>\n <\/div>\n <div class=\"big\" id=\"dpMsg\">Ready. Frames are empty, so the first references will all fault (pure demand paging).<\/div>\n<\/div>\n<\/section>\n\n<\!-- 09 PERFORMANCE -->\n<section id=\"perf\" class=\"sec reveal\" data-nav=\"Performance\">\n<h2><span class=\"num\">09<\/span> Performance of Demand Paging<\/h2>\n<div class=\"grid2\">\n <div class=\"card notes\"><h3>\ud83d\udcdd Notes<\/h3><ul>\n  <li>Let <b>p<\/b> = page-fault rate (0 \u2264 p \u2264 1). p = 0: no faults. p = 1: every access faults.<\/li>\n  <li><b>Effective Access Time (EAT)<\/b> = <code>(1 \u2212 p) \u00d7 ma + p \u00d7 page-fault time<\/code>, where <b>ma<\/b> = memory access time (\u2248 10\u2013200 ns).<\/li>\n  <li><b>Page-fault service time<\/b> = (a) service the interrupt (1\u2013100 \u00b5s) + (b) <b>read the page from disk<\/b> (\u2248 8 ms on HDD) + (c) restart the process (1\u2013100 \u00b5s). Disk read is about 99.9% of it.<\/li>\n  <li>Worked example: ma = 200 ns, fault time = 8 ms. EAT = (1\u2212p)\u00d7200 + p\u00d78,000,000 = <b>200 + 7,999,800 \u00d7 p<\/b> ns.<\/li>\n  <li>If 1 access in 1000 faults (p = 0.001): EAT \u2248 <b>8.2 \u00b5s<\/b>, a <b>40\u00d7 slowdown<\/b>.<\/li>\n  <li>For &lt; 10% slowdown: 220 &gt; 200 + 7,999,800p, so <b>p &lt; 0.0000025<\/b>, i.e. fewer than 1 fault per ~400,000 accesses.<\/li>\n  <li>If the victim is dirty, a fault costs <b>two disk transfers<\/b> (write victim + read page). The dirty bit halves that for clean pages.<\/li>\n  <li><b>Tuning:<\/b> fast swap space (separate partition, SSD), keep p tiny via good replacement, enough RAM (avoid thrashing), prepaging, memory-mapped files.<\/li>\n <\/ul><\/div>\n <div class=\"card\"><h3>\ud83d\udd2c EAT calculator<\/h3>\n  <div class=\"ctrl\"><label>ma (ns)<\/label><input id=\"pfMa\" type=\"number\" value=\"200\" style=\"width:90px\"><label>Fault time (ms)<\/label><input id=\"pfT\" type=\"number\" value=\"8\" step=\"0.01\" style=\"width:90px\"><\/div>\n  <div class=\"ctrl\"><button class=\"btn\" onclick=\"pfSet(8)\">\ud83d\udcbd HDD 8 ms<\/button><button class=\"btn\" onclick=\"pfSet(0.1)\">SSD \u2248 0.1 ms<\/button><button class=\"btn\" onclick=\"pfSet(0.02)\">NVMe \u2248 0.02 ms<\/button><\/div>\n  <div class=\"ctrl\"><label>p<\/label><input id=\"pfP\" type=\"number\" value=\"0.001\" step=\"any\" style=\"width:120px\"><input id=\"pfSl\" type=\"range\" min=\"0\" max=\"100\" value=\"33\" style=\"flex:1;min-width:120px\"><\/div>\n  <div class=\"stat\"><div>EAT<b id=\"pfEat\">\u2013<\/b><\/div><div>Slowdown<b id=\"pfSlow\">\u2013<\/b><\/div><div>Max p for 10% slowdown<b id=\"pfMax\">\u2013<\/b><\/div><\/div>\n  <div class=\"big mono\" id=\"pfForm\"><\/div>\n  <div class=\"bar3\" id=\"pfBar\"><\/div>\n <\/div>\n<\/div>\n<div class=\"card\"><h3>\ud83d\udcc8 Slowdown vs fault rate (log\u2013log). Dashed line = 10% slowdown<\/h3><canvas id=\"chart\"><\/canvas><\/div>\n<\/section>\n\n<\!-- 10 EXAM -->\n<section id=\"exam\" class=\"sec reveal\" data-nav=\"Practice\">\n<h2><span class=\"num\">10<\/span> Solved Numericals (tap to reveal)<\/h2>\n<div class=\"card\">\n<details><summary>Q1. Holes 100, 500, 200, 300, 600 KB. Processes 212, 417, 112, 426 KB arrive in order. Place them using First, Best and Worst Fit.<\/summary>\n<p><b>First Fit:<\/b> 212\u2192500 (left 288); 417\u2192600 (left 183); 112\u2192288 (left 176); 426 \u2192 no hole \u2265 426, <b>must wait<\/b>.<br>\n<b>Best Fit:<\/b> 212\u2192300 (88); 417\u2192500 (83); 112\u2192200 (88); 426\u2192600 (174). <b>All placed.<\/b><br>\n<b>Worst Fit:<\/b> 212\u2192600 (388); 417\u2192500 (83); 112\u2192388 (276); 426 \u2192 <b>must wait<\/b>.<br>Best Fit wins here. (Use the simulator above to verify.)<\/p><\/details>\n<details><summary>Q2. Page size 4 KB. Page 4 maps to frame 9. Find the physical address of logical address 20000.<\/summary>\n<p>Page = 20000 \u00f7 4096 = <b>4<\/b> (4\u00d74096 = 16384). Offset = 20000 \u2212 16384 = <b>3616<\/b>. Frame 9 \u2192 PA = 9\u00d74096 + 3616 = 36864 + 3616 = <b>40480<\/b>.<\/p><\/details>\n<details><summary>Q3. 32-bit logical address, page size 4 KB, 4-byte page-table entry. How many pages and how big is the page table?<\/summary>\n<p>Offset bits = log\u20824096 = 12. Page bits = 32 \u2212 12 = 20, so pages = 2\u00b2\u2070 = <b>1,048,576<\/b>. Page table = 2\u00b2\u2070 \u00d7 4 B = <b>4 MB per process<\/b> (this is why multi-level page tables exist).<\/p><\/details>\n<details><summary>Q4. Segment table: seg2 base 4300 limit 400; seg1 base 6300 limit 400. Translate (2, 53) and (1, 852).<\/summary>\n<p>(2, 53): 53 &lt; 400 \u2192 PA = 4300 + 53 = <b>4353<\/b>.<br>(1, 852): 852 \u2265 400 \u2192 <b>trap<\/b> (addressing error).<\/p><\/details>\n<details><summary>Q5. Segmented paging, page = 1 KB. Segment 1 page table = [6, 3]. Find the PA of (s=1, p=1, d=100).<\/summary>\n<p>Segment 1 has 2 pages, p = 1 is legal. Frame = 3. PA = 3\u00d71024 + 100 = <b>3172<\/b>.<\/p><\/details>\n<details><summary>Q6. ma = 100 ns, page-fault time = 25 ms, p = 1/1000. Find EAT.<\/summary>\n<p>EAT = 0.999 \u00d7 100 + 0.001 \u00d7 25,000,000 = 99.9 + 25,000 = <b>25,099.9 ns \u2248 25.1 \u00b5s<\/b> (about 250\u00d7 slower than 100 ns).<\/p><\/details>\n<details><summary>Q7. ma = 200 ns, fault time 8 ms. What p keeps the slowdown under 20%?<\/summary>\n<p>EAT &lt; 240: 200 + 7,999,800p &lt; 240, so p &lt; 40 / 7,999,800 \u2248 <b>5.0 \u00d7 10\u207b\u2076<\/b>, i.e. fewer than 1 fault in 200,000 accesses.<\/p><\/details>\n<details><summary>Q8. Process size 7 MB in 8 MB fixed partitions. Internal fragmentation? Why does paging still have it?<\/summary>\n<p>Internal fragmentation = 8 \u2212 7 = <b>1 MB<\/b>. Paging only wastes space in the <b>last page<\/b> (on average half a page), so it is far smaller.<\/p><\/details>\n<\/div>\n<\/section>\n\n<\!-- 11 CHEAT SHEET -->\n<section id=\"cheat\" class=\"sec reveal\" data-nav=\"Cheat Sheet\">\n<h2><span class=\"num\">11<\/span> One-Page Cheat Sheet<\/h2>\n<div class=\"card scroll\"><table>\n<tr><th>Topic<\/th><th>Key formula / rule<\/th><\/tr>\n<tr><td>First / Best / Worst Fit<\/td><td>first hole \u2265 n / smallest hole \u2265 n / largest hole \u2265 n<\/td><\/tr>\n<tr><td>Internal fragmentation<\/td><td>partition size \u2212 process size<\/td><\/tr>\n<tr><td>Contiguous protection<\/td><td>if (logical &lt; limit) physical = logical + base else trap<\/td><\/tr>\n<tr><td>Paging address<\/td><td>p = LA \u00f7 page size, d = LA mod page size, PA = frame \u00d7 page size + d<\/td><\/tr>\n<tr><td>Bits<\/td><td>LA = m bits, page = 2\u207f \u2192 page bits = m \u2212 n, offset bits = n<\/td><\/tr>\n<tr><td>Page-table size<\/td><td>number of pages \u00d7 entry size<\/td><\/tr>\n<tr><td>Segmentation<\/td><td>if (d &lt; limit[s]) PA = base[s] + d else trap<\/td><\/tr>\n<tr><td>Segmented paging<\/td><td>PA = frame(PT[s][p]) \u00d7 page size + d, check p &lt; length[s]<\/td><\/tr>\n<tr><td>Demand paging<\/td><td>valid bit v = in RAM, i = not in RAM \u2192 page fault<\/td><\/tr>\n<tr><td>Fault steps<\/td><td>trap \u2192 check legal \u2192 find frame \u2192 read disk \u2192 update table \u2192 restart<\/td><\/tr>\n<tr><td>EAT<\/td><td>(1 \u2212 p) \u00d7 ma + p \u00d7 page-fault time<\/td><\/tr>\n<tr><td>TLB access<\/td><td>hit = 1 memory access, miss = 2 memory accesses (single-level table)<\/td><\/tr>\n<\/table><\/div>\n<footer>Next topic in the syllabus: Page Replacement (FIFO, Optimal, LRU) \u00b7 Thrashing \u00b7 Working Set.<\/footer>\n<\/section>\n<\/main>\n\n<script>\nconst $=(s,r=document)=>r.querySelector(s);\nconst $$=(s,r=document)=>[...r.querySelectorAll(s)];\nconst sleep=ms=>new Promise(r=>setTimeout(r,ms));\nconst COLORS=['#7c5cff','#0ea5a4','#ef4444','#d97706','#2563eb','#db2777','#65a30d','#9333ea'];\nconst clamp=(v,a,b)=>Math.max(a,Math.min(b,v));\n\n/* ================= THEMES + BACKGROUND ================= */\nconst THEMES=[['galaxy','\ud83c\udf0c Galaxy'],['blackhole','\ud83d\udd73\ufe0f Black Hole'],['supernova','\ud83d\udca5 Supernova'],['aurora','\ud83c\udf3f Aurora'],['cyber','\u26a1 Cyberpunk Neon'],['ocean','\ud83c\udf0a Deep Ocean'],['sunset','\ud83c\udf07 Sunset Retro'],['paper','\ud83d\udcc4 Light Paper']];\nconst cv=$('#bg'),cx=cv.getContext('2d');\nlet W=0,H=0,T=0,mode='galaxy',P=[],Q=[];\nfunction resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;initBg(mode);}\nfunction initBg(m){\n  mode=m;P=[];Q=[];const R=Math.random;\n  if(m==='galaxy'){for(let i=0;i<230;i++)P.push({x:R()*W,y:R()*H,r:R()*1.6+.3,ph:R()*6.28,sp:.6+R()*2.2});}\n  if(m==='blackhole'){for(let i=0;i<650;i++){const r=95+R()*280;P.push({a:R()*6.28,r,w:.9/Math.pow(r/100,1.5),s:.6+R()*1.8,h:18+R()*34});}for(let i=0;i<80;i++)Q.push({x:R()*W,y:R()*H,r:R()*1.2+.2,ph:R()*6});}\n  if(m==='supernova'){Q=[{r:0}];}\n  if(m==='aurora'){for(let i=0;i<120;i++)Q.push({x:R()*W,y:R()*H*.7,r:R()*1.3+.2,ph:R()*6,sp:1+R()*2});}\n  if(m==='ocean'){for(let i=0;i<70;i++)P.push({x:R()*W,y:R()*H,r:2+R()*11,vy:.3+R()*1.1,ph:R()*6.28});for(let i=0;i<70;i++)Q.push({x:R()*W,y:R()*H,r:1+R()*2.5,ph:R()*6.28,vx:(R()-.5)*.3,vy:(R()-.5)*.3,g:R()>.5});}\n  if(m==='sunset'){for(let i=0;i<7;i++)P.push({x:R()*W,y:H*(.15+R()*.4),w:140+R()*220,s:.15+R()*.4});for(let i=0;i<90;i++)Q.push({x:R()*W,y:R()*H*.45,r:R()*1.3+.2,ph:R()*6});}\n  if(m==='paper'){for(let i=0;i<34;i++)P.push({x:R()*W,y:R()*H,r:20+R()*70,vx:(R()-.5)*.25,vy:(R()-.5)*.25,c:R()>.5?'79,70,229':'13,148,136'});}\n}\nfunction frame(){\n  T+=.016;cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,W,H);cx.globalCompositeOperation='source-over';cx.globalAlpha=1;\n  const R=Math.random;\n  if(mode==='galaxy'){\n    for(const s of P){const a=.35+.65*Math.abs(Math.sin(T*s.sp+s.ph));cx.fillStyle=`rgba(255,255,255,${a})`;cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.3);cx.fill();}\n    if(R()<.012)Q.push({x:R()*W,y:R()*H*.5,vx:6+R()*5,vy:2+R()*3,l:1});\n    for(let i=Q.length-1;i>=0;i--){const s=Q[i];s.x+=s.vx;s.y+=s.vy;s.l-=.02;cx.strokeStyle=`rgba(200,210,255,${s.l})`;cx.lineWidth=2;cx.beginPath();cx.moveTo(s.x,s.y);cx.lineTo(s.x-s.vx*5,s.y-s.vy*5);cx.stroke();if(s.l<=0)Q.splice(i,1);}\n  }\n  else if(mode==='blackhole'){\n    const x0=W*.5,y0=H*.45,k=Math.min(W,H)/800;\n    for(const s of Q){cx.fillStyle=`rgba(255,235,210,${.3+.4*Math.abs(Math.sin(T+s.ph))})`;cx.fillRect(s.x,s.y,s.r,s.r);}\n    const g=cx.createRadialGradient(x0,y0,40*k,x0,y0,380*k);g.addColorStop(0,'rgba(255,150,50,.35)');g.addColorStop(1,'rgba(255,150,50,0)');cx.fillStyle=g;cx.fillRect(0,0,W,H);\n    const draw=front=>{for(const p of P){p.a+=p.w*.016*2.2;const sn=Math.sin(p.a);if((sn>0)!==front)continue;const x=x0+Math.cos(p.a)*p.r*k*1.25,y=y0+sn*p.r*k*.3;cx.fillStyle=`hsla(${p.h},100%,${60+ (300-p.r)/8}%,${.55+.4*Math.cos(p.a)*0})`;cx.beginPath();cx.arc(x,y,p.s*k+.3,0,6.3);cx.fill();}};\n    cx.globalCompositeOperation='lighter';draw(false);cx.globalCompositeOperation='source-over';\n    const bg=cx.createRadialGradient(x0,y0,50*k,x0,y0,95*k);bg.addColorStop(0,'#000');bg.addColorStop(.85,'#000');bg.addColorStop(1,'rgba(255,200,120,.9)');\n    cx.fillStyle=bg;cx.beginPath();cx.arc(x0,y0,95*k,0,6.3);cx.fill();\n    cx.globalCompositeOperation='lighter';draw(true);cx.globalCompositeOperation='source-over';\n  }\n  else if(mode==='supernova'){\n    const x0=W*.5,y0=H*.45;\n    cx.globalCompositeOperation='lighter';\n    const g=cx.createRadialGradient(x0,y0,0,x0,y0,200+40*Math.sin(T*3));g.addColorStop(0,'rgba(255,240,150,.55)');g.addColorStop(.4,'rgba(255,100,30,.25)');g.addColorStop(1,'rgba(255,40,0,0)');cx.fillStyle=g;cx.fillRect(0,0,W,H);\n    for(let i=0;i<7;i++){const a=R()*6.28,v=1+R()*6;P.push({x:x0,y:y0,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,d:.006+R()*.014,h:R()*55,s:1+R()*3});}\n    for(let i=P.length-1;i>=0;i--){const p=P[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.995;p.vy*=.995;p.l-=p.d;if(p.l<=0||p.x<-50||p.x>W+50||p.y<-50||p.y>H+50){P.splice(i,1);continue;}cx.fillStyle=`hsla(${p.h},100%,55%,${p.l})`;cx.beginPath();cx.arc(p.x,p.y,p.s*p.l+.4,0,6.3);cx.fill();}\n    const rr=(T*160)%Math.max(W,H);cx.strokeStyle=`rgba(255,160,60,${1-rr/Math.max(W,H)})`;cx.lineWidth=3;cx.beginPath();cx.arc(x0,y0,rr,0,6.3);cx.stroke();\n  }\n  else if(mode==='aurora'){\n    for(const s of Q){cx.fillStyle=`rgba(255,255,255,${.3+.6*Math.abs(Math.sin(T*s.sp+s.ph))})`;cx.fillRect(s.x,s.y,s.r,s.r);}\n    cx.globalCompositeOperation='lighter';\n    for(let b=0;b<4;b++){const base=H*(.12+b*.07),hue=[150,170,190,130][b];const g=cx.createLinearGradient(0,0,0,260);g.addColorStop(0,`hsla(${hue},95%,60%,0)`);g.addColorStop(.35,`hsla(${hue},95%,60%,.5)`);g.addColorStop(1,`hsla(${hue},95%,60%,0)`);cx.fillStyle=g;\n      for(let x=0;x<W;x+=5){const y=base+Math.sin(x*.004+T*.5+b)*60+Math.sin(x*.011-T*.8+b*2)*25;cx.setTransform(1,0,0,1,0,y);cx.globalAlpha=.25+.4*Math.abs(Math.sin(x*.006+T*.7+b));cx.fillRect(x,0,5,260);}\n      cx.setTransform(1,0,0,1,0,0);}\n    cx.globalAlpha=1;\n  }\n  else if(mode==='cyber'){\n    const hz=H*.58;\n    const sg=cx.createLinearGradient(0,hz-220,0,hz);sg.addColorStop(0,'rgba(255,43,214,.9)');sg.addColorStop(1,'rgba(0,240,255,.7)');\n    cx.fillStyle=sg;cx.beginPath();cx.arc(W/2,hz,Math.min(W,H)*.2,Math.PI,0);cx.fill();\n    cx.globalCompositeOperation='destination-out';for(let i=0;i<7;i++){const y=hz-i*i*3-8-((T*10)%12);cx.fillRect(0,y,W,2+i*.9);}cx.globalCompositeOperation='source-over';\n    cx.lineWidth=1.6;cx.shadowBlur=10;cx.shadowColor='#ff2bd6';cx.strokeStyle='rgba(255,43,214,.8)';\n    for(let i=-24;i<=24;i++){cx.beginPath();cx.moveTo(W/2+i*8,hz);cx.lineTo(W/2+i*(W/9),H);cx.stroke();}\n    cx.shadowColor='#00f0ff';cx.strokeStyle='rgba(0,240,255,.75)';\n    for(let k=0;k<14;k++){const t=((k+T*.5)%14)/14,y=hz+(H-hz)*t*t;cx.beginPath();cx.moveTo(0,y);cx.lineTo(W,y);cx.stroke();}\n    cx.shadowBlur=0;cx.strokeStyle='rgba(0,240,255,.8)';cx.beginPath();cx.moveTo(0,hz);cx.lineTo(W,hz);cx.stroke();\n  }\n  else if(mode==='ocean'){\n    cx.globalCompositeOperation='lighter';\n    for(let i=0;i<5;i++){const x=W*(.1+i*.2)+Math.sin(T*.3+i)*60;const g=cx.createLinearGradient(x,0,x+120,H*.8);g.addColorStop(0,'rgba(120,220,255,.10)');g.addColorStop(1,'rgba(120,220,255,0)');cx.fillStyle=g;cx.beginPath();cx.moveTo(x,0);cx.lineTo(x+90,0);cx.lineTo(x+260,H*.8);cx.lineTo(x+60,H*.8);cx.fill();}\n    cx.globalCompositeOperation='source-over';\n    for(const q of Q){q.x+=q.vx;q.y+=q.vy;if(q.x<0)q.x=W;if(q.x>W)q.x=0;if(q.y<0)q.y=H;if(q.y>H)q.y=0;const a=.3+.7*Math.abs(Math.sin(T*1.5+q.ph));const g=cx.createRadialGradient(q.x,q.y,0,q.x,q.y,q.r*6);const c=q.g?'79,255,208':'37,208,255';g.addColorStop(0,`rgba(${c},${a})`);g.addColorStop(1,`rgba(${c},0)`);cx.fillStyle=g;cx.beginPath();cx.arc(q.x,q.y,q.r*6,0,6.3);cx.fill();}\n    for(const b of P){b.y-=b.vy;b.x+=Math.sin(T*1.4+b.ph)*.5;if(b.y<-20){b.y=H+20;b.x=Math.random()*W;}cx.strokeStyle='rgba(150,235,255,.55)';cx.fillStyle='rgba(37,208,255,.08)';cx.lineWidth=1.2;cx.beginPath();cx.arc(b.x,b.y,b.r,0,6.3);cx.fill();cx.stroke();cx.fillStyle='rgba(255,255,255,.6)';cx.beginPath();cx.arc(b.x-b.r*.35,b.y-b.r*.35,b.r*.18,0,6.3);cx.fill();}\n  }\n  else if(mode==='sunset'){\n    for(const s of Q){cx.fillStyle=`rgba(255,255,255,${.25+.5*Math.abs(Math.sin(T+s.ph))})`;cx.fillRect(s.x,s.y,s.r,s.r);}\n    const sx=W*.5,sy=H*.62,sr=Math.min(W,H)*.2*(1+.02*Math.sin(T));\n    const g=cx.createLinearGradient(0,sy-sr,0,sy+sr);g.addColorStop(0,'#ffe066');g.addColorStop(.5,'#ff8a4a');g.addColorStop(1,'#ff3d8b');\n    const gl=cx.createRadialGradient(sx,sy,sr*.8,sx,sy,sr*2.2);gl.addColorStop(0,'rgba(255,150,80,.35)');gl.addColorStop(1,'rgba(255,150,80,0)');cx.fillStyle=gl;cx.fillRect(0,0,W,H);\n    cx.fillStyle=g;cx.beginPath();cx.arc(sx,sy,sr,0,6.3);cx.fill();\n    cx.globalCompositeOperation='destination-out';for(let i=0;i<8;i++){const y=sy+sr*.05+i*sr*.14+((T*8)%(sr*.14));cx.fillRect(sx-sr,y,sr*2,2+i*1.6);}cx.globalCompositeOperation='source-over';\n    for(const c of P){c.x+=c.s;if(c.x>W+c.w)c.x=-c.w;cx.fillStyle='rgba(255,190,220,.2)';cx.beginPath();cx.ellipse(c.x,c.y,c.w/2,16,0,0,6.3);cx.fill();cx.beginPath();cx.ellipse(c.x+c.w*.2,c.y-8,c.w/3,12,0,0,6.3);cx.fill();}\n    cx.fillStyle='rgba(30,5,50,.55)';cx.beginPath();cx.moveTo(0,H);for(let x=0;x<=W;x+=40)cx.lineTo(x,H*.86+Math.sin(x*.01)*14+Math.sin(x*.037)*8);cx.lineTo(W,H);cx.fill();\n  }\n  else if(mode==='paper'){\n    for(const b of P){b.x+=b.vx;b.y+=b.vy;if(b.x<-100)b.x=W+100;if(b.x>W+100)b.x=-100;if(b.y<-100)b.y=H+100;if(b.y>H+100)b.y=-100;const g=cx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);g.addColorStop(0,`rgba(${b.c},.12)`);g.addColorStop(1,`rgba(${b.c},0)`);cx.fillStyle=g;cx.beginPath();cx.arc(b.x,b.y,b.r,0,6.3);cx.fill();}\n    cx.fillStyle='rgba(60,70,110,.09)';for(let x=20;x<W;x+=36)for(let y=20;y<H;y+=36)cx.fillRect(x,y,1.5,1.5);\n  }\n  requestAnimationFrame(frame);\n}\nfunction setTheme(name){\n  document.body.dataset.theme=name;$$('#themes button').forEach(b=>b.classList.toggle('act',b.dataset.t===name));\n  initBg(name);try{localStorage.setItem('memlab-theme',name)}catch(e){}\n  if(typeof perfDraw==='function')perfDraw();\n}\n$('#themes').innerHTML=THEMES.map(t=>`<button data-t=\"${t[0]}\">${t[1]}<\/button>`).join('');\n$('#themes').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setTheme(b.dataset.t);});\naddEventListener('resize',()=>{resize();if(typeof perfDraw==='function')perfDraw();$$('.pgwrap svg').forEach(s=>s.innerHTML='');});\n\n/* ================= NAV + REVEAL + PROGRESS ================= */\n$('#nav').innerHTML=$$('section.sec').map(s=>`<a href=\"#${s.id}\">${s.dataset.nav}<\/a>`).join('');\nconst io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in')}),{threshold:.05});\n$$('.reveal').forEach(r=>io.observe(r));\naddEventListener('scroll',()=>{const h=document.documentElement;$('#prog').style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%';});\n\n/* ================= 01 MMU ================= */\nasync function mmuRun(){\n  const la=+$('#mmuLa').value,base=+$('#mmuBase').value,lim=+$('#mmuLim').value;\n  ['m1','m2','m3','m4'].forEach(i=>$('#'+i).className='node');\n  $('#m1t').textContent='logical '+la;$('#m2t').textContent=la+' < '+lim+' ?';$('#m3t').textContent='adder';$('#m4t').textContent='physical';\n  $('#mmuOut').textContent='CPU generates logical address '+la+'\u2026';\n  $('#m1').classList.add('on');await sleep(800);\n  $('#m1').classList.remove('on');$('#m2').classList.add('on');await sleep(800);\n  if(la<lim&&la>=0){\n    $('#m2').className='node good';$('#m3').classList.add('on');$('#m3t').textContent=la+' + '+base;await sleep(800);\n    $('#m3').className='node good';$('#m4').classList.add('good');$('#m4t').textContent='PA = '+(la+base);\n    $('#mmuOut').innerHTML='\u2705 '+la+' &lt; '+lim+' \u2192 physical address = '+la+' + '+base+' = <b>'+(la+base)+'<\/b>';\n  }else{\n    $('#m2').className='node bad';$('#m4t').textContent='access blocked';\n    $('#mmuOut').innerHTML='\ud83d\udeab '+la+' \u2265 limit '+lim+' \u2192 <b>trap to OS<\/b> (addressing error)';\n  }\n}\n\n/* ================= 02 ALLOCATION ================= */\nconst NAME={first:'First Fit',best:'Best Fit',worst:'Worst Fit'};\nconst AL={alg:'first',holes:[100,500,200,300,600],procs:[212,417,112,426],state:[],next:0,res:[],busy:false,tok:0};\n$('#algTabs').innerHTML=Object.keys(NAME).map(k=>`<button class=\"btn ${k==='first'?'act':''}\" data-a=\"${k}\">${NAME[k]}<\/button>`).join('');\n$('#algTabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;AL.alg=b.dataset.a;$$('#algTabs button').forEach(x=>x.classList.toggle('act',x===b));alReset();});\nconst freeOf=h=>h.size-h.al.reduce((a,b)=>a+b.s,0);\nfunction logAl(t){const l=$('#allog');l.insertAdjacentHTML('beforeend','<div>'+t+'<\/div>');l.scrollTop=l.scrollHeight;}\nfunction renderAl(hi={}){\n  const tot=AL.state.reduce((a,h)=>a+h.size,0)||1;\n  $('#memrow').innerHTML=AL.state.map((h,i)=>{\n    let cls='hole';if(hi.scan===i)cls+=' scan';if(hi.chosen===i)cls+=' chosen';if((hi.rej||[]).includes(i))cls+=' rej';\n    const f=freeOf(h);\n    const inner=h.al.map(a=>`<div class=\"chunk\" style=\"flex:${a.s} 1 0;background:${COLORS[a.id%COLORS.length]}\">P${a.id+1}<small>${a.s}<\/small><\/div>`).join('')+`<div class=\"chunk free\" style=\"flex:${f} 1 0\">${f>0?f+' free':''}<\/div>`;\n    return `<div class=\"${cls}\" style=\"flex:${Math.max(h.size,tot*.09)} 1 0;min-width:84px\"><div class=\"hh\">Hole ${i+1}<b>${h.size} KB<\/b><\/div><div class=\"hb\">${inner}<\/div><\/div>`;\n  }).join('');\n  $('#alQueue').innerHTML=AL.procs.map((s,i)=>{let c='qchip',t='P'+(i+1)+' \u00b7 '+s+' KB';\n    if(i<AL.next){if(AL.res[i]>=0){c+=' done';t+=' \u2714 Hole '+(AL.res[i]+1);}else{c+=' wait';t+=' \u23f3 waits';}}else if(i===AL.next)c+=' cur';\n    return `<span class=\"${c}\">${t}<\/span>`;}).join('');\n}\nfunction alReset(){AL.tok++;AL.busy=false;AL.state=AL.holes.map(s=>({size:s,al:[]}));AL.next=0;AL.res=[];$('#allog').innerHTML='';renderAl();logAl('Ready. Algorithm: <b>'+NAME[AL.alg]+'<\/b>. Press <b>Next process<\/b> or <b>Auto play<\/b>.');alCompare();}\nfunction alApply(){\n  const parse=s=>s.split(/[\\s,]+/).map(Number).filter(n=>n>0).slice(0,8);\n  const h=parse($('#alHoles').value),p=parse($('#alProcs').value);\n  if(h.length&&p.length){AL.holes=h;AL.procs=p;}alReset();\n}\nasync function alNext(){\n  if(AL.busy)return false;\n  if(AL.next>=AL.procs.length){logAl('All processes handled.');return false;}\n  AL.busy=true;const tok=AL.tok,id=AL.next,size=AL.procs[id];\n  logAl(`<b>P${id+1}<\/b> requests <b>${size} KB<\/b> using <b>${NAME[AL.alg]}<\/b>.`);\n  const fr=AL.state.map(freeOf);let best=-1;const rej=[];\n  for(let i=0;i<fr.length;i++){\n    renderAl({scan:i,rej});await sleep(600);if(tok!==AL.tok)return false;\n    const fits=fr[i]>=size;\n    if(!fits){rej.push(i);logAl(`Hole ${i+1}: ${fr[i]} KB free is too small \u2716`);continue;}\n    if(AL.alg==='first'){best=i;logAl(`Hole ${i+1}: ${fr[i]} KB \u2265 ${size} \u2192 first one that fits, <b>stop scanning<\/b> \u2705`);break;}\n    const prev=best,better=prev<0||(AL.alg==='best'?fr[i]<fr[prev]:fr[i]>fr[prev]);\n    if(better)best=i;\n    logAl(`Hole ${i+1}: ${fr[i]} KB fits. `+(better?'New best candidate \u2b50':`Not better than Hole ${prev+1}.`));\n  }\n  if(best>=0){\n    renderAl({chosen:best});await sleep(700);if(tok!==AL.tok)return false;\n    AL.state[best].al.push({id,s:size});AL.res[id]=best;\n    logAl(`\u2705 P${id+1} placed in <b>Hole ${best+1}<\/b>. Leftover there: ${freeOf(AL.state[best])} KB.`);\n  }else{\n    AL.res[id]=-1;const tf=AL.state.reduce((a,h)=>a+freeOf(h),0);\n    logAl(`\u274c No single hole \u2265 ${size} KB. P${id+1} must wait. Total free is ${tf} KB but scattered \u2192 <b>external fragmentation<\/b>.`);\n  }\n  AL.next++;AL.busy=false;renderAl();return true;\n}\nasync function alAuto(){const tok=AL.tok;while(AL.next<AL.procs.length&&tok===AL.tok){if(AL.busy){await sleep(200);continue;}await alNext();await sleep(500);}}\nfunction simulate(alg,holes,procs){\n  const free=holes.slice(),res=[];\n  procs.forEach(p=>{let idx=-1;free.forEach((f,i)=>{if(f<p)return;if(idx<0)idx=i;else if(alg==='best'&&f<free[idx])idx=i;else if(alg==='worst'&&f>free[idx])idx=i;});\n    if(alg==='first'){idx=free.findIndex(f=>f>=p);}\n    if(idx>=0)free[idx]-=p;res.push(idx);});\n  return {res,free};\n}\nfunction alCompare(){\n  const algs=['first','best','worst'],sims=algs.map(a=>simulate(a,AL.holes,AL.procs)),tot=AL.holes.reduce((a,b)=>a+b,0);\n  let h='<table><tr><th>Process<\/th>'+algs.map(a=>'<th>'+NAME[a]+'<\/th>').join('')+'<\/tr>';\n  AL.procs.forEach((p,i)=>{h+=`<tr><td>P${i+1} (${p} KB)<\/td>`+sims.map(s=>s.res[i]>=0?`<td class=\"ok\">Hole ${s.res[i]+1}<\/td>`:'<td class=\"no\">\u2716 waits<\/td>').join('')+'<\/tr>';});\n  h+='<tr><td>Holes after<\/td>'+sims.map(s=>'<td>'+s.free.join(' \u00b7 ')+'<\/td>').join('')+'<\/tr>';\n  h+='<tr><td>Placed<\/td>'+sims.map(s=>'<td>'+s.res.filter(x=>x>=0).length+' / '+AL.procs.length+'<\/td>').join('')+'<\/tr>';\n  h+='<tr><td>Memory used<\/td>'+sims.map(s=>{const u=AL.procs.filter((_,i)=>s.res[i]>=0).reduce((a,b)=>a+b,0);return `<td><div style=\"height:10px;border-radius:6px;background:var(--inbg);overflow:hidden\"><div style=\"height:100%;width:${(u/tot*100).toFixed(0)}%;background:linear-gradient(90deg,var(--accent),var(--accent2))\"><\/div><\/div>${(u/tot*100).toFixed(0)}%<\/td>`;}).join('')+'<\/tr><\/table>';\n  $('#alCompare').innerHTML=h;\n}\n\n/* ================= 03 FRAGMENTATION ================= */\nfunction ifUpd(){const v=+$('#ifRange').value;$('#ifVal').textContent=' '+v+' MB';$('#ifBar').style.width=(v/8*100)+'%';$('#ifBar').textContent='Process '+v+' MB';$('#ifOut').innerHTML='Internal fragmentation = 8 \u2212 '+v+' = <b>'+(8-v)+' MB<\/b> wasted inside the partition.';}\n$('#ifRange').addEventListener('input',ifUpd);ifUpd();\nlet CP=[],cpDone=false;\nfunction cpInit(){\n  CP=[{id:'os',n:'OS',l:0,w:8,c:'#64748b'},{id:'p1',n:'P1',l:8,w:18,c:COLORS[0]},{id:'f1',free:1,l:26,w:10},{id:'p2',n:'P2',l:36,w:14,c:COLORS[1]},{id:'f2',free:1,l:50,w:8},{id:'p3',n:'P3',l:58,w:16,c:COLORS[2]},{id:'f3',free:1,l:74,w:12},{id:'p4',n:'P4',l:86,w:14,c:COLORS[3]}];\n  cpDone=false;\n  $('#cpbar').innerHTML=CP.map(b=>`<div class=\"cpb ${b.free?'free':''}\" id=\"cp_${b.id}\" style=\"left:${b.l}%;width:${b.w}%;${b.free?'':'background:'+b.c}\">${b.free?b.w+' MB':b.n}<small>${b.free?'free':b.w+' MB'}<\/small><\/div>`).join('')+`<div class=\"cpb\" id=\"cp_p5\" style=\"left:70%;width:25%;background:${COLORS[4]};opacity:0;pointer-events:none;z-index:3\">P5<small>25 MB<\/small><\/div>`;\n  $('#cpOut').textContent='Total free = 30 MB, but the largest single hole is only 12 MB.';\n}\nfunction cpCompact(){\n  if(cpDone)return;let x=0;\n  ['os','p1','p2','p3','p4','f1','f2','f3'].forEach(id=>{const b=CP.find(q=>q.id===id);b.l=x;x+=b.w;$('#cp_'+id).style.left=b.l+'%';});\n  cpDone=true;$('#cpOut').innerHTML='\ud83e\uddf9 Compacted: all free space is now one <b>30 MB<\/b> hole at the end. Now try the 25 MB request.';\n}\nfunction cpRequest(){\n  if(!cpDone){const bar=$('#cpbar');bar.classList.remove('shake');void bar.offsetWidth;bar.classList.add('shake');$('#cpOut').innerHTML='\u274c P5 needs 25 MB contiguous. Largest hole is 12 MB \u2192 <b>external fragmentation<\/b> blocks it even though 30 MB is free.';}\n  else{$('#cp_p5').style.opacity=1;$('#cpOut').innerHTML='\u2705 After compaction the 30 MB hole fits P5 (25 MB). 5 MB stays free.';}\n}\ncpInit();\n\n/* ================= 04 PAGING ================= */\nfunction arrow(wrapId,a,b){\n  const w=$('#'+wrapId),svg=$('svg',w),wr=w.getBoundingClientRect(),ar=a.getBoundingClientRect(),br=b.getBoundingClientRect();\n  const x1=ar.right-wr.left,y1=ar.top+ar.height/2-wr.top,x2=br.left-wr.left,y2=br.top+br.height/2-wr.top,dx=(x2-x1)/2;\n  const ns='http://www.w3.org/2000/svg',p=document.createElementNS(ns,'path');\n  p.setAttribute('d',`M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`);p.setAttribute('class','arr');svg.appendChild(p);\n  const L=p.getTotalLength();p.style.strokeDasharray=L;p.style.str
