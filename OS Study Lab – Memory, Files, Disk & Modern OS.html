m}}\n@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}\n\n/* ---------- memory visuals ---------- */\n.mem{position:relative;height:70px;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}\n.mem.tall{height:84px}\n.blk{position:absolute;top:0;bottom:0;display:grid;place-items:center;text-align:center;font:600 .72rem/1.15 var(--font-mono);overflow:hidden;white-space:nowrap;border-right:2px solid var(--bg);transition:left .6s ease,width .6s ease,background .3s;min-width:0;padding:0 2px}\n.blk.used{background:var(--c,#7aa7ff);color:#10121c;cursor:pointer}\n.blk.used:hover{filter:brightness(1.12)}\n.blk.free{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--line) 6px 7px);color:var(--muted);font-weight:400}\n.blk.os{background:repeating-linear-gradient(-45deg,var(--line) 0 6px,transparent 6px 12px);color:var(--fg);border-right:3px solid var(--accent)}\n.blk.busy{background:var(--line);color:var(--muted);font-weight:400}\n.blk.part{background:transparent;box-shadow:inset 0 0 0 2px var(--accent2);z-index:1}\n.blk.fresh{animation:pop .7s ease}\n.blk.merge{animation:flash .8s ease}\n.blk.bad{animation:shake .5s ease}\n@keyframes pop{0%{filter:brightness(1.9);transform:scaleY(.6)}100%{filter:none;transform:none}}\n@keyframes flash{0%{background-color:var(--pos)}100%{}}\n@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}\n.blk .in{display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.1;pointer-events:none}\n.blk .in small{font-weight:400;font-size:.62rem;opacity:.85}\n.pslot{position:absolute;top:0;bottom:0;border-right:2px solid var(--bg);display:flex;align-items:stretch;min-width:0;transition:left .5s,width .5s}\n.pslot .cap-lbl{position:absolute;left:4px;bottom:2px;font:400 .6rem var(--font-mono);color:var(--muted);z-index:2;pointer-events:none}\n.pslot .fill{background:var(--c);height:100%;display:grid;place-items:center;color:#10121c;font:600 .72rem var(--font-mono);overflow:hidden;white-space:nowrap;cursor:pointer;transition:width .5s}\n.pslot .gap{flex:1;background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--neg) 55%,transparent) 0 3px,transparent 3px 7px);min-width:0}\n.pslot.empty{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--line) 6px 7px)}\n.ruler{position:relative;height:22px;font:400 .66rem var(--font-mono);color:var(--muted)}\n.ruler span{position:absolute;top:2px;transform:translateX(-50%);white-space:nowrap}\n.ruler span:first-child{transform:none}.ruler span:last-child{transform:translateX(-100%)}\n.ruler::before{content:\"\";position:absolute;left:0;right:0;top:0;height:1px;background:var(--line)}\n.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}\n.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px;border:1px solid var(--line)}\n.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px}\n.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}\n.stat b{display:block;font-family:var(--font-display);font-size:1.15rem;color:var(--accent2);font-variant-numeric:tabular-nums}\n.stat span{font-size:.72rem;color:var(--muted);font-family:var(--font-mono);letter-spacing:.04em;text-transform:uppercase}\n.stat.warn b{color:var(--neg)}\n.log{font-family:var(--font-mono);font-size:.8rem;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:3.6em;margin:0}\n.log .ok{color:var(--pos)}.log .no{color:var(--neg)}\n.ok{color:var(--pos)}.no{color:var(--neg)}\n.chipset{display:flex;flex-wrap:wrap;gap:6px;min-height:34px}\n.pc{font:600 .78rem var(--font-mono);background:var(--c);color:#10121c;border:0;border-radius:8px;padding:5px 9px;cursor:pointer}\n.pc:hover{filter:brightness(1.12)}\n.pc.wait{background:transparent;color:var(--fg);border:1px dashed var(--accent2)}\n.fld{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:end}\n.fld label{display:flex;flex-direction:column;gap:2px;font-size:.78rem;color:var(--muted);font-family:var(--font-mono)}\n.fld input,.fld select{font:inherit;font-size:.95rem;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}\n.fld input[type=number]{width:7.5em}\n.fld select option{color:#111;background:#fff}\n.hex{font-family:var(--font-mono);color:var(--accent2)}\n/* pipeline */\n.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}\n.stg{flex:1 1 118px;min-width:0;position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center;cursor:pointer;font:inherit;color:var(--fg);transition:.25s}\n.stg b{display:block;font-family:var(--font-mono);font-size:.7rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}\n.stg span{display:block;font-size:.88rem;margin-top:2px}\n.stg.art{border-style:dashed}\n.stg[aria-pressed=\"true\"]{background:var(--accent);color:var(--ink);border-color:transparent;transform:translateY(-3px);box-shadow:0 8px 20px -8px var(--accent)}\n.stg[aria-pressed=\"true\"] b,.stg[aria-pressed=\"true\"] .hex{color:var(--ink)}\n.stg.done{border-color:var(--accent2)}\n.track{position:relative;height:6px;border-radius:9px;background:var(--line);margin:12px 0}\n.track i{position:absolute;left:0;top:-5px;width:16px;height:16px;border-radius:50%;background:var(--accent2);box-shadow:0 0 14px var(--accent2);transition:left .7s ease}\n.tree{display:flex;flex-direction:column;gap:8px}\n.tnode{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer;text-align:left}\n.tnode[aria-pressed=\"true\"]{background:var(--accent);color:var(--ink);border-color:transparent;font-weight:700}\n.trow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}\n.tkids{margin-left:clamp(8px,3vw,28px);padding-left:12px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:8px}\n.callout{border-left:4px solid var(--accent2);background:var(--panel);padding:10px 14px;border-radius:0 10px 10px 0;max-width:80ch}\n.callout.warn{border-color:var(--neg)}\n.callout b{font-family:var(--font-mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase}\n.formula{font-family:var(--font-mono);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;overflow-x:auto;max-width:100%}\n.opts{display:grid;gap:8px}\n.opt{font:inherit;text-align:left;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer}\n.opt.right{border-color:var(--pos);background:color-mix(in srgb,var(--pos) 22%,transparent)}\n.opt.wrong{border-color:var(--neg);background:color-mix(in srgb,var(--neg) 22%,transparent)}\n.qq{padding:14px 0;border-bottom:1px solid var(--line)}\n.qq:last-child{border-bottom:0}\n.hierarchy{display:flex;flex-direction:column;align-items:center;gap:0}\n.hl{height:46px;display:grid;place-items:center;font-size:.85rem;border:1px solid var(--line);background:var(--panel);text-align:center;padding:0 8px;min-width:0}\n.hl small{display:block;color:var(--muted);font-size:.7rem}\n.mini{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:.8rem}\n.mini b{font-family:var(--font-mono);font-size:.7rem;color:var(--muted);text-transform:uppercase}\n.hide{display:none}\n.sbar{height:26px;border-radius:7px;display:flex;align-items:center;padding-left:8px;font:600 .72rem var(--font-mono);color:#10121c;transition:width .4s;min-width:0;overflow:hidden;white-space:nowrap}\n@media (prefers-reduced-motion:reduce){*{animation:none!important}}\n<\/style>\n<canvas id=\"bg\" aria-hidden=\"true\"><\/canvas>\n<header class=\"top\">\n  <div class=\"top-in\">\n    <div class=\"brand\"><span class=\"logo\"><\/span><span>OS <small>Memory notes<\/small><\/span><\/div>\n    <div class=\"themes\" id=\"themes\" role=\"group\" aria-label=\"Choose a theme\"><\/div>\n    <button class=\"btn ghost\" id=\"pauseBtn\" aria-pressed=\"false\">Pause motion<\/button>\n  <\/div>\n  <div class=\"prog\"><i id=\"progbar\"><\/i><\/div>\n<\/header>\n\n<main class=\"wrap\">\n\n<\!-- HERO -->\n<section class=\"card\" id=\"top\">\n  <p class=\"eyebrow\">Operating Systems \u00b7 Memory Management<\/p>\n  <h1>Memory Management, Linking, Binding and Contiguous Allocation<\/h1>\n  <p class=\"lead\" style=\"margin-top:12px\">Every topic here has a diagram you can poke. Read the one-line summary, play with the simulation, then check the green Remember box. The last section is built for quick revision.<\/p>\n  <div class=\"grid2\" style=\"margin-top:18px\">\n    <div class=\"stack\">\n      <div class=\"mem tall\" id=\"heroMem\" aria-label=\"Animated memory demo\"><\/div>\n      <div class=\"ruler\" id=\"heroRuler\"><\/div>\n      <p class=\"cap\" id=\"heroSay\">Watch: processes arrive, take memory and leave. This is what the OS memory manager does all day.<\/p>\n    <\/div>\n    <div class=\"stack\">\n      <div>\n        <h3>Map of this page<\/h3>\n        <ul class=\"chips\">\n          <li><a href=\"#s1\"><b>1<\/b>Why memory management<\/a><\/li>\n          <li><a href=\"#s2\"><b>2<\/b>Loading and linking<\/a><\/li>\n          <li><a href=\"#s3\"><b>3<\/b>Address binding<\/a><\/li>\n          <li><a href=\"#s4\"><b>4<\/b>Techniques<\/a><\/li>\n          <li><a href=\"#s5\"><b>5<\/b>Fixed partitions<\/a><\/li>\n          <li><a href=\"#s6\"><b>6<\/b>Variable partitions<\/a><\/li>\n          <li><a href=\"#rev\"><b>\u2605<\/b>Revision and quiz<\/a><\/li>\n        <\/ul>\n      <\/div>\n      <ol class=\"steps\"><li><b>Look<\/b> at the diagram.<\/li><li><b>Play<\/b> with the controls.<\/li><li><b>Revise<\/b> using Remember boxes, flashcards and the cheat sheet.<\/li><\/ol>\n      <p class=\"cap\">The theme bar changes the look instantly and your choice is remembered on this device.<\/p>\n    <\/div>\n  <\/div>\n<\/section>\n\n<\!-- 1 -->\n<section class=\"card\" id=\"s1\">\n  <p class=\"eyebrow\">Section 1<\/p>\n  <h2>Why does the OS manage memory?<\/h2>\n  <p class=\"tldr\"><b>10 sec<\/b><span>A program must be in main memory (RAM) to run. Many programs share one RAM, so the OS must decide who gets which bytes, keep them from touching each other, and reuse memory when a program ends.<\/span><\/p>\n\n  <div class=\"grid2\">\n    <div class=\"stack\">\n      <h3>The memory hierarchy (top is fast and small)<\/h3>\n      <div class=\"hierarchy\" id=\"hier\"><\/div>\n      <p class=\"cap\">Speeds and sizes are typical orders of magnitude, not exact. The CPU can only execute from registers and read instructions and data from main memory, so RAM is the crowded middle layer the OS must manage.<\/p>\n    <\/div>\n    <div class=\"stack\">\n      <h3>Five jobs of the memory manager<\/h3>\n      <div class=\"grid3\" style=\"grid-template-columns:repeat(auto-fit,minmax(150px,1fr))\">\n        <div class=\"panel\"><b class=\"hex\">Track<\/b><p class=\"cap\" style=\"margin:4px 0 0\">Which bytes are free and which belong to which process.<\/p><\/div>\n        <div class=\"panel\"><b class=\"hex\">Allocate<\/b><p class=\"cap\" style=\"margin:4px 0 0\">Give memory on request, take it back on exit.<\/p><\/div>\n        <div class=\"panel\"><b class=\"hex\">Relocate<\/b><p class=\"cap\" style=\"margin:4px 0 0\">A program can be loaded anywhere and still work.<\/p><\/div>\n        <div class=\"panel\"><b class=\"hex\">Protect<\/b><p class=\"cap\" style=\"margin:4px 0 0\">One process cannot read or write another's memory.<\/p><\/div>\n        <div class=\"panel\"><b class=\"hex\">Share<\/b><p class=\"cap\" style=\"margin:4px 0 0\">Allow safe sharing, such as one copy of a library.<\/p><\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"sub\">\n    <h3>Why multiprogramming needs memory management: CPU utilisation<\/h3>\n    <div class=\"grid2\">\n      <div class=\"stack\">\n        <p class=\"cap\" style=\"margin:0\">Model: if each process waits for I/O a fraction <i>p<\/i> of the time, and <i>n<\/i> processes are in memory at once, the CPU is idle only when all <i>n<\/i> wait together.<\/p>\n        <div class=\"formula\">CPU utilisation = 1 \u2212 p<sup>n<\/sup><\/div>\n        <div class=\"ctl\"><label for=\"mpP\">I/O wait p<\/label><input type=\"range\" id=\"mpP\" min=\"10\" max=\"95\" value=\"80\"><output id=\"mpPo\"><\/output><\/div>\n        <div class=\"ctl\"><label for=\"mpN\">Processes n<\/label><input type=\"range\" id=\"mpN\" min=\"1\" max=\"12\" value=\"3\"><output id=\"mpNo\"><\/output><\/div>\n      <\/div>\n      <div class=\"stack\">\n        <div id=\"mpCpu\" class=\"mem\" style=\"height:46px\"><\/div>\n        <div class=\"stats\"><div class=\"stat\"><b id=\"mpU\">0%<\/b><span>CPU busy<\/span><\/div><div class=\"stat\"><b id=\"mpI\">0%<\/b><span>CPU idle<\/span><\/div><\/div>\n        <p class=\"cap\" style=\"margin:0\">More processes in memory means a busier CPU, but each process needs its own memory. Memory size therefore limits the degree of multiprogramming.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n  <p class=\"remember\"><b>Remember<\/b>Memory manager = track, allocate, relocate, protect, share. More programs in RAM means better CPU use, which is why memory must be managed well.<\/p>\n<\/section>\n\n<\!-- 2 -->\n<section class=\"card\" id=\"s2\">\n  <p class=\"eyebrow\">Section 2<\/p>\n  <h2>Loading and linking<\/h2>\n  <p class=\"tldr\"><b>10 sec<\/b><span>Your source code becomes a running process in stages. The <b>compiler<\/b> makes object files, the <b>linker<\/b> joins them into one executable, and the <b>loader<\/b> copies that executable into memory and starts it.<\/span><\/p>\n\n  <h3 style=\"margin-bottom:8px\">From source file to running process (click a stage or press Play)<\/h3>\n  <div class=\"flow\" id=\"flow\"><\/div>\n  <div class=\"track\" aria-hidden=\"true\"><i id=\"packet\"><\/i><\/div>\n  <div class=\"row\" style=\"margin-bottom:10px\">\n    <button class=\"btn ghost\" id=\"pPrev\">Previous<\/button>\n    <button class=\"btn\" id=\"pPlay\">Play<\/button>\n    <button class=\"btn ghost\" id=\"pNext\">Next<\/button>\n  <\/div>\n  <div class=\"panel\" id=\"stgInfo\" aria-live=\"polite\"><\/div>\n\n  <div class=\"sub\">\n    <h3>Linker and loader simulation: how an address gets fixed<\/h3>\n    <p class=\"cap\" style=\"margin:0\">Program <span class=\"hex\">main.o<\/span> calls a function <span class=\"hex\">sum<\/span> that lives in a different file <span class=\"hex\">sum.o<\/span>. Step through and watch the address of that call change meaning.<\/p>\n    <div class=\"tabs\" id=\"lkTabs\" role=\"group\" aria-label=\"Link and load steps\"><\/div>\n    <div class=\"mem tall\" id=\"lkMem\"><\/div>\n    <div class=\"ruler\" id=\"lkRuler\"><\/div>\n    <div class=\"grid2\">\n      <div class=\"panel scroll-x\"><table id=\"lkTbl\" style=\"min-width:300px\"><\/table><\/div>\n      <div class=\"stack\">\n        <div id=\"lkBaseBox\" class=\"hide\">\n          <div class=\"ctl\"><label for=\"lkBase\">Load address<\/label><input type=\"range\" id=\"lkBase\" min=\"0\" max=\"3\" step=\"1\" value=\"1\"><output id=\"lkBaseO\"><\/output><\/div>\n        <\/div>\n        <p class=\"panel\" id=\"lkSay\" style=\"margin:0\" aria-live=\"polite\"><\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"sub\">\n    <h3>Static linking vs dynamic linking: how much memory is used?<\/h3>\n    <p class=\"cap\" style=\"margin:0\">Each program is 200 KB of its own code and uses a 800 KB library. Add processes and compare.<\/p>\n    <div class=\"ctl\"><label for=\"sdN\">Processes running<\/label><input type=\"range\" id=\"sdN\" min=\"1\" max=\"8\" value=\"4\"><output id=\"sdNo\"><\/output><\/div>\n    <div class=\"grid2\">\n      <div class=\"stack\" id=\"sdStatic\"><\/div>\n      <div class=\"stack\" id=\"sdDyn\"><\/div>\n    <\/div>\n    <p class=\"panel\" id=\"sdSay\" style=\"margin:0\" aria-live=\"polite\"><\/p>\n  <\/div>\n\n  <div class=\"sub\">\n    <h3>Static vs dynamic, side by side<\/h3>\n    <div class=\"scroll-x\"><table>\n      <tr><th><\/th><th>Static linking<\/th><th>Dynamic linking (shared libs)<\/th><\/tr>\n      <tr><td>When<\/td><td>At link time, library copied into the executable<\/td><td>At load time or run time, executable holds only a stub<\/td><\/tr>\n      <tr><td>Executable size<\/td><td>Large<\/td><td>Small<\/td><\/tr>\n      <tr><td>Memory<\/td><td>Every process has its own copy<\/td><td>One shared copy in memory (needs OS support)<\/td><\/tr>\n      <tr><td>Library update<\/td><td>Must re-link every program<\/td><td>Fixed once, all programs benefit<\/td><\/tr>\n      <tr><td>Risk<\/td><td>Wasted space<\/td><td>Missing or wrong library version at run time<\/td><\/tr>\n      <tr><td>Examples<\/td><td>Older UNIX binaries<\/td><td><span class=\"mono\">.dll<\/span> on Windows, <span class=\"mono\">.so<\/span> on Linux<\/td><\/tr>\n    <\/table><\/div>\n  <\/div>\n\n  <div class=\"sub\">\n    <h3>Types of loaders<\/h3>\n    <div class=\"scroll-x\"><table>\n      <tr><th>Loader<\/th><th>What it does<\/th><th>Limitation<\/th><\/tr>\n      <tr><td>Absolute loader<\/td><td>Puts each byte at the exact address written in the file<\/td><td>Program must be placed at one fixed location<\/td><\/tr>\n      <tr><td>Relocating loader<\/td><td>Adds the load address to every address field using relocation info<\/td><td>Patching costs time at load<\/td><\/tr>\n      <tr><td>Direct-linking loader<\/td><td>Does linking and relocating together, resolves external names<\/td><td>Needs extra tables in the object file<\/td><\/tr>\n      <tr><td>Dynamic loading<\/td><td>A routine is loaded only when first called<\/td><td>Programmer or runtime must request it; saves space for rarely used code<\/td><\/tr>\n      <tr><td>Bootstrap loader<\/td><td>Tiny program that loads the OS at power-on<\/td><td>Stored in ROM or firmware<\/td><\/tr>\n    <\/table><\/div>\n  <\/div>\n  <p class=\"remember\"><b>Remember<\/b>Compiler: source to object. Linker: objects + libraries to executable (resolves external symbols). Loader: executable to memory (assigns real addresses). Static = copy library in. Dynamic = share it at run time.<\/p>\n<\/section>\n<\!-- 3 -->\n<section class=\"card\" id=\"s3\">\n  <p class=\"eyebrow\">Section 3<\/p>\n  <h2>Address binding<\/h2>\n  <p class=\"tldr\"><b>10 sec<\/b><span>Binding means turning the names and addresses in your program into real memory addresses. It can happen at <b>compile time<\/b>, <b>load time<\/b> or <b>execution time<\/b>. The later it happens, the more freely the OS can move the process.<\/span><\/p>\n\n  <h3 style=\"margin-bottom:8px\">One variable, three kinds of address<\/h3>\n  <div class=\"flow\" id=\"addrChain\">\n    <div class=\"stg\"><b>Source code<\/b><span>Symbolic<br><span class=\"hex\">count<\/span><\/span><\/div>\n    <div class=\"stg\"><b>Compiler output<\/b><span>Relocatable<br><span class=\"hex\">14 bytes from module start<\/span><\/span><\/div>\n    <div class=\"stg\"><b>Linker / loader<\/b><span>Absolute<br><span class=\"hex\">base + 14 = 74014<\/span><\/span><\/div>\n  <\/div>\n  <p class=\"cap\">Logical (virtual) address = the address the CPU generates. Physical address = the address that reaches the memory chips. In compile-time and load-time binding they are equal. In execution-time binding they differ and the hardware translates them.<\/p>\n\n  <div class=\"sub\">\n    <h3>When does binding happen? Pick a time, then try to move the process<\/h3>\n    <div class=\"tabs\" id=\"bindTabs\" role=\"group\" aria-label=\"Binding time\"><\/div>\n    <div class=\"grid2\">\n      <div class=\"stack\">\n        <div class=\"mem tall\" id=\"bindMem\"><\/div>\n        <div class=\"ruler\" id=\"bindRuler\"><\/div>\n        <div class=\"row\">\n          <button class=\"btn\" id=\"bindMove\">Move process to a new place<\/button>\n          <button class=\"btn ghost\" id=\"bindReset\">Reset<\/button>\n        <\/div>\n        <p class=\"panel\" id=\"bindSay\" style=\"margin:0\" aria-live=\"polite\"><\/p>\n      <\/div>\n      <div class=\"panel\"><dl class=\"kv\" id=\"bindInfo\"><\/dl><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"sub\">\n    <h3>Execution-time binding in hardware: the MMU with relocation and limit registers<\/h3>\n    <p class=\"cap\" style=\"margin:0\">The Memory Management Unit checks every CPU address against the <b>limit<\/b> register, then adds the <b>relocation (base)<\/b> register. Drag the sliders.<\/p>\n    <div class=\"mem tall\" id=\"mmuMem\"><\/div>\n    <div class=\"ruler\" id=\"mmuRuler\"><\/div>\n    <div class=\"grid2\">\n      <div class=\"stack\">\n        <div class=\"ctl\"><label for=\"mmuBase\">Base register<\/label><input type=\"range\" id=\"mmuBase\" min=\"2000\" max=\"12000\" step=\"500\" value=\"6000\"><output id=\"mmuBaseO\"><\/output><\/div>\n        <div class=\"ctl\"><label for=\"mmuLim\">Limit register<\/label><input type=\"range\" id=\"mmuLim\" min=\"1000\" max=\"4000\" step=\"250\" value=\"3000\"><output id=\"mmuLimO\"><\/output><\/div>\n        <div class=\"ctl\"><label for=\"mmuLa\">Logical address<\/label><input type=\"range\" id=\"mmuLa\" min=\"0\" max=\"5000\" step=\"50\" value=\"1200\"><output id=\"mmuLaO\"><\/output><\/div>\n        <div class=\"row\">\n          <button class=\"btn ghost\" id=\"mmuValid\">Valid address<\/button>\n          <button class=\"btn ghost\" id=\"mmuEdge\">Last valid byte<\/button>\n          <button class=\"btn ghost\" id=\"mmuTrap\">Out of range<\/button>\n        <\/div>\n      <\/div>\n      <div class=\"stack\">\n        <div class=\"formula\" id=\"mmuForm\"><\/div>\n        <p class=\"panel\" id=\"mmuSay\" style=\"margin:0\" aria-live=\"polite\"><\/p>\n      <\/div>\n    <\/div>\n    <p class=\"cap\" style=\"margin:0\">Memory protection comes for free: a process can never reach below its base or at or above base + limit. The base and limit registers are loaded by the OS (a privileged instruction) when it switches to that process.<\/p>\n  <\/div>\n\n  <div class=\"sub\">\n    <h3>Compare the three binding times<\/h3>\n    <div class=\"scroll-x\"><table>\n      <tr><th><\/th><th>Compile time<\/th><th>Load time<\/th><th>Execution time<\/th><\/tr>\n      <tr><td>Who binds<\/td><td>Compiler<\/td><td>Loader<\/td><td>CPU and MMU, on every access<\/td><\/tr>\n      <tr><td>Code form<\/td><td>Absolute code<\/td><td>Relocatable code<\/td><td>Logical addresses only<\/td><\/tr>\n      <tr><td>Must load at fixed place?<\/td><td>Yes<\/td><td>Chosen at load, then fixed<\/td><td>No<\/td><\/tr>\n      <tr><td>Move after start?<\/td><td>No<\/td><td>No (reload needed)<\/td><td>Yes (swap, compaction)<\/td><\/tr>\n      <tr><td>Hardware needed<\/td><td>None<\/td><td>None<\/td><td>Base/limit registers or MMU<\/td><\/tr>\n      <tr><td>Used in<\/td><td>MS-DOS .COM files<\/td><td>Simple batch systems<\/td><td>Almost all modern OSes<\/td><\/tr>\n    <\/table><\/div>\n  <\/div>\n  <p class=\"remember\"><b>Remember<\/b>Physical = base + logical, valid only if logical &lt; limit. Compile time = fixed place. Load time = placed once. Execution time = can move, needs hardware. Modern OSes use execution-time binding.<\/p>\n<\/section>\n\n<\!-- 4 -->\n<section class=\"card\" id=\"s4\">\n  <p class=\"eyebrow\">Section 4<\/p>\n  <h2>Memory management techniques<\/h2>\n  <p class=\"tldr\"><b>10 sec<\/b><span>The big split is how a process sits in memory. <b>Contiguous<\/b>: one unbroken block. <b>Non-contiguous<\/b>: pieces in different places (paging, segmentation). This page goes deep on contiguous: fixed and variable partitions.<\/span><\/p>\n\n  <h3 style=\"margin-bottom:8px\">Family tree (click a box)<\/h3>\n  <div class=\"grid2\">\n    <div class=\"tree\" id=\"tree\"><\/div>\n    <div class=\"panel stack\" id=\"techInfo\" aria-live=\"polite\"><\/div>\n  <\/div>\n\n  <div class=\"sub\">\n    <h3>Why non-contiguous can help: a process that needs 8 units<\/h3>\n    <p class=\"cap\" style=\"margin:0\">Memory has three small holes (3 + 2 + 4 = 9 units free) but no single hole is big enough. Change the process size and the mode.<\/p>\n    <div class=\"mem tall\" id=\"ncMem\"><\/div>\n    <div class=\"ruler\" id=\"ncRuler\"><\/div>\n    <div class=\"fld\">\n      <label for=\"ncSize\">Process size (units)<input type=\"number\" id=\"ncSize\" min=\"1\" max=\"12\" value=\"8\"><\/label>\n      <div class=\"tabs\" id=\"ncMode\" role=\"group\" aria-label=\"Allocation mode\"><\/div>\n    <\/div>\n    <p class=\"panel\" id=\"ncSay\" style=\"margin:0\" aria-live=\"polite\"><\/p>\n  <\/div>\n\n  <div class=\"sub\">\n    <h3>Swapping: using the disk to make room<\/h3>\n    <p class=\"cap\" style=\"margin:0\">RAM holds 3 processes. Click one in RAM to swap it out to the backing store, or click one on disk to bring it back (needs a free slot).<\/p>\n    <div class=\"grid2\">\n      <div class=\"panel stack\"><b>RAM (3 slots)<\/b><div class=\"chipset\" id=\"swRam\"><\/div><\/div>\n      <div class=\"panel stack\"><b>Backing store (disk)<\/b><div class=\"chipset\" id=\"swDisk\"><\/div><\/div>\n    <\/div>\n    <p class=\"panel\" id=\"swSay\" style=\"margin:0\" aria-live=\"polite\"><\/p>\n    <div class=\"callout\"><b>Swap time example<\/b><p style=\"margin:6px 0 0\">A 100 MB process on a disk that moves 50 MB/s takes 100 / 50 = 2 s to swap out and another 2 s to swap in. Almost all of that is transfer time, so swapping big processes is expensive. Only idle or low-priority processes are good candidates.<\/p><\/div>\n  <\/div>\n\n  <div class=\"sub\">\n    <h3>Techniques at a glance<\/h3>\n    <div class=\"scroll-x\"><table>\n      <tr><th>Technique<\/th><th>Process occupies<\/th><th>Fragmentation<\/th><th>Needs<\/th><\/tr>\n      <tr><td>Single contiguous<\/td><td>All user memory<\/td><td>Unused memory wasted<\/td><td>Nothing (one user)<\/td><\/tr>\n      <tr><td>Fixed partitions<\/td><td>One fixed-size partition<\/td><td>Internal<\/td><td>Base/limit or bounds check<\/td><\/tr>\n      <tr><td>Variable partitions<\/td><td>One block of exact size<\/td><td>External<\/td><td>Base/limit, hole list<\/td><\/tr>\n      <tr><td>Paging<\/td><td>Fixed-size frames, scattered<\/td><td>Small internal (last page)<\/td><td>Page table, MMU<\/td><\/tr>\n      <tr><td>Segmentation<\/td><td>Variable segments, scattered<\/td><td>External<\/td><td>Segment table, MMU<\/td><\/tr>\n      <tr><td>Virtual memory<\/td><td>Only needed pages in RAM<\/td><td>As paging<\/td><td>Page faults, disk swap area<\/td><\/tr>\n    <\/table><\/div>\n  <\/div>\n  <p class=\"remember\"><b>Remember<\/b>Contiguous = one block per process (fixed or variable partitions). Non-contiguous = scattered pieces (paging, segmentation). Swapping moves whole processes to disk and back.<\/p>\n<\/section>\n<\!-- 5 -->\n<section class=\"card\" id=\"s5\">\n  <p class=\"eyebrow\">Section 5 \u00b7 Contiguous allocation<\/p>\n  <h2>Fixed (static) partitions<\/h2>\n  <p class=\"tldr\"><b>10 sec<\/b><span>Memory is cut into partitions <b>once, at system start<\/b>. Each partition holds <b>one<\/b> process. If the process is smaller than its partition, the leftover space inside is wasted. That waste is <b>internal fragmentation<\/b>.<\/span><\/p>\n\n  <div class=\"grid3\">\n    <div class=\"panel\"><b class=\"hex\">Sizes fixed<\/b><p class=\"cap\" style=\"margin:4px 0 0\">Equal-size or unequal-size partitions, decided when the OS is configured.<\/p><\/div>\n    <div class=\"panel\"><b class=\"hex\">One job each<\/b><p class=\"cap\" style=\"margin:4px 0 0\">Degree of multiprogramming = number of partitions.<\/p><\/div>\n    <div class=\"panel\"><b class=\"hex\">Waste inside<\/b><p class=\"cap\" style=\"margin:4px 0 0\">Internal fragmentation = partition size \u2212 process size.<\/p><\/div>\n  <\/div>\n\n  <div class=\"sub\">\n    <h3>Fixed-partition simulator<\/h3>\n    <p class=\"cap\" style=\"margin:0\">Pick a scheme and a placement rule, enter a size, then admit processes. Hatched red area = internal fragmentation. Click a running process to terminate it. Waiting processes enter the first partition that fits when one frees up.<\/p>\n    <div class=\"fld\">\n      <label for=\"fpScheme\">Partitions<select id=\"fpScheme\"><\/select><\/label>\n      <label for=\"fpPolicy\">Placement rule<select id=\"fpPolicy\"><\/select><\/label>\n      <label for=\"fpSize\">Process size (KB)<input type=\"number\" id=\"fpSize\" min=\"1\" max=\"700\" value=\"212\"><\/label>\n      <button class=\"btn\" id=\"fpAdd\">Admit process<\/button>\n      <button class=\"btn ghost\" id=\"fpSeq\">Run textbook sequence<\/button>\n      <button class=\"btn ghost\" id=\"fpReset\">Reset<\/button>\n    <\/div>\n    <div class=\"mem tall\" id=\"fpMem\"><\/div>\n    <div class=\"ruler\" id=\"fpRuler\"><\/div>\n    <div class=\"legend\"><span><i style=\"background:var(--accent2)\"><\/i>Process<\/span><span><i style=\"background:repeating-linear-gradient(45deg,var(--neg) 0 3px,transparent 3px 7px)\"><\/i>Internal fragmentation<\/span><span><i style=\"background:repeating-linear-gradient(135deg,transparent 0 5px,var(--line) 5px 6px)\"><\/i>Empty partition<\/span><\/div>\n    <div class=\"grid2\">\n      <div class=\"stack\">\n        <div class=\"stats\" id=\"fpStats\"><\/div>\n        <div><span class=\"cap\">Running (click to terminate)<\/span><div class=\"chipset\" id=\"fpRun\"><\/div><\/div>\n        <div><span class=\"cap\">Waiting queue<\/span><div class=\"chipset\" id=\"fpWait\"><\/div><\/div>\n      <\/div>\n      <p class=\"log\" id=\"fpLog\" aria-live=\"polite\"><\/p>\n    <\/div>\n  <\/div>\n\n  <div class=\"sub\">\n    <h3>Worked example: same partitions, three placement rules<\/h3>\n    <p class=\"cap\" style=\"margin:0\">Partitions in address order: 100K, 500K, 200K, 300K, 600K. Processes arrive in order: 212K, 417K, 112K, 426K. (Press <i>Run textbook sequence<\/i> above, with the Textbook scheme, to watch each rule.)<\/p>\n    <div class=\"scroll-x\"><table>\n      <tr><th>Rule<\/th><th>212K goes to<\/th><th>417K goes to<\/th><th>112K goes to<\/th><th>426K goes to<\/th><th>Internal frag. so far<\/th><\/tr>\n      <tr><td>First fit<\/td><td>500K (288 wasted)<\/td><td>600K (183)<\/td><td>200K (88)<\/td><td class=\"no\">waits, none fits<\/td><td>559K<\/td><\/tr>\n      <tr><td>Best fit<\/td><td>300K (88)<\/td><td>500K (83)<\/td><td>200K (88)<\/td><td>600K (174)<\/td><td>433K, all placed<\/td><\/tr>\n      <tr><td>Worst fit<\/td><td>600K (388)<\/td><td>500K (83)<\/td><td>300K (188)<\/td><td class=\"no\">waits, none fits<\/td><td>659K<\/td><\/tr>\n    <\/table><\/div>\n    <p class=\"cap\" style=\"margin:0\">Best fit placed all four processes here, but that is not guaranteed in general. Always trace the rule step by step in exams.<\/p>\n  <\/div>\n\n  <div class=\"grid2\" style=\"margin-top:22px\">\n    <div class=\"panel yes\"><h3 class=\"ok\">Advantages<\/h3><ul style=\"margin:0;padding-left:1.1em\"><li>Very simple to implement<\/li><li>Little OS overhead: a small table of partitions<\/li><li>Fast allocation: pick a free partition<\/li><\/ul><\/div>\n    <div class=\"panel no\"><h3 class=\"no\">Disadvantages<\/h3><ul style=\"margin:0;padding-left:1.1em\"><li>Internal fragmentation<\/li><li>Number of processes is capped by number of partitions<\/li><li>A process bigger than the largest partition can never run<\/li><li>Free partitions may sit idle while others have long queues<\/li><\/ul><\/div>\n  <\/div>\n  <div class=\"callout\" style=\"margin-top:14px\"><b>Queue organisation<\/b><p style=\"margin:6px 0 0\">With unequal partitions the OS can keep <b>one queue per partition<\/b> (each process waits for the smallest partition it fits, which minimises waste but can leave big partitions idle) or <b>a single queue<\/b> (a process takes any free partition that fits, which keeps memory busier but wastes more).<\/p><\/div>\n  <p class=\"remember\"><b>Remember<\/b>Fixed partitions: created once, one process each, internal fragmentation, limited multiprogramming. Internal frag = partition \u2212 process. Best fit minimises waste per process.<\/p>\n<\/section>\n\n<\!-- 6 -->\n<section class=\"card\" id=\"s6\">\n  <p class=\"eyebrow\">Section 6 \u00b7 Contiguous allocation<\/p>\n  <h2>Variable (dynamic) partitions<\/h2>\n  <p class=\"tldr\"><b>10 sec<\/b><span>No pre-cut slots. When a process arrives, the OS carves out a block of <b>exactly its size<\/b> from a free <b>hole<\/b>. When it leaves, its block becomes a hole again. Over time holes get scattered: <b>external fragmentation<\/b>.<\/span><\/p>\n\n  <div class=\"sub\" style=\"margin-top:12px\">\n    <h3>Variable-partition simulator (900 KB user area)<\/h3>\n    <p class=\"cap\" style=\"margin:0\">Choose a placement algorithm, enter a size and allocate. Click a process to free it (adjacent holes merge). Try the fragmented example, then ask for a block bigger than any single hole.<\/p>\n    <div class=\"fld\">\n      <label for=\"vpAlgo\">Algorithm<select id=\"vpAlgo\"><\/select><\/label>\n      <label for=\"vpSize\">Request (KB)<input type=\"number\" id=\"vpSize\" min=\"1\" max=\"900\" value=\"120\"><\/label>\n      <button class=\"btn\" id=\"vpAlloc\">Allocate<\/button>\n      <button class=\"btn ghost\" id=\"vpRand\">Random request<\/button>\n      <button class=\"btn ghost\" id=\"vpCompact\">Compact<\/button>\n      <button class=\"btn ghost\" id=\"vpPreset\">Fragmented example<\/button>\n      <button class=\"btn ghost\" id=\"vpReset\">Reset<\/button>\n    <\/div>\n    <div class=\"mem tall\" id=\"vpMem\"><\/div>\n    <div class=\"ruler\" id=\"vpRuler\"><\/div>\n    <div class=\"legend\"><span><i style=\"background:var(--accent2)\"><\/i>Process<\/span><span><i style=\"background:repeating-linear-gradient(135deg,transparent 0 5px,var(--line) 5px 6px)\"><\/i>Hole (free)<\/span><span><i style=\"background:repeating-linear-gradient(-45deg,var(--line) 0 5px,transparent 5px 10px)\"><\/i>OS<\/span><\/div>\n    <div class=\"grid2\">\n      <div class=\"stack\">\n        <div class=\"stats\" id=\"vpStats\"><\/div>\n        <div><span class=\"cap\">Running (click to free)<\/span><div class=\"chipset\" id=\"vpRun\"><\/div><\/div>\n      <\/div>\n      <p class=\"log\" id=\"vpLog\" aria-live=\"polite\"><\/p>\n    <\/div>\n  <\/div>\n\n  <div class=\"sub\">\n    <h3>The four placement algorithms<\/h3>\n    <div class=\"grid2\" style=\"grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))\">\n      <div class=\"panel\"><b class=\"hex\">First fit<\/b><p class=\"cap\" style=\"margin:4px 0 0\">Scan from the start. Take the <b>first<\/b> hole that is big enough. Fast.<\/p><\/div>\n      <div class=\"panel\"><b class=\"hex\">Next fit<\/b><p class=\"cap\" style=\"margin:4px 0 0\">Like first fit but resume scanning from <b>where the last allocation ended<\/b>. Spreads allocations along memory.<\/p><\/div>\n      <div class=\"panel\"><b class=\"hex\">Best fit<\/b><p class=\"cap\" style=\"margin:4px 0 0\">Search <b>all<\/b> holes, take the <b>smallest<\/b> that fits. Leaves tiny useless slivers.<\/p><\/div>\n      <div class=\"panel\"><b class=\"hex\">Worst fit<\/b><p class=\"cap\" style=\"margin:4px 0 0\">Take the <b>largest<\/b> hole, hoping the leftover is still useful. Usually performs poorly.<\/p><\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"sub\">\n    <h3>Algorithm race: same requests, four algorithms<\/h3>\n    <p class=\"cap\" style=\"margin:0\">Holes (KB): 100, 500, 200, 300, 600 with busy blocks between them. Requests in order: 212, 417, 112, 426. Press Step to give each algorithm the next request.<\/p>\n    <div class=\"row\"><button class=\"btn\" id=\"raceStep\">Step<\/button><button class=\"btn ghost\" id=\"raceAuto\">Auto-play<\/button><button class=\"btn ghost\" id=\"raceReset\">Reset<\/button><span class=\"pill\" id=\"raceReq\"><\/span><\/div>\n    <div class=\"grid2\" id=\"raceGrid\"><\/div>\n  <\/div>\n\n  <div class=\"sub\">\n    <h3>External fragmentation and compaction<\/h3>\n    <div class=\"grid2\">\n      <div class=\"callout warn\"><b>External fragmentation<\/b><p style=\"margin:6px 0 0\">Enough free memory in total, but split into holes that are each too small. Example: holes of 150 + 150 + 150 KB cannot satisfy a 300 KB request.<\/p><\/div>\n      <div class=\"callout\"><b>Compaction<\/b><p style=\"margin:6px 0 0\">Slide all processes to one end so the holes merge into one big hole. It costs CPU time to copy memory and only works with <b>execution-time binding<\/b> (Section 3), because every address must be relocated.<\/p><\/div>\n    <\/div>\n    <div class=\"formula\">Knuth's 50-percent rule: with N allocated blocks there are about N/2 holes.\nIf the average hole is k times the average block, the wasted fraction is  f = k / (k + 2).\nFor k = 1 the waste is 1/3 of memory.<\/div>\n    <p class=\"cap\" style=\"margin:0\">Other cures: use non-contiguous allocation (paging, segmentation), or allocate in coarser units.<\/p>\n  <\/div>\n\n  <div class=\"sub\">\n    <h3>Keeping track of free memory<\/h3>\n    <div class=\"scroll-x\"><table>\n      <tr><th><\/th><th>Bitmap<\/th><th>Linked list of holes<\/th><\/tr>\n      <tr><td>Idea<\/td><td>1 bit per allocation unit: 0 free, 1 used<\/td><td>List of (start, size) for holes; kept sorted by address or size<\/td><\/tr>\n      <tr><td>Finding a hole of n units<\/td><td>Slow: search for n zero bits in a row<\/td><td>Fast: walk the list<\/td><\/tr>\n      <tr><td>Space overhead<\/td><td>Fixed: memory size / unit size bits<\/td><td>Grows with number of holes<\/td><\/tr>\n      <tr><td>Merging holes<\/td><td>Automatic<\/td><td>Must check neighbours<\/td><\/tr>\n    <\/table><\/div>\n  <\/div>\n\n  <div class=\"sub\">\n    <h3>Fixed vs variable partitions<\/h3>\n    <div class=\"scroll-x\"><table>\n      <tr><th><\/th><th>Fixed<\/th><th>Variable<\/th><\/tr>\n      <tr><td>Partition size<\/td><td>Set at start<\/td><td>Exactly the process size<\/td><\/tr>\n      <tr><td>Fragmentation<\/td><td class=\"no\">Internal<\/td><td class=\"no\">External<\/td><\/tr>\n      <tr><td>Number of processes<\/td><td>At most number of partitions<\/td><td>Limited only by memory<\/td><\/tr>\n      <tr><td>Overhead<\/td><td>Very low<\/td><td>Hole list, search, compaction<\/td><\/tr>\n      <tr><td>Flexibility<\/td><td>Low<\/td><td>High<\/td><\/tr>\n    <\/table><\/div>\n  <\/div>\n  <p class=\"remember\"><b>Remember<\/b>Variable partitions: exact-size blocks, holes appear as processes leave, external fragmentation, fixed by compaction (needs run-time binding). First fit is fast, best fit leaves slivers, worst fit is usually worst. 50% rule: waste = k / (k + 2).<\/p>\n<\/section>\n\n<\!-- Revision -->\n<section class=\"card\" id=\"rev\">\n  <p class=\"eyebrow\">Quick revision<\/p>\n  <h2>Flashcards, practice and cheat sheet<\/h2>\n\n  <div class=\"grid2\" style=\"margin-top:14px\">\n    <div class=\"stack\">\n      <h3>Flashcards (tap card to flip)<\/h3>\n      <button class=\"fcard\" id=\"fc\" aria-live=\"polite\"><\/button>\n      <div class=\"row\"><button class=\"btn ghost\" id=\"fcPrev\">Previous<\/button><button class=\"btn ghost\" id=\"fcShuf\">Shuffle<\/button><button class=\"btn\" id=\"fcNext\">Next<\/button><span class=\"cap num\" id=\"fcN\"><\/span><\/div>\n    <\/div>\n    <div class=\"stack\">\n      <h3>Glossary<\/h3>\n      <div class=\"gloss\">\n        <div><b>Logical address<\/b>Generated by the CPU, also called virtual.<\/div>\n        <div><b>Physical address<\/b>The real location in RAM.<\/div>\n        <div><b>Relocation register<\/b>Base value added to every logical address.<\/div>\n        <div><b>Limit register<\/b>Size of the process's range, used for protection.<\/div>\n        <div><b>Hole<\/b>A free block of contiguous memory.<\/div>\n        <div><b>Internal fragmentation<\/b>Wasted space inside an allocated block.<\/div>\n        <div><b>External fragmentation<\/b>Free space split into unusable pieces.<\/div>\n        <div><b>Compaction<\/b>Moving processes to merge holes.<\/div>\n        <div><b>Swapping<\/b>Moving a whole process between RAM and disk.<\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n\n  <div class=\"sub\">\n    <h3>Self-test quiz<\/h3>\n    <div id=\"quiz\"><\/div>\n    <p class=\"big num\" id=\"quizScore\" style=\"font-size:1rem\"><\/p>\n  <\/div>\n\n  <div class=\"sub\">\n    <h3>Practice problems (open to see the answer)<\/h3>\n    <details class=\"panel\"><summary><b>1.<\/b> Base register = 30000, limit = 12000. Find the physical address for logical addresses 800, 11999 and 12000.<\/summary>\n      <p style=\"margin:8px 0 0\">800 \u2192 30000 + 800 = <b>30800<\/b> (valid). 11999 \u2192 <b>41999<\/b> (valid, last byte). 12000 is not less than the limit, so the hardware raises an <b class=\"no\">addressing-error trap<\/b>.<\/p><\/details>\n    <details class=\"panel\"><summary><b>2.<\/b> Fixed partitions of 200, 300, 400, 600 KB. Processes 150, 350, 250 KB arrive in that order. Use best fit. Find total internal fragmentation.<\/summary>\n      <p style=\"margin:8px 0 0\">150 \u2192 smallest fitting is 200 (waste 50). 350 \u2192 400 (waste 50). 250 \u2192 300 (waste 50). Total = <b>150 KB<\/b>. The 600 KB partition stays empty.<\/p><\/details>\n    <details class=\"panel\"><summary><b>3.<\/b> Holes are 100K, 500K, 200K, 300K, 600K. A 212K request arrives. Where does it go under first fit and best fit, and what hole remains?<\/summary>\n      <p style=\"margin:8px 0 0\">First fit: the 500K hole (first one big enough), leaving a <b>288K<\/b> hole. Best fit: the 300K hole (smallest big enough), leaving an <b>88K<\/b> hole.<\/p><\/details>\n    <details class=\"panel\"><summary><b>4.<\/b> A system has 100 allocated blocks and the average hole equals the average block size. How many holes and what fraction of memory is wasted?<\/summary>\n      <p style=\"margin:8px 0 0\">Holes \u2248 N/2 = <b>50<\/b>. With k = 1, wasted fraction = k / (k + 2) = <b>1/3 \u2248 33%<\/b>.<\/p><\/details>\n    <details class=\"panel\"><summary><b>5.<\/b> Three free holes of 150K each, and a 300K request. Is this internal or external fragmentation? What fixes it?<\/summary>\n      <p style=\"margin:8px 0 0\"><b>External<\/b> fragmentation: total free (450K) is enough but no single hole is. Compaction (needs execution-time binding) merges them into one 450K hole. Paging avoids the problem entirely.<\/p><\/details>\n  <\/div>\n\n  <div class=\"sub\">\n    <h3>Cheat sheet<\/h3>\n    <div class=\"scroll-x\"><table>\n      <tr><th>Topic<\/th><th>One-line answer<\/th><\/tr>\n      <tr><td>Memory manager<\/td><td>Track, allocate, relocate, protect, share.<\/td><\/tr>\n      <tr><td>Compiler / linker / loader<\/td><td>Source to object / objects to executable / executable into RAM.<\/td><\/tr>\n      <tr><td>Static vs dynamic linking<\/td><td>Library copied in vs shared at run time.<\/td><\/tr>\n      <tr><td>Binding times<\/td><td>Compile (fixed place), load (relocatable), execution (movable, MMU).<\/td><\/tr>\n      <tr><td>MMU rule<\/td><td>If logical &lt; limit then physical = base + logical, else trap.<\/td><\/tr>\n      <tr><td>Fixed partition<\/td><td>Cut once, one process each, internal fragmentation.<\/td><\/tr>\n      <tr><td>Variable partition<\/td><td>Exact-size blocks, holes, external fragmentation.<\/td><\/tr>\n      <tr><td>Placement<\/td><td>First (fast), next, best (smallest hole), worst (largest hole).<\/td><\/tr>\n      <tr><td>Fix external frag.<\/td><td>Compaction or non-contiguous allocation.<\/td><\/tr>\n    <\/table><\/div>\n    <div class=\"callout warn\"><b>Common exam traps<\/b>\n      <ul style=\"margin:6px 0 0;padding-left:1.1em\"><li>Fixed = <u>internal<\/u> fragmentation. Variable = <u>external<\/u>. Do not swap them.<\/li><li>The limit check is \"less than\", not \"less than or equal\".<\/li><li>Best fit does not mean least total waste over a whole sequence.<\/li><li>Compaction needs execution-time binding.<\/li><\/ul><\/div>\n  <\/div>\n<\/section>\n<\/main>\n<footer>Next topics: paging, segmentation and virtual memory.<\/footer>\n<script>\n(function(){\n'use strict';\nconst $=s=>document.querySelector(s);\nconst $$=s=>Array.from(document.querySelectorAll(s));\nconst hue=i=>`hsl(${(i*47+200)%360} 68% 64%)`;\nconst hex=(n,w)=>'0x'+n.toString(16).toUpperCase().padStart(w||4,'0');\nconst clamp=(v,a,b)=>Math.max(a,Math.min(b,v));\nfunction safe(fn){try{fn()}catch(e){console.error('init failed:',fn.name,e)}}\nfunction lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}\nfunction lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}\nfunction flash(e,cls){e.classList.remove(cls);void e.offsetWidth;e.classList.add(cls)}\nconst REDUCE=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;\n\n/* ---------- generic memory bar ---------- */\nclass MemView{\n  constructor(root,total){this.root=root;this.total=total;this.map=new Map();root.innerHTML=''}\n  render(blocks){\n    const seen=new Set(),W=this.root.clientWidth||600;\n    blocks.forEach(b=>{\n      if(b.size<=0)return;\n      const key=b.key||(b.type+':'+b.start);seen.add(key);\n      let e=this.map.get(key);\n      if(!e){e=document.createElement('div');this.root.appendChild(e);this.map.set(key,e)}\n      e.className='blk '+b.type+(b.cls?' '+b.cls:'');\n      e.style.left=(b.start/this.total*100)+'%';\n      e.style.width=(b.size/this.total*100)+'%';\n      e.style.setProperty('--c',b.color||'');\n      e.style.background=b.bg||'';\n      const px=W*b.size/this.total;\n      let html='';\n      if(b.label&&px>30){html='<span class=\"in\">'+b.label+(b.sub&&px>54?'<small>'+b.sub+'<\/small>':'')+'<\/span>'}\n      e.innerHTML=html;\n      e.title=b.title||((b.label||'')+(b.sub?' '+b.sub:''));\n      e.onclick=b.onClick||null;\n      if(b.fresh)flash(e,'fresh');\n      if(b.merge)flash(e,'merge');\n      if(b.bad)flash(e,'bad');\n    });\n    this.map.forEach((e,k)=>{if(!seen.has(k)){e.remove();this.map.delete(k)}});\n  }\n}\nfunction ruler(el,total,ticks,fmt){\n  el.innerHTML='';\n  ticks.forEach(t=>{const s=document.createElement('span');s.style.left=(t/total*100)+'%';s.textContent=fmt?fmt(t):String(t);el.appendChild(s)});\n}\nfunction tabs(el,items,cur,cb){\n  el.innerHTML='';\n  items.forEach((it,i)=>{\n    const b=document.createElement('button');b.className='tab';b.textContent=it;b.setAttribute('aria-pressed',i===cur?'true':'false');\n    b.onclick=()=>{Array.from(el.children).forEach((c,j)=>c.setAttribute('aria-pressed',j===i?'true':'false'));cb(i)};\n    el.appendChild(b);\n  });\n}\nfunction bindRange(id,outId,fmt,cb){\n  const r=$(id),o=outId?$(outId):null;\n  const f=()=>{if(o)o.textContent=fmt?fmt(+r.value):r.value;cb(+r.value)};\n  r.addEventListener('input',f);f();return r;\n}\n\n/* ================= THEMES ================= */\nconst SKINS=[\n {id:'galaxy',name:'Galaxy',sw:'linear-gradient(135deg,#7b4dff,#2a7bff)'},\n {id:'blackhole',name:'Black Hole',sw:'radial-gradient(circle,#000 38%,#ff9a3c 70%,#fff3e0)'},\n {id:'supernova',name:'Supernova',sw:'linear-gradient(135deg,#ff3d2e,#ff9d1f,#ffe14d)'},\n {id:'aurora',name:'Aurora',sw:'linear-gradient(135deg,#0c7a5a,#3df5b0,#58e0ff)'},\n {id:'cyber',name:'Cyberpunk Neon',sw:'linear-gradient(135deg,#ff2fa8,#00f0ff)'},\n {id:'ocean',name:'Deep Ocean',sw:'linear-gradient(135deg,#032a4d,#38d0ff,#7dffe0)'},\n {id:'sunset',name:'Sunset Retro',sw:'linear-gradient(135deg,#ff9a3c,#ff4f8b,#7a2a9a)'},\n {id:'paper',name:'Light Paper',sw:'linear-gradient(135deg,#ffffff,#dfe5f5)'}\n];\nlet skin='galaxy';\nconst cv=$('#bg'),ctx=cv.getContext('2d');\nlet W=0,H=0,DPR=1,T=0,paused=REDUCE,last=0,eng=null;\nconst rnd=(a,b)=>a+Math.random()*(b-a);\n\nfunction mkStars(n){return Array.from({length:n},()=>({x:Math.random(),y:Math.random(),r:rnd(.4,1.5),ph:rnd(0,6.28),sp:rnd(.6,2.2)}))}\nfunction drawStars(stars,col,amp){\n  stars.forEach(s=>{const a=(.45+.55*Math.sin(T*s.sp+s.ph))*(amp||1);ctx.globalAlpha=Math.max(0,a);ctx.fillStyle=col||'#fff';ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,6.283);ctx.fill()});\n  ctx.globalAlpha=1;\n}\nfunction grad(c0,c1,y0,y1){const g=ctx.createLinearGradient(0,y0||0,0,y1||H);g.addColorStop(0,c0);g.addColorStop(1,c1);return g}\n\nconst ENG={\n galaxy(){\n  const stars=mkStars(170),blobs=Array.from({length:5},(_,i)=>({x:rnd(.1,.9),y:rnd(.1,.9),r:rnd(.35,.6),h:i%2?265:222,p:rnd(0,6)}));\n  return {draw(){\n    ctx.fillStyle=grad('#07041a','#150b40');ctx.fillRect(0,0,W,H);\n    blobs.forEach(b=>{const x=(b.x+Math.sin(T*.06+b.p)*.08)*W,y=(b.y+Math.cos(T*.05+b.p)*.08)*H,r=b.r*Math.max(W,H)*.6;\n      const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`hsla(${b.h},90%,60%,.30)`);g.addColorStop(1,'hsla(260,90%,40%,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)});\n    drawStars(stars,'#fff');\n  }}\n },\n blackhole(){\n  const stars=mkStars(80),R=()=>Math.min(W,H)*.1;\n  const P=Array.from({length:460},()=>({f:Math.random(),a:rnd(0,6.283)}));\n  return {draw(){\n    ctx.fillStyle='#050403';ctx.fillRect(0,0,W,H);\n    drawStars(stars,'#ffe9cf',.8);\n    const narrow=W<700,cx=narrow?W*.5:W*.72,cy=narrow?H*.2:H*.3,r0=R();\n    const gl=ctx.createRadialGradient(cx,cy,r0*.8,cx,cy,r0*5);gl.addColorStop(0,'rgba(255,150,60,.30)');gl.addColorStop(1,'rgba(255,120,40,0)');ctx.fillStyle=gl;ctx.fillRect(0,0,W,H);\n    const draw=(front)=>{\n      P.forEach(p=>{\n        const r=r0*(1.35+p.f*2.9),w=.5/Math.pow(r/r0,1.5);p.a+=w*.016*60*.02;\n        const s=Math.sin(p.a);if((s>=0)!==front)return;\n        const x=cx+Math.cos(p.a)*r,y=cy+s*r*.26,k=1-p.f;\n        ctx.fillStyle=`hsla(${22+k*30},100%,${48+k*40}%,${.35+.5*k})`;ctx.beginPath();ctx.arc(x,y,1.1+k*1.4,0,6.283);ctx.fill();\n      });\n    };\n    draw(false);\n    const ring=ctx.createRadialGradient(cx,cy,r0*.92,cx,cy,r0*1.25);ring.addColorStop(0,'rgba(255,240,210,.95)');ring.addColorStop(. =$('#fpScheme'),selP=$('#fpPolicy'),mem=$('#fpMem'),log=$('#fpLog');\n  Object.keys(SCH).forEach(k=>selS.add(new Option(SCH[k].n,k)));\n  Object.keys(POL).forEach(k=>selP.add(new Option(POL[k],k)));\n  selS.value='tb';selP.value='best';\n  let parts=[],queue=[],n=0,els=[],total=0,timer=null;\n  function build(){\n    if(timer){clearTimeout(timer);timer=null}\n    const sizes=SCH[selS.value].p;total=OS+sizes.reduce((a,b)=>a+b,0);\n    parts=sizes.map(s=>({size:s,pid:null,ps:0}));queue=[];n=0;els=[];\n    mem.innerHTML='';\n    const os=document.createElement('div');os.className='blk os';os.style.left='0';os.style.width=(OS/total*100)+'%';os.innerHTML='<span class=\"in\">OS<\/span>';mem.appendChild(os);\n    let x=OS;\n    parts.forEach((p,i)=>{\n      const e=document.createElement('div');e.className='pslot empty';e.style.left=(x/total*100)+'%';e.style.width=(p.size/total*100)+'%';\n      e.innerHTML='<span class=\"cap-lbl\">'+p.size+'K<\/span><div class=\"fill\"><\/div><div class=\"gap\" style=\"display:none\"><\/div>';\n      e.querySelector('.fill').onclick=()=>{if(parts[i].pid)terminate(parts[i].pid)};\n      mem.appendChild(e);els.push(e);x+=p.size;\n    });\n    const ticks=[0,OS];let a=OS;sizes.forEach(s=>{a+=s;ticks.push(a)});\n    ruler($('#fpRuler'),total,ticks,t=>t+'K');\n    say('Partitions are fixed. Admit a process to place it.');render();\n  }\n  function say(h){log.innerHTML=h}\n  function pick(size){\n    let best=-1;\n    parts.forEach((p,i)=>{if(p.pid||p.size<size)return;\n      if(best<0){best=i;return}\n      if(selP.value==='best'&&p.size<parts[best].size)best=i;\n      if(selP.value==='worst'&&p.size>parts[best].size)best=i;\n    });\n    return best;\n  }\n  const pnum=pid=>+pid.slice(1);\n  function assign(i,pid,size){parts[i].pid=pid;parts[i].ps=size;const e=els[i];flash(e.querySelector('.fill'),'fresh')}\n  function admit(size){\n    if(!(size>0))return;\n    const maxP=Math.max.apply(null,parts.map(p=>p.size));n++;const pid='P'+n;\n    if(size>maxP){say('<span class=\"no\">'+pid+' ('+size+'K) rejected.<\/span> It is larger than the biggest partition ('+maxP+'K), so it can never run in this scheme.');n--;return}\n    const i=pick(size);\n    if(i<0){queue.push({pid,size});say('<span class=\"no\">'+pid+' ('+size+'K) must wait.<\/span> No free partition of at least '+size+'K. It will enter the first suitable partition that becomes free.');render();return}\n    assign(i,pid,size);\n    const frag=parts[i].size-size;\n    const cand=parts.filter(p=>!p.pid||p===parts[i]).filter(p=>p.size>=size).map(p=>p.size+'K').join(', ');\n    say('<span class=\"ok\">'+pid+' ('+size+'K) \u2192 partition '+(i+1)+' ('+parts[i].size+'K).<\/span> Rule: '+POL[selP.value]+'. Free partitions that fit: '+cand+'. Internal fragmentation = '+parts[i].size+' \u2212 '+size+' = <b>'+frag+'K<\/b> wasted.');\n    render();\n  }\n  function terminate(pid){\n    const i=parts.findIndex(p=>p.pid===pid);if(i<0)return;\n    parts[i].pid=null;parts[i].ps=0;let msg=pid+' terminated, partition '+(i+1)+' ('+parts[i].size+'K) is free.';\n    let changed=true;\n    while(changed){changed=false;\n      for(let q=0;q<queue.length;q++){const j=pick(queue[q].size);if(j>=0){const w=queue.splice(q,1)[0];assign(j,w.pid,w.size);msg+=' <span class=\"ok\">'+w.pid+' ('+w.size+'K) leaves the queue and takes partition '+(j+1)+'.<\/span>';changed=true;break}}\n    }\n    say(msg);render();\n  }\n  function render(){\n    let used=0,frag=0,cnt=0,cap=0;\n    parts.forEach((p,i)=>{\n      const e=els[i],f=e.querySelector('.fill'),g=e.querySelector('.gap');cap+=p.size;\n      if(p.pid){cnt++;used+=p.ps;frag+=p.size-p.ps;e.classList.remove('empty');f.style.width=(p.ps/p.size*100)+'%';f.style.setProperty('--c',hue(pnum(p.pid)));f.style.background=hue(pnum(p.pid));f.textContent=p.pid;f.title=p.pid+': '+p.ps+'K in a '+p.size+'K partition ('+(p.size-p.ps)+'K wasted). Click to terminate.';g.style.display=p.size>p.ps?'block':'none'}\n      else{e.classList.add('empty');f.style.width='0';f.textContent='';f.style.background='';g.style.display='none';f.title=''}\n    });\n    $('#fpStats').innerHTML=\n      '<div class=\"stat\"><b>'+cnt+' / '+parts.length+'<\/b><span>Partitions used<\/span><\/div>'+\n      '<div class=\"stat '+(frag?'warn':'')+'\"><b>'+frag+'K<\/b><span>Internal frag.<\/span><\/div>'+\n      '<div class=\"stat\"><b>'+(cap?Math.round(used/cap*100):0)+'%<\/b><span>Memory in real use<\/span><\/div>'+\n      '<div class=\"stat\"><b>'+queue.length+'<\/b><span>Waiting<\/span><\/div>';\n    const r=$('#fpRun'),w=$('#fpWait');r.innerHTML='';w.innerHTML='';\n    parts.forEach(p=>{if(p.pid){const b=document.createElement('button');b.className='pc';b.style.setProperty('--c',hue(pnum(p.pid)));b.textContent=p.pid+' '+p.ps+'K';b.onclick=()=>terminate(p.pid);r.appendChild(b)}});\n    queue.forEach(q=>{const s=document.createElement('span');s.className='pc wait';s.textContent=q.pid+' '+q.size+'K';w.appendChild(s)});\n    if(!r.children.length)r.innerHTML='<span class=\"cap\">none<\/span>';\n    if(!w.children.length)w.innerHTML='<span class=\"cap\">none<\/span>';\n  }\n  $('#fpAdd').onclick=()=>admit(clamp(Math.round(+$('#fpSize').value),1,2000));\n  $('#fpReset').onclick=build;\n  selS.onchange=build;\n  $('#fpSeq').onclick=()=>{\n    selS.value='tb';build();const seq=[212,417,112,426];let k=0;\n    const go=()=>{if(k>=seq.length){timer=null;return}admit(seq[k++]);timer=setTimeout(go,1300)};\n    timer=setTimeout(go,300);\n  };\n  build();\n  window.addEventListener('resize',render);\n});\n\n/* ================= Section 6: variable partitions ================= */\nsafe(function variableSim(){\n  const TOT=1000,OS=100,mem=$('#vpMem'),mv=new MemView(mem,TOT),log=$('#vpLog'),sel=$('#vpAlgo');\n  Object.keys(ALGO).forEach(k=>sel.add(new Option(ALGO[k],k)));\n  ruler($('#vpRuler'),TOT,[0,100,250,500,750,1000],t=>t+'K');\n  let blocks,n,rover,freshPid=null,mergeAt=null,badHoles=false;\n  const pnum=pid=>+pid.slice(1);\n  function reset(){\n    blocks=[{start:100,size:150,pid:'P1'},{start:250,size:200,pid:'P2'},{start:450,size:80,pid:'P3'},{start:530,size:470,pid:null}];\n    n=3;rover=100;freshPid=null;mergeAt=null;badHoles=false;\n    log.innerHTML='Start: three processes loaded. Allocate a block, or click a process to free it.';render();\n  }\n  function stats(){\n    let used=0,free=0,holes=0,big=0;\n    blocks.forEach(b=>{if(b.pid){used+=b.size}else{free+=b.size;holes++;big=Math.max(big,b.size)}});\n    return {used,free,holes,big};\n  }\n  function render(){\n    const s=stats();\n    const out=[{type:'os',key:'os',start:0,size:OS,label:'OS',sub:OS+'K'}];\n    blocks.forEach(b=>{\n      if(b.pid)out.push({type:'used',key:b.pid,start:b.start,size:b.size,label:b.pid,sub:b.size+'K',color:hue(pnum(b.pid)),fresh:b.pid===freshPid,title:b.pid+': '+b.size+'K at '+b.start+'. Click to free.',onClick:()=>free(b.pid)});\n      else out.push({type:'free',key:'h'+b.start,start:b.start,size:b.size,label:'hole',sub:b.size+'K',bad:badHoles,merge:mergeAt!==null&&mergeAt>=b.start&&mergeAt<b.start+b.size,title:'Hole of '+b.size+'K at '+b.start});\n    });\n    mv.render(out);freshPid=null;mergeAt=null;badHoles=false;\n    const scattered=s.free-s.big;\n    $('#vpStats').innerHTML=\n      '<div class=\"stat\"><b>'+s.used+'K<\/b><span>In use<\/span><\/div>'+\n      '<div class=\"stat\"><b>'+s.free+'K<\/b><span>Free total<\/span><\/div>'+\n      '<div class=\"stat\"><b>'+s.holes+'<\/b><span>Holes<\/span><\/div>'+\n      '<div class=\"stat\"><b>'+s.big+'K<\/b><span>Largest hole<\/span><\/div>'+\n      '<div class=\"stat '+(scattered?'warn':'')+'\"><b>'+scattered+'K<\/b><span>Free but scattered<\/span><\/div>';\n    const r=$('#vpRun');r.innerHTML='';\n    blocks.forEach(b=>{if(b.pid){const e=document.createElement('button');e.className='pc';e.style.setProperty('--c',hue(pnum(b.pid)));e.textContent=b.pid+' '+b.size+'K';e.onclick=()=>free(b.pid);r.appendChild(e)}});\n    if(!r.children.length)r.innerHTML='<span class=\"cap\">none<\/span>';\n  }\n  function alloc(size){\n    size=Math.round(size);\n    if(!(size>0&&size<=900)){log.innerHTML='<span class=\"no\">Enter a size from 1 to 900 KB.<\/span>';return}\n    const algo=sel.value,s=stats(),fits=blocks.filter(b=>!b.pid&&b.size>=size);\n    const i=pickHole(blocks,size,algo,rover);\n    if(i<0){\n      badHoles=true;\n      log.innerHTML=size<=s.free?'<span class=\"no\">Allocation of '+size+'K fails: external fragmentation!<\/span> Total free is '+s.free+'K, but the largest hole is only '+s.big+'K. Try <b>Compact<\/b>.':'<span class=\"no\">Allocation of '+size+'K fails.<\/span> Only '+s.free+'K is free in total.';\n      render();return;\n    }\n    const h=blocks[i],hs=h.start,hsz=h.size;n++;const pid='P'+n;\n    place(blocks,i,size,pid);rover=hs+size;freshPid=pid;\n    const why={first:'first hole (scanning from low addresses) that is big enough',next:'first big-enough hole after the last allocation point',best:'smallest hole that is big enough',worst:'largest hole'}[algo];\n    log.innerHTML='<span class=\"ok\">'+pid+' gets '+size+'K at address '+hs+'.<\/span> '+ALGO[algo]+' picks the '+why+'. Holes that fit: '+fits.map(b=>b.size+'K').join(', ')+'. Chosen: '+hsz+'K'+(hsz>size?', leaving a <b>'+(hsz-size)+'K<\/b> hole.':', an exact fit (no leftover hole).');\n    render();\n  }\n  function free(pid){\n    const b=blocks.find(x=>x.pid===pid);if(!b)return;\n    const st=b.start;b.pid=null;const m=coalesce(blocks);mergeAt=st;\n    log.innerHTML=pid+' freed. Its block becomes a hole'+(m?' and <b>merges<\/b> with the neighbouring hole(s) (coalescing).':'. Neighbours are processes, so it stays a separate hole.');\n    render();\n  }\n  function compact(){\n    const used=blocks.filter(b=>b.pid),s=stats();\n    if(s.holes===0){log.innerHTML='Memory is full: there is no free space to compact.';return}\n    if((s.holes===1&&!blocks[blocks.length-1].pid&&used.every((b,i)=>b.start===OS+used.slice(0,i).reduce((a,x)=>a+x.size,0)))){log.innerHTML='Memory is already compact: free space is one hole.';return}\n    let x=OS,moved=0;const nb=[];\n    used.forEach(b=>{if(b.start!==x)moved++;nb.push({start:x,size:b.size,pid:b.pid});x+=b.size});\n    if(x<TOT)nb.push({start:x,size:TOT-x,pid:null});\n    blocks=nb;rover=OS;mergeAt=x;\n    log.innerHTML='<span class=\"ok\">Compaction done.<\/span> '+moved+' process'+(moved===1?'':'es')+' moved down; all '+s.free+'K of free memory is now <b>one hole<\/b>. This copies memory (costly) and requires execution-time binding so addresses can be relocated.';\n    render();\n  }\n  function preset(){\n    blocks=[{start:100,size:120,pid:'P1'},{start:220,size:60,pid:null},{start:280,size:120,pid:'P2'},{start:400,size:150,pid:null},{start:550,size:100,pid:'P3'},{start:650,size:90,pid:null},{start:740,size:120,pid:'P4'},{start:860,size:140,pid:null}];\n    n=4;rover=100;$('#vpSize').value=200;\n    log.innerHTML='Fragmented memory: 440K free, but in four holes (60, 150, 90, 140). Now allocate <b>200K<\/b> and see it fail, then press Compact.';render();\n  }\n  $('#vpAlloc').onclick=()=>alloc(+$('#vpSize').value);\n  $('#vpRand').onclick=()=>{const v=Math.round((40+Math.random()*160)/10)*10;$('#vpSize').value=v;alloc(v)};\n  $('#vpCompact').onclick=compact;$('#vpPreset').onclick=preset;$('#vpReset').onclick=reset;\n  reset();\n  window.addEventListener('resize',render);\n});\n\n/* ================= Section 6: algorithm race ================= */\nsafe(function race(){\n  const REQ=[212,417,112,426],HOLES=[100,500,200,300,600],TOT=5*40+1700;\n  const grid=$('#raceGrid'),keys=['first','next','best','worst'];let idx=0,auto=null,R=[];\n  function fresh(){\n    const bl=[];let x=0;HOLES.forEach(h=>{bl.push({start:x,size:40,pid:'busy'});x+=40;bl.push({start:x,size:h,pid:null});x+=h});\n    return bl;\n  }\n  function build(){\n    grid.innerHTML='';R=keys.map(k=>{\n      const p=document.createElement('div');p.className='panel stack';p.innerHTML='<b class=\"hex\">'+ALGO[k]+'<\/b><div class=\"mem\" style=\"height:56px\"><\/div><div class=\"cap res\" style=\"line-height:1.5\"><\/div>';grid.appendChild(p);\n      const m=p.querySelector('.mem');return {k,blocks:fresh(),rover:0,mv:new MemView(m,TOT),res:p.querySelector('.res'),lines:[],placed:0}\n    });\n    idx=0;draw();info();\n  }\n  function draw(freshId,bad){\n    R.forEach(r=>{\n      const out=r.blocks.map(b=>b.pid==='busy'?{type:'busy',key:'b'+b.start,start:b.start,size:b.size}:\n        b.pid?{type:'used',key:b.pid,start:b.start,size:b.size,label:b.pid,sub:b.size,color:hue(+b.pid.slice(1)),fresh:b.pid===freshId}:\n        {type:'free',key:'h'+b.start,start:b.start,size:b.size,label:String(b.size),bad:bad&&bad.includes(r.k)});\n      r.mv.render(out);\n    });\n  }\n  function info(){\n    $('#raceReq').textContent=idx<REQ.length?'Next request: '+REQ[idx]+' KB ('+(idx+1)+' of '+REQ.length+')':'All requests done';\n    R.forEach(r=>{r.res.innerHTML=r.lines.join('<br>')+(idx>=REQ.length?'<br><b>Placed '+r.placed+' of '+REQ.length+'<\/b>'+(r.placed<REQ.length?' <span class=\"no\">(one request failed)<\/span>':' <span class=\"ok\">(all fit)<\/span>'):'')});\n  }\n  function step(){\n    if(idx>=REQ.length){stopAuto();return}\n    const size=REQ[idx],pid='R'+(idx+1),failed=[];\n    R.forEach(r=>{\n      const i=pickHole(r.blocks,size,r.k,r.rover);\n      if(i<0){r.lines.push(size+' \u2192 <span class=\"no\">no hole fits<\/span>');failed.push(r.k)}\n      else{const h=r.blocks[i];r.lines.push(size+' \u2192 <span class=\"ok\">hole '+h.size+'<\/span>'+(h.size>size?' (leaves '+(h.size-size)+')':''));place(r.blocks,i,size,pid);r.rover=h.start+size;r.placed++}\n    });\n    idx++;draw(pid,failed);info();\n    if(idx>=REQ.length)stopAuto();\n  }\n  function stopAuto(){if(auto){clearInterval(auto);auto=null}$('#raceAuto').textContent='Auto-play'}\n  $('#raceStep').onclick=()=>{stopAuto();step()};\n  $('#raceAuto').onclick=()=>{if(auto){stopAuto();return}if(idx>=REQ.length)build();$('#raceAuto').textContent='Pause';step();auto=setInterval(step,1600)};\n  $('#raceReset').onclick=()=>{stopAuto();build()};\n  build();\n  window.addEventListener('resize',()=>draw());\n});\n\n/* ================= Revision ================= */\nsafe(function flashcards(){\n  const C=[\n   ['What are the five jobs of the memory manager?','Track, allocate, relocate, protect, share.'],\n   ['Compiler vs linker vs loader?','Compiler: source to object. Linker: objects and libraries to executable, resolves external symbols. Loader: executable into memory.'],\n   ['Static vs dynamic linking?','Static copies the library into every executable. Dynamic links at run time and shares one copy in memory.'],\n   ['Three address binding times?','Compile time (absolute code, fixed place), load time (relocatable code), execution time (logical addresses translated by hardware).'],\n   ['Which binding time lets a process move while running?','Execution-time binding, using base/limit registers or an MMU.'],\n   ['MMU rule with base and limit?','If logical < limit then physical = base + logical, otherwise trap.'],\n   ['What is internal fragmentation?','Unused space inside an allocated block, for example partition size minus process size. Typical of fixed partitions.'],\n   ['What is external fragmentation?','Free memory split into holes that are each too small. Typical of variable partitions.'],\n   ['Fixed partitions: key limits?','Degree of multiprogramming limited to number of partitions; internal fragmentation; big processes may never fit.'],\n   ['First fit vs best fit vs worst fit?','First: first hole that fits. Best: smallest hole that fits. Worst: largest hole.'],\n   ['What does next fit do differently?','It continues scanning from where the previous allocation ended instead of from the start.'],\n   ['What is compaction and what does it need?','Moving processes together so holes merge. Needs execution-time binding and costs CPU time.'],\n   ['Knuth 50-percent rule?','With N blocks there are about
