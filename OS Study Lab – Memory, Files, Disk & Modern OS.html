are raises a <b>page fault<\/b>; registers saved'],['3','Check','Is the reference legal? If not, abort. If yes, page is on disk'],['4','Free frame','Find a free frame (or pick a victim with page replacement)'],['5','Disk read','Schedule disk I/O to read the page into the frame (slow!)'],['6','Update','Set page-table entry: frame number, valid bit = <b>v<\/b>'],['7','Restart','Restart the interrupted instruction; it now succeeds']];\n$('#pfFlow').innerHTML=PF_STEPS.map((s,i)=>`<div class=\"node\" id=\"pf${i}\">${s[0]}. ${s[1]}<\/div>`+(i<PF_STEPS.length-1?'<span class=\"arrow\">\u279c<\/span>':'')).join('');\nlet pfBusy=false;\nasync function pfPlay(){\n  if(pfBusy)return;pfBusy=true;$$('#pfFlow .node').forEach(n=>n.className='node');\n  for(let i=0;i<PF_STEPS.length;i++){$('#pf'+i).classList.add('on');$('#pfText').innerHTML='<b>Step '+PF_STEPS[i][0]+' \u2013 '+PF_STEPS[i][1]+':<\/b> '+PF_STEPS[i][2];await sleep(i===4?1900:1300);$('#pf'+i).className='node good';}\n  $('#pfText').innerHTML='\u2705 Done. Notice step 5: the disk read dominates the cost of the whole fault.';pfBusy=false;\n}\nconst DP={mem:[],pt:[],q:[],acc:0,flt:0,i:0,busy:false,tok:0,refs:[]};\nfunction dpRender(){\n  $('#dpPT').innerHTML=DP.pt.map((f,i)=>`<div class=\"vrow\" id=\"vp${i}\"><b>${i}<\/b><span class=\"bit ${f>=0?'v':'i'}\">${f>=0?'v':'i'}<\/span><span>${f>=0?'frame '+f:'\u2013'}<\/span><\/div>`).join('');\n  $('#dpRAM').innerHTML=DP.mem.map((p,f)=>`<div class=\"fbox\" id=\"rf${f}\" style=\"${p>=0?'background:'+COLORS[p%8]+';color:#fff;text-shadow:0 1px 2px #000':''}\">Frame ${f}<br><b>${p>=0?'Page '+p:'empty'}<\/b><\/div>`).join('');\n  $('#dpDisk').innerHTML=DP.pt.map((_,i)=>`<div class=\"fbox\" id=\"dk${i}\" style=\"padding:4px;min-height:0;margin:4px 0\">Page ${i}<\/div>`).join('');\n  $('#dpRefRow').innerHTML=DP.refs.map((r,i)=>`<span class=\"${i===DP.i-1?'cur':i<DP.i-1?'past':''}\">${r}<\/span>`).join('');\n  $('#stAcc').textContent=DP.acc;$('#stFlt').textContent=DP.flt;$('#stHit').textContent=DP.acc-DP.flt;$('#stP').textContent=DP.acc?(DP.flt/DP.acc).toFixed(2):'\u2013';\n}\nfunction dpReset(){\n  DP.tok++;DP.busy=false;DP.mem=[-1,-1,-1,-1];DP.pt=Array(8).fill(-1);DP.q=[];DP.acc=0;DP.flt=0;DP.i=0;\n  DP.refs=$('#dpRefs').value.split(/[\\s,]+/).map(Number).filter(n=>Number.isInteger(n)&&n>=0&&n<8);if(!DP.refs.length)DP.refs=[7,0,1,2,0,3,0,4,2,3,0,3,2];\n  $('#dpChips').innerHTML=[0,1,2,3,4,5,6,7].map(i=>`<span style=\"cursor:pointer\" onclick=\"dpAccess(${i})\">${i}<\/span>`).join('');\n  dpRender();$('#dpMsg').textContent='Ready. Frames are empty, so the first references will all fault (pure demand paging).';\n}\nconst flashEl=(id,cls,ms=1000)=>{const e=$('#'+id);if(!e)return;e.classList.add(cls);setTimeout(()=>{const x=$('#'+id);if(x)x.classList.remove(cls)},ms);};\nasync function fly(a,b,label,color){\n  const ar=a.getBoundingClientRect(),br=b.getBoundingClientRect(),el=document.createElement('div');el.className='fly';el.textContent=label;\n  el.style.cssText=`left:${ar.left}px;top:${ar.top}px;width:${ar.width}px;height:${Math.max(ar.height,26)}px;background:${color}`;document.body.appendChild(el);el.getBoundingClientRect();\n  el.style.transform=`translate(${br.left-ar.left}px,${br.top-ar.top}px)`;await sleep(780);el.remove();\n}\nasync function dpAccess(pg){\n  if(DP.busy)return;DP.busy=true;const tok=DP.tok;DP.acc++;\n  if(DP.i<DP.refs.length&&DP.refs[DP.i]===pg)DP.i++;else{DP.refs.splice(DP.i,0,pg);DP.i++;}\n  dpRender();\n  if(DP.pt[pg]>=0){\n    flashEl('vp'+pg,'on');flashEl('rf'+DP.pt[pg],'on');$('#dpMsg').innerHTML=`Page <b>${pg}<\/b> is <b class=\"ok\">valid<\/b> in frame ${DP.pt[pg]} \u2192 normal memory access, <b>no fault<\/b>.`;\n  }else{\n    DP.flt++;flashEl('vp'+pg,'fault',1600);$('#dpMsg').innerHTML=`\u26a0\ufe0f Page <b>${pg}<\/b> has bit <b class=\"no\">i<\/b> \u2192 <b>PAGE FAULT<\/b>. Trap to OS\u2026`;dpRender();flashEl('vp'+pg,'fault',1600);\n    await sleep(1100);if(tok!==DP.tok)return;\n    let f=DP.mem.indexOf(-1);\n    if(f<0){\n      const v=DP.q.shift();f=DP.pt[v];$('#dpMsg').innerHTML=`No free frame. <b>FIFO<\/b> picks the oldest page <b>${v}<\/b> in frame ${f} as victim. Its bit becomes <b>i<\/b>.`;\n      flashEl('rf'+f,'out',1200);await sleep(1200);if(tok!==DP.tok)return;DP.pt[v]=-1;DP.mem[f]=-1;dpRender();flashEl('vp'+v,'fault',900);\n    }else $('#dpMsg').innerHTML=`Free frame found: frame <b>${f}<\/b>. Read page ${pg} from disk\u2026`;\n    await sleep(500);if(tok!==DP.tok)return;\n    flashEl('dk'+pg,'in',1100);await fly($('#dk'+pg),$('#rf'+f),'Page '+pg,COLORS[pg%8]);if(tok!==DP.tok)return;\n    DP.mem[f]=pg;DP.pt[pg]=f;DP.q.push(pg);dpRender();flashEl('rf'+f,'in',1100);flashEl('vp'+pg,'on',1100);\n    $('#dpMsg').innerHTML=`\u2705 Page <b>${pg}<\/b> loaded into frame ${f}; table updated (bit <b class=\"ok\">v<\/b>). Instruction restarts.`;\n  }\n  dpRender();DP.busy=false;\n}\nfunction dpStep(){if(DP.busy)return;const nxt=DP.refs[DP.i];if(nxt===undefined){$('#dpMsg').innerHTML='End of reference string. Fault rate p = <b>'+(DP.acc?(DP.flt/DP.acc).toFixed(3):0)+'<\/b>. Use it in the calculator below \u2193';return false;}dpAccess(nxt);return true;}\nasync function dpAuto(){const tok=DP.tok;while(DP.i<DP.refs.length&&tok===DP.tok){if(DP.busy){await sleep(200);continue;}dpAccess(DP.refs[DP.i]);await sleep(900);}}\n\n/* ================= 09 PERFORMANCE ================= */\nfunction pfSet(ms){$('#pfT').value=ms;pfUpd();}\nfunction sliderToP(v){return v<=0?0:Math.pow(10,-8+v*.06);}\nfunction pToSlider(p){return p<=0?0:clamp(Math.round((Math.log10(p)+8)/.06),0,100);}\nfunction fmtNs(n){return n>=1e6?(n/1e6).toFixed(3)+' ms':n>=1e3?(n/1e3).toFixed(2)+' \u00b5s':n.toFixed(1)+' ns';}\nfunction pfUpd(src){\n  if(src==='sl')$('#pfP').value=+sliderToP(+$('#pfSl').value).toPrecision(3);\n  else if(src==='in')$('#pfSl').value=pToSlider(+$('#pfP').value);\n  const ma=+$('#pfMa').value||1,t=(+$('#pfT').value||0)*1e6,p=clamp(+$('#pfP').value||0,0,1);\n  const eat=(1-p)*ma+p*t,slow=eat/ma,pmax=t>ma?(0.1*ma)/(t-ma):1;\n  $('#pfEat').textContent=fmtNs(eat);$('#pfSlow').textContent=slow.toFixed(slow<10?2:0)+'\u00d7';$('#pfMax').textContent=pmax.toExponential(2)+' (1 per '+Math.round(1/pmax).toLocaleString()+')';\n  $('#pfForm').innerHTML=`EAT = (1 \u2212 ${p}) \u00d7 ${ma} + ${p} \u00d7 ${t.toLocaleString()}<br>&nbsp;&nbsp;&nbsp;&nbsp;= <b>${eat.toFixed(1)} ns<\/b>`;\n  const intr=50,rest=50,read=Math.max(t/1000-100,0);const tot=intr+read+rest||1;\n  $('#pfBar').innerHTML=`<div style=\"width:${Math.max(intr/tot*100,4)}%;background:#2563eb\">irq<\/div><div style=\"width:${read/tot*100}%;background:#ef4444\">read page from disk (${(read/1000).toFixed(2)} ms)<\/div><div style=\"width:${Math.max(rest/tot*100,4)}%;background:#10b981\">restart<\/div>`;\n  perfDraw();\n}\nfunction perfDraw(){\n  const c=$('#chart');if(!c)return;const dpr=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;if(!w)return;c.width=w*dpr;c.height=h*dpr;const g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);\n  const cs=getComputedStyle(document.body),col=cs.getPropertyValue('--accent').trim(),col2=cs.getPropertyValue('--accent2').trim(),tx=cs.getPropertyValue('--muted').trim(),warn=cs.getPropertyValue('--warn').trim();\n  const ma=+$('#pfMa').value||1,t=(+$('#pfT').value||0)*1e6,p0=clamp(+$('#pfP').value||0,0,1);\n  const sd=p=>((1-p)*ma+p*t)/ma;const ymax=Math.max(Math.ceil(Math.log10(sd(1e-2))+.3),1);\n  const L=48,R=14,Tp=14,B=34,pw=w-L-R,ph=h-Tp-B;const X=lp=>L+(lp+8)/6*pw,Y=ls=>Tp+ph-(ls/ymax)*ph;\n  g.font='11px sans-serif';g.fillStyle=tx;g.strokeStyle=tx;g.globalAlpha=.25;g.lineWidth=1;\n  for(let k=-8;k<=-2;k++){g.beginPath();g.moveTo(X(k),Tp);g.lineTo(X(k),Tp+ph);g.stroke();}\n  for(let k=0;k<=ymax;k++){g.beginPath();g.moveTo(L,Y(k));g.lineTo(L+pw,Y(k));g.stroke();}\n  g.globalAlpha=1;for(let k=-8;k<=-2;k++)g.fillText('1e'+k,X(k)-12,h-16);for(let k=0;k<=ymax;k++)g.fillText(Math.pow(10,k)+'\u00d7',4,Y(k)+4);\n  g.fillText('page-fault rate p \u2192',L+pw/2-45,h-3);\n  g.strokeStyle=warn;g.setLineDash([6,5]);g.beginPath();g.moveTo(L,Y(Math.log10(1.1)));g.lineTo(L+pw,Y(Math.log10(1.1)));g.stroke();g.setLineDash([]);\n  g.strokeStyle=col;g.lineWidth=3;g.beginPath();for(let i=0;i<=120;i++){const lp=-8+i*6/120;const y=Y(Math.log10(sd(Math.pow(10,lp))));i?g.lineTo(X(lp),y):g.moveTo(X(lp),y);}g.stroke();\n  if(p0>0){const lp=clamp(Math.log10(p0),-8,-2),x=X(lp),y=Y(Math.log10(sd(Math.pow(10,lp))));g.fillStyle=col2;g.beginPath();g.arc(x,y,7,0,6.3);g.fill();g.fillStyle=tx;g.fillText('you are here',x-30,y-12);}\n}\n$('#pfSl').addEventListener('input',()=>pfUpd('sl'));$('#pfP').addEventListener('input',()=>pfUpd('in'));$('#pfMa').addEventListener('input',()=>pfUpd());$('#pfT').addEventListener('input',()=>pfUpd());\n\n/* ================= INIT ================= */\nalReset();dpReset();pfUpd('in');\nlet saved='galaxy';try{saved=localStorage.getItem('memlab-theme')||'galaxy'}catch(e){}\nresize();setTheme(THEMES.some(t=>t[0]===saved)?saved:'galaxy');frame();\n<\/script>\n<\/body>\n<\/html>\n", "page": "<!DOCTYPE html>\n<html lang=\"en\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Page Replacement Algorithms \u2013 Visual Lab<\/title>\n<style>\n:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);\n--bgg:linear-gradient(160deg,#0b0620,#1c0b44);--card:rgba(18,10,45,.80);--text:#f2eeff;--muted:#b9b0e0;--a:#9d7bff;--b:#ff7bd5;--hit:#3ddc97;--fault:#ff5c6c;--bd:rgba(180,160,255,.35)}\n*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:70px}\n[data-theme=blackhole]{--bgg:radial-gradient(circle at 50% 40%,#1a0f05,#000 70%);--card:rgba(15,10,6,.82);--text:#fff3e6;--muted:#d9b998;--a:#ff9a2e;--b:#ffd9a0;--bd:rgba(255,160,60,.4)}\n[data-theme=supernova]{--bgg:radial-gradient(circle at 50% 45%,#3a0a05,#0d0202 75%);--card:rgba(30,6,4,.82);--text:#fff1e0;--muted:#f2b99a;--a:#ff6a2b;--b:#ffd23d;--bd:rgba(255,110,40,.45)}\n[data-theme=aurora]{--bgg:linear-gradient(180deg,#020b18,#04202a 70%,#06301f);--card:rgba(3,20,26,.80);--text:#eafff7;--muted:#a5dccb;--a:#2bffb0;--b:#37d5ff;--bd:rgba(60,255,190,.35)}\n[data-theme=neon]{--bgg:linear-gradient(180deg,#07010f,#14032a);--card:rgba(12,4,28,.84);--text:#f4f0ff;--muted:#b9a8e8;--a:#ff2bd6;--b:#00f0ff;--bd:rgba(0,240,255,.45)}\n[data-theme=ocean]{--bgg:linear-gradient(180deg,#02203d,#01091a);--card:rgba(2,18,42,.80);--text:#e8f6ff;--muted:#9cc8e6;--a:#27d3ff;--b:#3dffd1;--bd:rgba(60,200,255,.35)}\n[data-theme=sunset]{--bgg:linear-gradient(180deg,#ff8a3d 0%,#ff4f8b 45%,#5b2a86 100%);--card:rgba(40,10,55,.82);--text:#fff4fa;--muted:#f3c6e0;--a:#ffb347;--b:#ff7ac0;--bd:rgba(255,190,120,.5)}\n[data-theme=paper]{--bgg:linear-gradient(160deg,#fbfaf5,#eef1f6);--card:rgba(255,255,255,.92);--text:#1d2433;--muted:#566078;--a:#3b5bdb;--b:#d6336c;--hit:#1b9e5a;--fault:#d9304a;--bd:rgba(40,60,120,.25)}\nbody{margin:0;font:16px/1.6 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif;color:var(--text);background:var(--bgg) fixed;min-height:100vh;transition:color .4s}\n#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1}\nheader{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);padding:8px 14px}\nheader::before{content:\"\";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:-1}\n.hrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:1100px;margin:auto}\n.logo{font-weight:800;color:var(--a)}\n.themes{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}\n.themes button{font-size:12px;padding:4px 9px;border-radius:99px;border:1px solid var(--bd);background:transparent;color:var(--text);cursor:pointer}\n.themes button.on{background:var(--a);color:#000;border-color:transparent;font-weight:700}\n[data-theme=paper] .themes button.on{color:#fff}\nnav{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;width:100%}\nnav a{color:var(--muted);text-decoration:none}nav a:hover{color:var(--a)}\nmain{max-width:1100px;margin:auto;padding:18px 14px 60px}\nsection{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px;margin:18px 0;backdrop-filter:blur(8px)}\nh1{font-size:clamp(26px,5vw,44px);margin:20px 0 4px;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}\nh2{margin:0 0 10px;color:var(--a)}h3{margin:14px 0 6px;color:var(--b)}\np,li{color:var(--text)}.muted{color:var(--muted);font-size:14px}\n.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}\n.box{border:1px solid var(--bd);border-radius:14px;padding:14px;background:rgba(127,127,127,.08)}\n.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}\n.flow .st{flex:1 1 130px;border:2px solid var(--bd);border-radius:12px;padding:10px;font-size:13px;text-align:center;transition:.3s}\n.flow .st.on{border-color:var(--a);transform:translateY(-4px) scale(1.04);box-shadow:0 0 18px var(--a);background:rgba(127,127,255,.15)}\n.flow .ar{align-self:center;color:var(--a);font-size:20px}\n.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}\n.ctl input,.ctl select{background:rgba(127,127,127,.15);color:var(--text);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;font-size:14px}\n.ctl input[type=text]{min-width:230px;flex:1}\n.btn{background:linear-gradient(90deg,var(--a),var(--b));color:#000;border:0;border-radius:9px;padding:8px 14px;font-weight:700;cursor:pointer}\n[data-theme=paper] .btn{color:#fff}\n.btn.alt{background:transparent;color:var(--text);border:1px solid var(--bd)}\n#ram{display:flex;gap:12px;justify-content:center;margin:14px 0;flex-wrap:wrap}\n.fr{width:70px;height:78px;border:2px solid var(--a);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:28px;font-weight:800;position:relative}\n.fr small{position:absolute;top:2px;font-size:10px;color:var(--muted);font-weight:400}\n.fr.new{animation:pop .6s;border-color:var(--fault);box-shadow:0 0 18px var(--fault)}\n.fr.hit{animation:pulse .6s;border-color:var(--hit);box-shadow:0 0 18px var(--hit)}\n@keyframes pop{0%{transform:translateY(-40px) scale(.5);opacity:0}100%{transform:none;opacity:1}}\n@keyframes pulse{50%{transform:scale(1.12)}}\n#msg{text-align:center;min-height:26px;font-weight:600}\n.tw{overflow-x:auto;padding-bottom:6px}\ntable.t{border-collapse:separate;border-spacing:4px;margin:auto}\n.t td,.t th{min-width:38px;height:38px;text-align:center;border-radius:8px;border:1px solid var(--bd);font-weight:700}\n.t th{color:var(--muted);font-weight:400;font-size:12px;border:0;text-align:right;padding-right:6px}\n.t td.ref{background:var(--a);color:#000}\n.t td.cur{outline:2px solid var(--b)}\n.t td.ld{animation:pop .5s;color:var(--fault)}\n.t td.H{background:var(--hit);color:#000}.t td.F{background:var(--fault);color:#fff}\n.stats{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:10px 0;font-weight:700}\n.stats span b{color:var(--b)}\n.bars .row{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px}\n.bars .lab{width:70px}.bars .bar{height:20px;border-radius:6px;background:linear-gradient(90deg,var(--a),var(--b));transition:width .8s;min-width:4px}\ntable.cmp{border-collapse:collapse;width:100%;font-size:14px}\n.cmp th,.cmp td{border:1px solid var(--bd);padding:8px;text-align:left}.cmp th{color:var(--a)}\n.cmp{display:table}\n.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--bd);margin:2px;color:var(--muted)}\nsvg text{fill:var(--text);font-family:inherit}\n.callout{border-left:4px solid var(--b);padding:8px 12px;background:rgba(127,127,127,.1);border-radius:0 10px 10px 0;margin:10px 0}\ninput[type=range]{width:100%;accent-color:var(--a)}\n@media (prefers-reduced-motion:reduce){*{animation:none!important}}\n<\/style><\/head>\n<body data-x>\n<canvas id=\"bg\"><\/canvas>\n<header><div class=\"hrow\"><span class=\"logo\">\u2699 Page Replacement Lab<\/span><div class=\"themes\" id=\"themes\"><\/div>\n<nav><a href=\"#basics\">Basics<\/a><a href=\"#sim\">Simulator<\/a><a href=\"#algos\">Algorithms<\/a><a href=\"#belady\">Belady\u2019s Anomaly<\/a><a href=\"#thrash\">Thrashing<\/a><a href=\"#sum\">Cheat Sheet<\/a><\/nav><\/div><\/header>\n<main>\n<h1>Page Replacement Algorithms<\/h1>\n<p class=\"muted\">FIFO \u00b7 LRU \u00b7 Optimal \u00b7 LFU \u00b7 Belady\u2019s Anomaly \u00b7 Thrashing \u2014 learn by watching, not just reading.<\/p>\n\n<section id=\"basics\"><h2>1. Why do we need page replacement?<\/h2>\n<p>With <b>virtual memory<\/b>, a process can be larger than RAM. Only some of its <b>pages<\/b> sit in RAM <b>frames<\/b>; the rest stay on disk. When the CPU touches a page that is not in RAM, a <b>page fault<\/b> occurs. If all frames are full, the OS must <b>evict (replace)<\/b> one page to make room. The rule used to pick that victim is the <b>page replacement algorithm<\/b>. The goal: <b>minimise the number of page faults<\/b>, because a disk access is ~100,000\u00d7 slower than RAM.<\/p>\n<h3>Live: what happens on a page fault<\/h3>\n<div class=\"flow\" id=\"flow\">\n<div class=\"st\">\u2460 CPU references a page<\/div><div class=\"ar\">\u279c<\/div>\n<div class=\"st\">\u2461 Page table lookup \u2013 valid bit = 0 ?<\/div><div class=\"ar\">\u279c<\/div>\n<div class=\"st\">\u2462 Trap to OS (page fault)<\/div><div class=\"ar\">\u279c<\/div>\n<div class=\"st\">\u2463 Locate page on disk<\/div><div class=\"ar\">\u279c<\/div>\n<div class=\"st\">\u2464 Free frame? If no \u2192 run <b>replacement algorithm<\/b>, pick victim (write back if dirty)<\/div><div class=\"ar\">\u279c<\/div>\n<div class=\"st\">\u2465 Load page into frame<\/div><div class=\"ar\">\u279c<\/div>\n<div class=\"st\">\u2466 Update page table, restart instruction<\/div><\/div>\n<div class=\"grid\" style=\"margin-top:14px\">\n<div class=\"box\"><b>Hit<\/b><br>Page already in a frame \u2192 no disk access.<\/div>\n<div class=\"box\"><b>Fault<\/b><br>Page not in memory \u2192 must be loaded.<\/div>\n<div class=\"box\"><b>Hit ratio<\/b> = hits \u00f7 references<br><b>Fault ratio<\/b> = faults \u00f7 references<\/div>\n<div class=\"box\"><b>Reference string<\/b><br>The sequence of page numbers a process accesses, e.g. 7 0 1 2 0 3 0 4.<\/div><\/div><\/section>\n\n<section id=\"sim\"><h2>2. Interactive Simulator<\/h2>\n<div class=\"ctl\">\n<input type=\"text\" id=\"ref\" value=\"7 0 1 2 0 3 0 4 2 3 0 3 2 1 2 0 1 7 0 1\" aria-label=\"Reference string\">\n<label>Frames <select id=\"nf\"><option>2<\/option><option selected>3<\/option><option>4<\/option><option>5<\/option><\/select><\/label>\n<select id=\"alg\"><option value=\"FIFO\">FIFO<\/option><option value=\"LRU\">LRU<\/option><option value=\"OPT\">Optimal<\/option><option value=\"LFU\">LFU<\/option><\/select>\n<label>Speed <select id=\"spd\"><option value=\"1200\">Slow<\/option><option value=\"700\" selected>Normal<\/option><option value=\"250\">Fast<\/option><\/select><\/label><\/div>\n<div class=\"ctl\"><button class=\"btn\" id=\"play\">\u25b6 Play<\/button><button class=\"btn alt\" id=\"stp\">Step \u23ed<\/button><button class=\"btn alt\" id=\"all\">Run all<\/button><button class=\"btn alt\" id=\"rst\">Reset<\/button><button class=\"btn alt\" id=\"rnd\">\ud83c\udfb2 Random<\/button><\/div>\n<div id=\"ram\"><\/div><div id=\"msg\"><\/div>\n<div class=\"stats\"><span>Step: <b id=\"sS\">0<\/b><\/span><span style=\"color:var(--fault)\">Faults: <b id=\"sF\">0<\/b><\/span><span style=\"color:var(--hit)\">Hits: <b id=\"sH\">0<\/b><\/span><span>Hit ratio: <b id=\"sR\">\u2013<\/b><\/span><\/div>\n<div class=\"tw\"><table class=\"t\" id=\"tbl\"><\/table><\/div>\n<p class=\"muted\" style=\"text-align:center\">\ud83d\udfe6 reference \u00b7 \ud83d\udfe9 hit \u00b7 \ud83d\udfe5 fault \u00b7 red number = page just loaded<\/p>\n<h3>Race: all four algorithms on this same input<\/h3><div class=\"bars\" id=\"bars\"><\/div><\/section>\n\n<section id=\"algos\"><h2>3. The Algorithms in Detail<\/h2><div class=\"grid\">\n<div class=\"box\"><h3>FIFO \u2013 First In, First Out<\/h3><p><b>Rule:<\/b> evict the page that has been in memory the <b>longest<\/b>.<\/p><p><b>Implementation:<\/b> a queue; new page joins the tail, victim leaves from the head. Hits do <i>not<\/i> change the queue.<\/p><p>\u2705 Very simple, tiny overhead.<br>\u274c Ignores usage \u2013 may throw out a heavily used page.<br>\u26a0 Suffers from <b>Belady\u2019s Anomaly<\/b>.<\/p><button class=\"btn alt\" onclick=\"tryAlg('FIFO')\">Try in simulator<\/button><\/div>\n<div class=\"box\"><h3>LRU \u2013 Least Recently Used<\/h3><p><b>Rule:<\/b> evict the page <b>not used for the longest time<\/b> (looks into the past, assuming the past predicts the future \u2013 <i>temporal locality<\/i>).<\/p><p><b>Implementation:<\/b> timestamps, a stack/linked list (move to top on every access), or approximation bits (clock algorithm).<\/p><p>\u2705 Good performance, close to Optimal. A <b>stack algorithm<\/b> \u2013 no Belady\u2019s anomaly.<br>\u274c Needs hardware support / updates on every reference.<\/p><button class=\"btn alt\" onclick=\"tryAlg('LRU')\">Try in simulator<\/button><\/div>\n<div class=\"box\"><h3>Optimal (OPT / MIN)<\/h3><p><b>Rule:<\/b> evict the page that will be used <b>farthest in the future<\/b> (or never again).<\/p><p><b>Implementation:<\/b> needs future knowledge \u2192 impossible in a real OS.<\/p><p>\u2705 Lowest possible faults; no Belady\u2019s anomaly.<br>\u274c Not implementable. Used as a <b>benchmark<\/b> to judge other algorithms.<\/p><button class=\"btn alt\" onclick=\"tryAlg('OPT')\">Try in simulator<\/button><\/div>\n<div class=\"box\"><h3>LFU \u2013 Least Frequently Used<\/h3><p><b>Rule:<\/b> evict the page with the <b>smallest reference count<\/b>. Ties are broken FIFO (oldest first) in this simulator.<\/p><p><b>Implementation:<\/b> a counter per page, reset when the page is loaded.<\/p><p>\u2705 Keeps \u201cpopular\u201d pages.<br>\u274c A page used heavily long ago stays forever; a newly loaded page (count = 1) is evicted too soon. Counters need ageing.<\/p><button class=\"btn alt\" onclick=\"tryAlg('LFU')\">Try in simulator<\/button><\/div><\/div>\n<div class=\"callout\"><b>Worked example (3 frames, string 7 0 1 2 0 3 0 4 2 3 0 3 2 1 2 0 1 7 0 1):<\/b> FIFO = 15 faults, LRU = 12 faults, Optimal = 9 faults. Run it above and verify. Always: Optimal \u2264 LRU \u2264 FIFO is typical (not guaranteed for every string).<\/div>\n<p class=\"muted\">Other related algorithms to read next: Second-Chance / Clock, NRU, MFU, Aging.<\/p><\/section>\n\n<section id=\"belady\"><h2>4. Belady\u2019s Anomaly<\/h2>\n<p>Intuition says: <b>more frames \u2192 fewer page faults<\/b>. <b>Belady\u2019s Anomaly<\/b> is the surprising case where giving a process <i>more<\/i> frames <i>increases<\/i> faults. It was shown for <b>FIFO<\/b>. Algorithms with the <b>stack property<\/b> (LRU, Optimal) are immune: the set of pages in n frames is always a subset of those in n+1 frames.<\/p>\n<div class=\"ctl\"><button class=\"btn\" id=\"bel\">Load classic string &amp; run chart<\/button><span class=\"muted\">String: 1 2 3 4 1 2 5 1 2 3 4 5<\/span><\/div>\n<div class=\"tw\"><svg id=\"bsvg\" viewBox=\"0 0 560 250\" width=\"100%\" style=\"min-width:420px\"><\/svg><\/div>\n<div class=\"callout\" id=\"bnote\">Click the button: FIFO gives <b>9 faults with 3 frames<\/b> but <b>10 faults with 4 frames<\/b>. LRU only goes down.<\/div><\/section>\n\n<section id=\"thrash\"><h2>5. Thrashing<\/h2>\n<p><b>Thrashing<\/b> = the system spends more time <b>swapping pages<\/b> than executing instructions. It happens when processes do not have enough frames for their <b>working set<\/b> (the pages they actively use). Each fault evicts a page that is needed again almost immediately \u2192 faults pile up \u2192 CPU sits idle waiting for the disk.<\/p>\n<h3>The vicious cycle<\/h3>\n<p>Low CPU utilisation \u2192 OS adds more processes (higher multiprogramming) \u2192 each gets fewer frames \u2192 more page faults \u2192 disk queue grows \u2192 CPU even more idle \u2192 OS adds <i>even more<\/i> processes\u2026<\/p>\n<div class=\"box\"><b>Drag the slider: degree of multiprogramming<\/b>\n<input type=\"range\" id=\"deg\" min=\"1\" max=\"20\" value=\"4\"><svg id=\"tsvg\" viewBox=\"0 0 560 240\" width=\"100%\"><\/svg><div id=\"tmsg\" style=\"text-align:center;font-weight:700\"><\/div><\/div>\n<h3>Remedies<\/h3><div class=\"grid\">\n<div class=\"box\"><b>Working-Set Model<\/b><br>Keep the pages referenced in the last \u0394 references. If \u03a3 working sets &gt; available frames, suspend a process.<\/div>\n<div class=\"box\"><b>Page-Fault Frequency (PFF)<\/b><br>Set an upper and lower fault-rate bound. Fault rate too high \u2192 give frames; too low \u2192 take frames.<\/div>\n<div class=\"box\"><b>Local replacement<\/b><br>A process can only evict its own pages, so one thrashing process cannot steal from others.<\/div>\n<div class=\"box\"><b>Other fixes<\/b><br>Reduce multiprogramming, add RAM, improve locality of programs, use prepaging carefully.<\/div><\/div><\/section>\n\n<section id=\"sum\"><h2>6. Cheat Sheet<\/h2><div class=\"tw\"><table class=\"cmp\">\n<tr><th>Algorithm<\/th><th>Victim<\/th><th>Needs<\/th><th>Belady?<\/th><th>Quality<\/th><\/tr>\n<tr><td>FIFO<\/td><td>Oldest loaded<\/td><td>Queue<\/td><td>Yes<\/td><td>Poor\u2013Fair<\/td><\/tr>\n<tr><td>LRU<\/td><td>Least recently used<\/td><td>Timestamps / stack<\/td><td>No<\/td><td>Good<\/td><\/tr>\n<tr><td>Optimal<\/td><td>Used farthest in future<\/td><td>Future knowledge<\/td><td>No<\/td><td>Best (theory)<\/td><\/tr>\n<tr><td>LFU<\/td><td>Lowest use count<\/td><td>Counters<\/td><td>Not a stack algorithm<\/td><td>Fair<\/td><\/tr><\/table><\/div>\n<h3>Exam tips<\/h3><ul><li>Count a <b>fault<\/b> every time a page is absent \u2013 including the initial fills.<\/li><li>For Optimal, look <b>forward<\/b>; for LRU, look <b>backward<\/b>.<\/li><li>Pages that never appear again are the best OPT victims.<\/li><li>FIFO anomaly string to remember: <b>1 2 3 4 1 2 5 1 2 3 4 5<\/b> (3 vs 4 frames).<\/li><li>Thrashing is cured by controlling multiprogramming, not by faster CPU.<\/li><\/ul><\/section>\n<\/main>\n<script>\nconst $=id=>document.getElementById(id);\n/* ---------- THEMES + BACKGROUND ---------- */\nconst TH=[['galaxy','\ud83c\udf0c Galaxy'],['blackhole','\ud83d\udd73 Black Hole'],['supernova','\ud83d\udca5 Supernova'],['aurora','\ud83c\udf3f Aurora'],['neon','\ud83c\udf06 Cyberpunk'],['ocean','\ud83c\udf0a Deep Ocean'],['sunset','\ud83c\udf07 Sunset Retro'],['paper','\ud83d\udcc4 Paper']];\nconst cv=$('bg'),cx=cv.getContext('2d');let W,H,P=[],theme='galaxy',t=0;\nfunction rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;init()}addEventListener('resize',rs);\nconst R=Math.random;\nfunction init(){const n={galaxy:260,blackhole:420,supernova:180,aurora:90,ocean:50,sunset:40,paper:40,neon:0}[theme]||0;P=[];\nfor(let i=0;i<n;i++)P.push({x:R()*W,y:R()*H,r:R()*1.6+.3,p:R()*6.3,a:R()*6.3,d:60+R()*220,s:R()+.2,l:R()})}\nfunction stars(c){P.forEach(s=>{cx.globalAlpha=.4+.6*Math.abs(Math.sin(t/700+s.p));cx.fillStyle=c;cx.fillRect(s.x,s.y,s.r,s.r)});cx.globalAlpha=1}\nfunction glow(x,y,r,c){const g=cx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c);g.addColorStop(1,'transparent');cx.fillStyle=g;cx.beginPath();cx.arc(x,y,r,0,7);cx.fill()}\nconst draw={\ngalaxy(){stars('#fff');glow(W*.5,H*.5,Math.min(W,H)*.5,'rgba(130,70,255,.18)');for(let k=0;k<260;k++){const a=k*.13+t/4000,r=k*2.2;cx.fillStyle=`hsla(${260+k/2},90%,70%,.5)`;cx.fillRect(W/2+Math.cos(a)*r,H/2+Math.sin(a)*r*.5,2,2)}},\nblackhole(){stars('#ffe');const x=W/2,y=H*.45;glow(x,y,300,'rgba(255,140,40,.28)');P.forEach(s=>{s.a+=.9/s.d*.6;const px=x+Math.cos(s.a)*s.d*1.5,py=y+Math.sin(s.a)*s.d*.4;cx.fillStyle=`hsl(${25+s.d/8},100%,${55+s.l*35}%)`;cx.fillRect(px,py,2.2,2.2)});glow(x,y,90,'rgba(255,200,120,.5)');cx.fillStyle='#000';cx.beginPath();cx.arc(x,y,48,0,7);cx.fill()},\nsupernova(){glow(W/2,H/2,260+40*Math.sin(t/300),'rgba(255,90,20,.3)');P.forEach(s=>{s.l+=.004*s.s;if(s.l>1){s.l=0;s.a=R()*6.3}const r=s.l*Math.max(W,H)*.7;cx.globalAlpha=1-s.l;cx.fillStyle=`hsl(${55-s.l*55},100%,${60-s.l*20}%)`;cx.beginPath();cx.arc(W/2+Math.cos(s.a)*r,H/2+Math.sin(s.a)*r,2+s.r*2*(1-s.l),0,7);cx.fill()});cx.globalAlpha=1},\naurora(){stars('#dfe');for(let i=0;i<4;i++){const b=H*(.2+i*.1),g=cx.createLinearGradient(0,b-60,0,b+240);g.addColorStop(0,'transparent');g.addColorStop(.4,i%2?'rgba(55,213,255,.35)':'rgba(43,255,176,.38)');g.addColorStop(1,'transparent');cx.fillStyle=g;cx.beginPath();cx.moveTo(0,b+240);for(let x=0;x<=W;x+=12)cx.lineTo(x,b+Math.sin(x/170+t/1200+i)*50+Math.sin(x/60+t/700)*12);cx.lineTo(W,b+240);cx.fill()}},\nneon(){const hz=H*.55;cx.strokeStyle='#ff2bd6';cx.lineWidth=1;cx.shadowColor='#ff2bd6';cx.shadowBlur=8;for(let i=-20;i<=20;i++){cx.beginPath();cx.moveTo(W/2+i*20,hz);cx.lineTo(W/2+i*W/10,H);cx.stroke()}cx.strokeStyle='#00f0ff';cx.shadowColor='#00f0ff';for(let i=0;i<14;i++){const f=((i+t/1500)%14)/14,y=hz+(H-hz)*f*f;cx.beginPath();cx.moveTo(0,y);cx.lineTo(W,y);cx.stroke()}cx.shadowBlur=0;glow(W/2,hz,200,'rgba(255,43,214,.3)')},\nocean(){const g=cx.createLinearGradient(0,0,0,H);for(let i=0;i<3;i++){const x=W*(.2+i*.3)+Math.sin(t/2000+i)*60;const l=cx.createLinearGradient(x,0,x+120,H);l.addColorStop(0,'rgba(80,220,255,.12)');l.addColorStop(1,'transparent');cx.fillStyle=l;cx.beginPath();cx.moveTo(x,0);cx.lineTo(x+80,0);cx.lineTo(x+260,H);cx.lineTo(x+60,H);cx.fill()}P.forEach(s=>{s.y-=s.s*.8;if(s.y<-20){s.y=H+20;s.x=R()*W}const x=s.x+Math.sin(t/600+s.p)*12,r=3+s.r*5;glow(x,s.y,r*3,'rgba(60,255,210,.25)');cx.strokeStyle='rgba(150,240,255,.7)';cx.beginPath();cx.arc(x,s.y,r,0,7);cx.stroke()})},\nsunset(){const y=H*.62;glow(W/2,y,Math.min(W,H)*.45,'rgba(255,230,120,.5)');cx.fillStyle='#ffd36b';cx.beginPath();cx.arc(W/2,y,Math.min(W,H)*.15,0,Math.PI,true);cx.fill();cx.fillStyle='rgba(60,10,90,.55)';cx.fillRect(0,y,W,H-y);cx.strokeStyle='rgba(255,180,220,.5)';for(let i=0;i<8;i++){const yy=y+10+i*i*3.5;cx.beginPath();for(let x=0;x<=W;x+=20)cx.lineTo(x,yy+Math.sin(x/90+t/600+i)*(2+i));cx.stroke()}P.forEach(s=>{s.x+=s.s*.4;if(s.x>W)s.x=-60;cx.fillStyle='rgba(255,255,255,.18)';cx.fillRect(s.x,s.y*.5,50*s.s,3)})},\npaper(){P.forEach(s=>{s.y+=s.s*.15;s.x+=Math.sin(t/2000+s.p)*.2;if(s.y>H)s.y=-10;cx.fillStyle='rgba(60,90,200,.12)';cx.beginPath();cx.arc(s.x,s.y,s.r*5,0,7);cx.fill()});glow(W*.2,H*.2,300,'rgba(214,51,108,.06)');glow(W*.85,H*.8,340,'rgba(59,91,219,.07)')}};\nfunction loop(ts){t=ts;cx.clearRect(0,0,W,H);draw[theme]();requestAnimationFrame(loop)}\nfunction setTheme(k){theme=k;document.body.dataset.theme=k;[...$('themes').children].forEach(b=>b.classList.toggle('on',b.dataset.k==k));init()}\nTH.forEach(([k,n])=>{const b=document.createElement('button');b.textContent=n;b.dataset.k=k;b.onclick=()=>setTheme(k);$('themes').appendChild(b)});\nrs();setTheme('galaxy');requestAnimationFrame(loop);\n/* ---------- FLOW HIGHLIGHT ---------- */\nlet fi=0;setInterval(()=>{const s=[...document.querySelectorAll('#flow .st')];s.forEach((e,i)=>e.classList.toggle('on',i==fi));fi=(fi+1)%s.length},1100);\n/* ---------- SIMULATOR ---------- */\nfunction sim(ref,n,alg){let fr=[],ld={},la={},fq={},out=[],f=0;\nref.forEach((p,i)=>{const hit=fr.includes(p);let ev=null,slot=fr.indexOf(p),why='';\nif(hit){la[p]=i;fq[p]++}else{f++;if(fr.length<n){fr.push(p);slot=fr.length-1;why='free frame available'}else{let v;\nif(alg=='FIFO'){v=fr.reduce((a,b)=>ld[b]<ld[a]?b:a);why='oldest loaded'}\nelse if(alg=='LRU'){v=fr.reduce((a,b)=>la[b]<la[a]?b:a);why='least recently used'}\nelse if(alg=='LFU'){v=fr.reduce((a,b)=>fq[b]<fq[a]||(fq[b]==fq[a]&&ld[b]<ld[a])?b:a);why='lowest frequency ('+fq[v]+')'}\nelse{const nx=q=>{const k=ref.indexOf(q,i+1);return k<0?1e9:k};v=fr.reduce((a,b)=>nx(b)>nx(a)?b:a);why=nx(v)==1e9?'never used again':'used farthest in future'}\nslot=fr.indexOf(v);fr[slot]=p;ev=v}ld[p]=i;la[p]=i;fq[p]=1}\nout.push({p,fr:[...fr],hit,ev,slot,why})});return out}\nlet S=[],k=0,timer=null;\nconst rd=()=>$('ref').value.trim().split(/[\\s,]+/).filter(x=>x!=='').map(Number).filter(x=>!isNaN(x)).slice(0,40);\nfunction build(){stop();S=sim(rd(),+$('nf').value,$('alg').value);k=0;draw2()}\nfunction draw2(){const n=+$('nf').value,cur=k?S[k-1]:null;\n$('ram').innerHTML=[...Array(n)].map((_,i)=>{const v=cur&&cur.fr[i]!==undefined?cur.fr[i]:'';const c=cur&&i==cur.slot?(cur.hit?'hit':'new'):'';return `<div class=\"fr ${c}\"><small>frame ${i}<\/small>${v}<\/div>`}).join('');\n$('msg').innerHTML=!cur?'Press Play or Step':cur.hit?`Page <b>${cur.p}<\/b> \u2192 <span style=\"color:var(--hit)\">HIT<\/span>`:`Page <b>${cur.p}<\/b> \u2192 <span style=\"color:var(--fault)\">FAULT<\/span>${cur.ev!==null?` \u00b7 evict <b>${cur.ev}<\/b> (${cur.why})`:' \u00b7 loaded into free frame'}`;\nconst sh=S.slice(0,k),fl=sh.filter(s=>!s.hit).length;\n$('sS').textContent=k+'/'+S.length;$('sF').textContent=fl;$('sH').textContent=k-fl;$('sR').textContent=k?((k-fl)/k*100).toFixed(1)+'%':'\u2013';\nlet h='<tr><th>Ref<\/th>'+sh.map((s,i)=>`<td class=\"ref ${i==k-1?'cur':''}\">${s.p}<\/td>`).join('')+'<\/tr>';\nfor(let r=0;r<n;r++)h+=`<tr><th>F${r}<\/th>`+sh.map((s,i)=>`<td class=\"${i==k-1?'cur':''} ${!s.hit&&s.slot==r?'ld':''}\">${s.fr[r]??''}<\/td>`).join('')+'<\/tr>';\nh+='<tr><th>Result<\/th>'+sh.map(s=>`<td class=\"${s.hit?'H':'F'}\">${s.hit?'H':'F'}<\/td>`).join('')+'<\/tr>';$('tbl').innerHTML=h;\nconst w=$('tbl').parentElement;w.scrollLeft=w.scrollWidth;bars()}\nfunction bars(){const r=rd(),n=+$('nf').value,res=['FIFO','LRU','OPT','LFU'].map(a=>[a,sim(r,n,a).filter(s=>!s.hit).length]),m=Math.max(...res.map(x=>x[1]),1);\n$('bars').innerHTML=res.map(([a,f])=>`<div class=\"row\"><span class=\"lab\">${a=='OPT'?'Optimal':a}<\/span><div class=\"bar\" style=\"width:${f/m*70}%\"><\/div><b>${f} faults<\/b><\/div>`).join('')}\nfunction step(){if(k<S.length){k++;draw2()}else stop()}\nfunction stop(){clearInterval(timer);timer=null;$('play').textContent='\u25b6 Play'}\n$('play').onclick=()=>{if(timer)return stop();if(k>=S.length)k=0;$('play').textContent='\u23f8 Pause';timer=setInterval(step,+$('spd').value);step()};\n$('stp').onclick=()=>{stop();step()};$('all').onclick=()=>{stop();k=S.length;draw2()};$('rst').onclick=build;\n$('rnd').onclick=()=>{$('ref').value=[...Array(16)].map(()=>Math.floor(R()*8)).join(' ');build()};\n['ref','nf','alg'].forEach(i=>$(i).onchange=build);$('spd').onchange=()=>{if(timer){stop();$('play').click()}};\nfunction tryAlg(a){$('alg').value=a;build();$('sim').scrollIntoView()}\nbuild();\n/* ---------- BELADY ---------- */\n$('bel').onclick=()=>{$('ref').value='1 2 3 4 1 2 5 1 2 3 4 5';const r=rd(),fs=[1,2,3,4,5,6,7],A=fs.map(n=>sim(r,n,'FIFO').filter(s=>!s.hit).length),B=fs.map(n=>sim(r,n,'LRU').filter(s=>!s.hit).length);\nlet s='<line x1=\"40\" y1=\"200\" x2=\"550\" y2=\"200\" stroke=\"currentColor\" opacity=\".4\"/>';\nfs.forEach((n,i)=>{const x=60+i*72,up=i>0&&A[i]>A[i-1];\ns+=`<rect x=\"${x}\" width=\"26\" y=\"${200-A[i]*15}\" height=\"${A[i]*15}\" rx=\"4\" fill=\"${up?'var(--fault)':'var(--a)'}\"><animate attributeName=\"height\" from=\"0\" to=\"${A[i]*15}\" dur=\".8s\"/><animate attributeName=\"y\" from=\"200\" to=\"${200-A[i]*15}\" dur=\".8s\"/><\/rect><rect x=\"${x+28}\" width=\"26\" y=\"${200-B[i]*15}\" height=\"${B[i]*15}\" rx=\"4\" fill=\"var(--hit)\"/>\n<text x=\"${x+13}\" y=\"${195-A[i]*15}\" font-size=\"12\" text-anchor=\"middle\">${A[i]}<\/text><text x=\"${x+41}\" y=\"${195-B[i]*15}\" font-size=\"12\" text-anchor=\"middle\">${B[i]}<\/text><text x=\"${x+27}\" y=\"218\" font-size=\"12\" text-anchor=\"middle\">${n} frame${n>1?'s':''}<\/text>`});\ns+='<text x=\"60\" y=\"16\" font-size=\"13\">\u25a0 FIFO (red bar = faults went UP)<\/text><text x=\"330\" y=\"16\" font-size=\"13\" style=\"fill:var(-- ver\">\n<title>File &amp; Disk Management \u2014 Visual Lab<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Nunito+Sans:wght@400;600&display=swap\" rel=\"stylesheet\">\n<style>\n:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n*,*:before,*:after{box-sizing:inherit}\n[data-t=galaxy]{--bg:linear-gradient(160deg,#0b0724,#1b1458 55%,#2a1160);--fg:#eeecff;--mu:#b9b3e6;--card:rgba(20,14,60,.78);--a:#a595ff;--b:#5ec8ff;--cell:rgba(255,255,255,.1)}\n[data-t=blackhole]{--bg:radial-gradient(circle at 50% 45%,#1a0e04,#050505 60%);--fg:#f7f0e6;--mu:#c9b79e;--card:rgba(14,9,5,.8);--a:#ff9a2e;--b:#ffe3b8;--cell:rgba(255,255,255,.09)}\n[data-t=supernova]{--bg:radial-gradient(circle at 50% 40%,#3a0d03,#170303 70%);--fg:#fff1e0;--mu:#ffc9a0;--card:rgba(40,8,4,.8);--a:#ff7a21;--b:#ffd23f;--cell:rgba(255,255,255,.1)}\n[data-t=aurora]{--bg:linear-gradient(180deg,#02101a,#06262b 70%,#0a3a3a);--fg:#e8fff8;--mu:#a5e4d3;--card:rgba(4,30,34,.78);--a:#39f0b0;--b:#46d1ff;--cell:rgba(255,255,255,.1)}\n[data-t=cyber]{--bg:linear-gradient(180deg,#0a0614,#1a0733 70%,#2a0840);--fg:#f6ecff;--mu:#d0b6f0;--card:rgba(16,8,34,.82);--a:#ff2bd6;--b:#19f0ff;--cell:rgba(255,255,255,.1)}\n[data-t=ocean]{--bg:linear-gradient(180deg,#02213d,#01101f 80%);--fg:#e3f6ff;--mu:#9fd2ec;--card:rgba(2,26,50,.78);--a:#34d6ff;--b:#7dffd4;--cell:rgba(255,255,255,.1)}\n[data-t=sunset]{--bg:linear-gradient(180deg,#5b2a86,#ff5e8a 55%,#ff9966);--fg:#fff6ee;--mu:#ffd9c7;--card:rgba(58,18,70,.8);--a:#ffb347;--b:#ff9de0;--cell:rgba(255,255,255,.12)}\n[data-t=paper]{--bg:#f6f7f9;--fg:#1a1d24;--mu:#556070;--card:#ffffff;--a:#3b5bdb;--b:#e8590c;--cell:rgba(30,40,60,.08)}\nhtml{background:var(--bg) fixed;color:var(--fg);scroll-behavior:smooth}\nbody{margin:0;font:400 16px/1.6 \"Nunito Sans\",system-ui,sans-serif;min-height:100vh;transition:color .4s}\n#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}\nmain,header{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:0 16px}\nh1,h2,h3{font-family:Sora,system-ui,sans-serif;line-height:1.2;margin:0}\nh1{font-size:clamp(1.9rem,5vw,3.1rem);font-weight:800;padding-top:28px}\nh2{font-size:1.5rem;margin-bottom:6px}h3{font-size:1.05rem;margin:14px 0 6px;color:var(--a)}\n.sub{color:var(--mu);max-width:60ch;margin:8px 0 18px}\n.themes{position:sticky;top:0;z-index:5;display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:var(--card);backdrop-filter:blur(10px);scrollbar-width:thin}\n.themes button{flex:none}\nbutton,select,input{font:inherit;color:var(--fg)}\nbutton{background:var(--cell);border:1px solid color-mix(in srgb,var(--a) 45%,transparent);border-radius:999px;padding:6px 14px;cursor:pointer;transition:.2s}\nbutton:hover{border-color:var(--a)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--b);outline-offset:2px}\nbutton.on{background:var(--a);color:#fff;border-color:var(--a);font-weight:600}\n[data-t=sunset] button.on,[data-t=aurora] button.on,[data-t=ocean] button.on{color:#06121a}\n[data-t=cyber] button.on{color:#14001a}\ninput,select{background:var(--cell);border:1px solid color-mix(in srgb,var(--fg) 25%,transparent);border-radius:8px;padding:5px 8px}\ninput[type=range]{padding:0;accent-color:var(--a)}\nsection{background:var(--card);border:1px solid color-mix(in srgb,var(--a) 30%,transparent);border-radius:18px;padding:22px;margin:22px 0;backdrop-filter:blur(6px)}\n.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}\n.lbl{color:var(--mu);font-size:.9rem}\n.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}\n@media(max-width:720px){.grid2{grid-template-columns:1fr}}\nul{margin:4px 0;padding-left:20px}li{margin:2px 0}\n.note{border-left:3px solid var(--b);padding:2px 12px;margin:10px 0;color:var(--mu)}\n.scroll{overflow-x:auto}\ntable{border-collapse:collapse;width:100%;font-size:.92rem}th,td{border-bottom:1px solid color-mix(in srgb,var(--fg) 18%,transparent);padding:6px 8px;text-align:left}th{color:var(--a)}\n/* layers */\n.layers{display:flex;flex-direction:column;gap:4px;max-width:420px}\n.layers div{padding:7px 12px;border-radius:8px;background:var(--cell);border-left:4px solid var(--a);animation:sh 4s infinite}\n@keyframes sh{0%,100%{border-left-color:var(--a)}50%{border-left-color:var(--b)}}\n.layers div:nth-child(2){animation-delay:.6s}.layers div:nth-child(3){animation-delay:1.2s}.layers div:nth-child(4){animation-delay:1.8s}.layers div:nth-child(5){animation-delay:2.4s}.layers div:nth-child(6){animation-delay:3s}\n/* access */\n.recs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}\n.rec{width:54px;height:54px;border-radius:10px;background:var(--cell);display:grid;place-items:center;font-weight:700;position:relative;transition:.2s}\n.rec.on{background:var(--a);color:#fff;transform:translateY(-6px) scale(1.08);box-shadow:0 8px 20px color-mix(in srgb,var(--a) 55%,transparent)}\n.rec.seen{background:color-mix(in srgb,var(--a) 28%,transparent)}\n.rec.hit{background:var(--b);color:#06121a}\n.idx{display:flex;gap:4px;flex-wrap:wrap;font-size:.8rem;margin:6px 0}.idx span{padding:2px 8px;border-radius:6px;background:var(--cell)}.idx .on{background:var(--b);color:#06121a}\n.stat{font-family:Sora,sans-serif;font-weight:700;color:var(--b)}\n/* disk blocks */\n.disk{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-width:520px}\n.blk{aspect-ratio:1;border-radius:7px;background:var(--cell);font-size:.7rem;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;color:var(--mu)}\n.blk.f{color:#fff;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.5);animation:pop .45s backwards}\n.blk small{font-size:.62rem;opacity:.9}\n@keyframes pop{from{transform:scale(0);opacity:0}}\n.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;color:#fff;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.5)}\n.chip button{padding:0 6px;background:rgba(0,0,0,.3);border:0;color:#fff}\ncanvas.dc{width:100%;height:380px;border-radius:12px;background:var(--cell);display:block}\n.bar{display:flex;align-items:center;gap:8px;margin:5px 0}.bar b{width:70px;font-family:Sora,sans-serif;font-size:.85rem}.bar i{display:block;height:20px;border-radius:6px;background:linear-gradient(90deg,var(--a),var(--b));transition:width .7s;min-width:4px}.bar u{text-decoration:none;color:var(--mu);font-size:.85rem}\n@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n<\/style>\n<\/head>\n<body>\n<canvas id=\"bg\"><\/canvas>\n<nav class=\"themes\" id=\"themes\" aria-label=\"Theme switcher\"><\/nav>\n<header>\n  <h1>File &amp; Disk Management<\/h1>\n  <p class=\"sub\">Play with it, don\u2019t just read it. Three live simulations: how a file is accessed, how it is laid out on disk, and how the disk head is scheduled.<\/p>\n<\/header>\n<main>\n\n<section id=\"intro\">\n  <h2>The big picture<\/h2>\n  <div class=\"grid2\">\n    <div class=\"layers\"><div>Application program<\/div><div>Logical file system (names, directories, permissions)<\/div><div>File-organisation module (logical \u2192 physical block)<\/div><div>Basic file system (read/write block N)<\/div><div>I/O control (device drivers, interrupts)<\/div><div>Disk hardware (platters, heads, cylinders)<\/div><\/div>\n    <div>\n      <ul>\n        <li><b>File<\/b> = named collection of related data on secondary storage, described by a <b>File Control Block<\/b> (name, size, owner, permissions, block pointers).<\/li>\n        <li><b>Access mechanism<\/b> = how we read records <i>inside<\/i> a file.<\/li>\n        <li><b>Allocation method<\/b> = how a file\u2019s blocks are placed <i>on the disk<\/i>.<\/li>\n        <li><b>Disk scheduling<\/b> = in what order pending I/O requests are served.<\/li>\n      <\/ul>\n      <div class=\"note\">Disk access time = <b>seek time<\/b> (move head) + <b>rotational latency<\/b> (wait for sector) + <b>transfer time<\/b>. Seek dominates, so schedulers minimise head movement.<\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<section id=\"access\">\n  <h2>1 \u00b7 File access mechanism<\/h2>\n  <p class=\"sub\">Pick a method and a record, then press Run to watch the pointer travel.<\/p>\n  <div class=\"row\" id=\"amodes\"><\/div>\n  <div class=\"row\"><span class=\"lbl\">Target record<\/span><input type=\"range\" id=\"atgt\" min=\"1\" max=\"12\" value=\"9\"><b id=\"atv\">9<\/b><button id=\"arun\" class=\"on\">\u25b6 Run<\/button><span class=\"lbl\">Steps taken:<\/span><span class=\"stat\" id=\"asteps\">0<\/span><\/div>\n  <div class=\"recs\" id=\"recs\"><\/div>\n  <div class=\"idx\" id=\"aidx\"><\/div>\n  <p id=\"atxt\" class=\"lbl\"><\/p>\n  <div class=\"scroll\"><table>\n    <tr><th>Method<\/th><th>How it works<\/th><th>Good for<\/th><th>Drawback<\/th><\/tr>\n    <tr><td>Sequential<\/td><td>Records read in order; a current-position pointer moves forward (read next, rewind).<\/td><td>Tapes, logs, compilers<\/td><td>Reaching record n costs n steps<\/td><\/tr>\n    <tr><td>Direct (random)<\/td><td>Jump to block n using address = base + (n \u2212 1) \u00d7 record size.<\/td><td>Databases, instant lookups<\/td><td>Needs fixed-size records / known block numbers<\/td><\/tr>\n    <tr><td>Indexed<\/td><td>An index maps a key to a block; search the index, then jump (ISAM, multi-level index).<\/td><td>Large files searched by key<\/td><td>Extra space and an extra read for the index<\/td><\/tr>\n  <\/table><\/div>\n<\/section>\n\n<section id=\"alloc\">\n  <h2>2 \u00b7 File allocation methods<\/h2>\n  <p class=\"sub\">A 64-block disk. Add files of any size, delete some, and watch what each method does. Try: add 5, 3, 6, delete the middle one, then add 8 in Contiguous mode.<\/p>\n  <div class=\"row\" id=\"lmodes\"><\/div>\n  <div class=\"row\"><span class=\"lbl\">File size (blocks)<\/span><input type=\"number\" id=\"fsz\" min=\"1\" max=\"40\" value=\"5\" style=\"width:70px\"><button id=\"fadd\" class=\"on\">\uff0b Add file<\/button><button id=\"fcmp\">Compact<\/button><button id=\"frst\">Reset<\/button><\/div>\n  <div class=\"grid2\">\n    <div><div class=\"disk\" id=\"disk\"><\/div><\/div>\n    <div><div id=\"fmsg\" class=\"note\"><\/div><div class=\"row\" id=\"fchips\"><\/div><div class=\"scroll\"><table id=\"ftab\"><\/table><\/div><\/div>\n  <\/div>\n  <div class=\"scroll\"><table>\n    <tr><th>Method<\/th><th>Directory stores<\/th><th>Pros<\/th><th>Cons<\/th><\/tr>\n    <tr><td>Contiguous<\/td><td>start, length<\/td><td>Fast sequential &amp; direct access, minimal seeks<\/td><td>External fragmentation, file growth is hard, needs compaction<\/td><\/tr>\n    <tr><td>Linked<\/td><td>first (and last) block; each block holds a pointer to the next<\/td><td>No external fragmentation, files grow easily<\/td><td>No direct access, pointer space, one lost pointer breaks the chain (FAT keeps the pointers in a table to help)<\/td><\/tr>\n    <tr><td>Indexed<\/td><td>address of the index block, which lists all data blocks<\/td><td>Direct access, no external fragmentation<\/td><td>Index-block overhead; large files need linked / multi-level / combined (Unix inode) schemes<\/td><\/tr>\n  <\/table><\/div>\n<\/section>\n\n<section id=\"sched\">\n  <h2>3 \u00b7 Disk scheduling algorithms<\/h2>\n  <p class=\"sub\">Time runs downward, cylinder number runs left to right. Edit the queue, choose an algorithm, drag the slider or press Play.<\/p>\n  <div class=\"row\"><span class=\"lbl\">Queue<\/span><input id=\"dq\" value=\"98, 183, 37, 122, 14, 124, 65, 67\" style=\"flex:1;min-width:200px\"><span class=\"lbl\">Head<\/span><input id=\"dh\" type=\"number\" value=\"53\" style=\"width:70px\"><span class=\"lbl\">Max cyl.<\/span><input id=\"dm\" type=\"number\" value=\"199\" style=\"width:80px\"><select id=\"dd\"><option value=\"up\">Moving \u2192 up<\/option><option value=\"down\">Moving \u2193 down<\/option><\/select><\/div>\n  <div class=\"row\" id=\"smodes\"><\/div>\n  <canvas class=\"dc\" id=\"dc\"><\/canvas>\n  <div class=\"row\"><button id=\"dplay\" class=\"on\">\u25b6 Play<\/button><input type=\"range\" id=\"dsl\" min=\"0\" max=\"1\" step=\"0.01\" value=\"0\" style=\"flex:1;min-width:140px\"><span class=\"lbl\">Head movement:<\/span><span class=\"stat\" id=\"dtot\">0<\/span><\/div>\n  <p id=\"dseq\" class=\"lbl\"><\/p>\n  <div class=\"row\"><button id=\"dcmp\">\ud83d\udcca Compare all six on this queue<\/button><\/div>\n  <div id=\"dbars\"><\/div>\n  <div class=\"scroll\"><table>\n    <tr><th>Algorithm<\/th><th>Idea<\/th><th>Strength<\/th><th>Weakness<\/th><\/tr>\n    <tr><td>FCFS<\/td><td>Serve in arrival order<\/td><td>Fair, simple<\/td><td>Wild swings, long total seek<\/td><\/tr>\n    <tr><td>SSTF<\/td><td>Always pick the nearest request<\/td><td>Low average seek<\/td><td>Starvation of far requests<\/td><\/tr>\n    <tr><td>SCAN (elevator)<\/td><td>Sweep to one end, reverse<\/td><td>No starvation, good under load<\/td><td>Goes to the end even if empty; uneven wait<\/td><\/tr>\n    <tr><td>C-SCAN<\/td><td>Sweep to the end, jump to 0, sweep again<\/td><td>Uniform wait time<\/td><td>Return jump is wasted movement<\/td><\/tr>\n    <tr><td>LOOK<\/td><td>SCAN, but reverse at the last request<\/td><td>Less travel than SCAN<\/td><td>Slightly more bookkeeping<\/td><\/tr>\n    <tr><td>C-LOOK<\/td><td>C-SCAN, but jump from last to first request<\/td><td>Best uniformity with little waste<\/td><td>\u2014<\/td><\/tr>\n  <\/table><\/div>\n  <div class=\"note\">Worked example (default queue, head 53, going up): total movement \u2014 FCFS 640 \u00b7 SSTF 236 \u00b7 SCAN 331 \u00b7 C-SCAN 382 (incl. return jump) \u00b7 LOOK 299 \u00b7 C-LOOK 322 (incl. jump). Rule of thumb: light load \u2192 SSTF/LOOK; heavy load \u2192 C-SCAN/C-LOOK. SSDs have no seek, so scheduling matters far less there.<\/div>\n<\/section>\n\n<section id=\"exam\">\n  <h2>Quick revision<\/h2>\n  <ul>\n    <li>Sequential \u2192 n steps; direct \u2192 1 step; indexed \u2192 2 steps (index + data).<\/li>\n    <li>Contiguous suffers <b>external fragmentation<\/b>; linked suffers <b>slow random access<\/b>; indexed pays <b>index overhead<\/b>.<\/li>\n    <li>SCAN/C-SCAN go to the physical disk end; LOOK/C-LOOK stop at the last request.<\/li>\n    <li>Disk scheduling affects <b>seek time<\/b> only. Rotational latency is handled by sector ordering and caching.<\/li>\n  <\/ul>\n<\/section>\n<\/main>\n\n<script>\nconst $=s=>document.querySelector(s),css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();\nfunction mkBtns(box,items,cur,fn){box.innerHTML='';items.forEach(([k,l])=>{const b=document.createElement('button');b.textContent=l;if(k===cur)b.className='on';b.onclick=()=>{[...box.children].forEach(c=>c.classList.remove('on'));b.classList.add('on');fn(k)};box.appendChild(b)})}\n\n/* ---------- THEMES + BACKGROUND ---------- */\nconst TH=[['galaxy','\ud83c\udf0c Galaxy'],['blackhole','\ud83d\udd73 Black Hole'],['supernova','\ud83d\udca5 Supernova'],['aurora','\ud83c\udf3f Aurora'],['cyber','\ud83c\udf06 Cyberpunk'],['ocean','\ud83c\udf0a Deep Ocean'],['sunset','\ud83c\udf05 Sunset Retro'],['paper','\ud83d\udcc4 Paper']];\nconst cv=$('#bg'),c=cv.getContext('2d');let W,H,T='galaxy',P=[],t0=0;\nconst R=Math.random;\nfunction init(){const n={galaxy:170,blackhole:520,supernova:240,aurora:80,cyber:50,ocean:70,sunset:40,paper:36}[T];P=[];for(let i=0;i<n;i++)P.push({x:R()*W,y:R()*H,r:R(),a:R()*6.28,s:.3+R(),d:R(),vx:0,vy:0,l:R()})}\nfunction rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;init()}\nfunction stars(t,col){P.forEach(p=>{c.globalAlpha=.25+.75*Math.abs(Math.sin(t*p.s*1.5+p.a));c.fillStyle=col;c.beginPath();c.arc(p.x,p.y,p.r*1.5+.3,0,6.28);c.fill()});c.globalAlpha=1}\nconst D={\ngalaxy(t){for(let i=0;i<3;i++){const x=W*(.25+.25*i)+Math.sin(t*.1+i)*80,y=H*(.3+.2*i)+Math.cos(t*.12+i)*60,g=c.createRadialGradient(x,y,0,x,y,Math.max(W,H)*.35);g.addColorStop(0,['rgba(150,90,255,.22)','rgba(60,150,255,.18)','rgba(255,90,200,.14)'][i]);g.addColorStop(1,'transparent');c.fillStyle=g;c.fillRect(0,0,W,H)}stars(t,'#e6e2ff')},\nblackhole(t){const cx=W/2,cy=H*.45,k=Math.min(W,H)/800;P.forEach(p=>{const r=(75+p.d*260)*k,a=p.a+t*(1.1/(p.d+.25)),x=cx+Math.cos(a)*r*1.5,y=cy+Math.sin(a)*r*.38;c.fillStyle=`hsl(${28+(1-p.d)*25},100%,${55+(1-p.d)*40}%)`;c.globalAlpha=.35+.65*(1-p.d);c.beginPath();c.arc(x,y,p.r*2+.5,0,6.28);c.fill()});c.globalAlpha=1;const g=c.createRadialGradient(cx,cy,40*k,cx,cy,170*k);g.addColorStop(0,'rgba(255,200,120,.55)');g.addColorStop(1,'transparent');c.fillStyle=g;c.fillRect(0,0,W,H);c.fillStyle='#000';c.beginPath();c.arc(cx,cy,62*k,0,6.28);c.fill()},\nsupernova(t){const cx=W/2,cy=H*.4,g=c.createRadialGradient(cx,cy,0,cx,cy,260+40*Math.sin(t*3));g.addColorStop(0,'rgba(255,230,120,.5)');g.addColorStop(1,'transparent');c.fillStyle=g;c.fillRect(0,0,W,H);c.globalCompositeOperation='lighter';P.forEach(p=>{if(!p.vx||p.l>1){const a=R()*6.28,v=.8+R()*3.2;p.x=cx;p.y=cy;p.vx=Math.cos(a)*v;p.vy=Math.sin(a)*v;p.l=0}p.x+=p.vx;p.y+=p.vy;p.l+=.006;c.fillStyle=`hsla(${55-p.l*50},100%,${60-p.l*20}%,${1-p.l})`;c.beginPath();c.arc(p.x,p.y,2.4*(1-p.l)+.4,0,6.28);c.fill()});c.globalCompositeOperation='source-over'},\naurora(t){stars(t,'#d8fff2');c.globalCompositeOperation='lighter';[['57,240,176'],['70,209,255'],['150,110,255']].forEach(([col],k)=>{for(let x=0;x<W;x+=6){const y=H*(.22+.1*k)+Math.sin(x*.004+t*.35*(k+1)+k*2)*55+Math.sin(x*.011+t*.5)*18,g=c.createLinearGradient(0,y-30,0,y+200);g.addColorStop(0,'rgba('+col+',0)');g.addColorStop(.15,'rgba('+col+','+(.2+.1*Math.sin(x*.01+t))+')');g.addColorStop(1,'rgba('+col+',0)');c.fillStyle=g;c.fillRect(x,y-30,6,230)}});c.globalCompositeOperation='source-over'},\ncyber(t){const hz=H*.58;c.lineWidth=1.5;c.shadowBlur=10;c.shadowColor='#ff2bd6';c.strokeStyle='rgba(255,43,214,.7)';for(let i=-14;i<=14;i++){c.beginPath();c.moveTo(W/2+i*20,hz);c.lineTo(W/2+i*W*.12,H);c.stroke()}for(let i=0;i<12;i++){const f=((i+(t*.6)%1)/12),y=hz+(H-hz)*f*f;c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}c.shadowColor='#19f0ff';c.strokeStyle='#19f0ff';P.forEach(p=>{p.y+=p.s*3;if(p.y>hz)p.y=0;c.globalAlpha=.7;c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x,p.y+14+p.r*20);c.stroke()});c.globalAlpha=1;c.shadowBlur=0},\nocean(t){const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(60,200,255,.12)');g.addColorStop(1,'transparent');c.fillStyle=g;c.fillRect(0,0,W,H);P.forEach(p=>{p.y-=p.s*.6+.15;if(p.y<-20){p.y=H+20;p.x=R()*W}const x=p.x+Math.sin(t*p.s+p.a)*14,r=3+p.r*11;c.strokeStyle='rgba(125,255,212,.55)';c.fillStyle='rgba(52,214,255,.12)';c.shadowColor='#7dffd4';c.shadowBlur=12;c.beginPath();c.arc(x,p.y,r,0,6.28);c.fill();c.stroke()});c.shadowBlur=0},\nsunset(t){const cx=W/2,cy=H*.62,g=c.createLinearGradient(0,cy-110,0,cy+110);g.addColorStop(0,'#ffe27a');g.addColorStop(1,'#ff4f8b');c.fillStyle=g;c.beginPath();c.arc(cx,cy,110,0,6.28);c.fill();c.fillStyle='rgba(91,42,134,.9)';for(let i=0;i<6;i++)c.fillRect(cx-120,cy+10+i*18,240,3+i*2);P.forEach(p=>{p.x+=p.s*.3;if(p.x>W+80)p.x=-80;c.fillStyle='rgba(255,230,240,.2)';c.beginPath();c.ellipse(p.x,p.y*.5,40+p.r*50,5+p.r*5,0,0,6.28);c.fill()});for(let k=0;k<3;k++){c.fillStyle=['rgba(120,40,140,.35)','rgba(90,30,120,.45)','rgba(50,15,80,.6)'][k];c.beginPath();c.moveTo(0,H);for(let x=0;x<=W;x+=12)c.lineTo(x,H*(.86+.04*k)+Math.sin(x*.01+t*(.6+k*.3)+k)*10);c.lineTo(W,H);c.fill()}},\npaper(t){c.strokeStyle='rgba(59,91,219,.1)';P.forEach(p=>{p.x+=Math.cos(p.a+t*.1)*.25;p.y+=Math.sin(p.a+t*.1)*.25;if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0});for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const d=Math.hypot(P[i].x-P[j].x,P[i].y-P[j].y);if(d<130){c.globalAlpha=1-d/130;c.beginPath();c.moveTo(P[i].x,P[i].y);c.lineTo(P[j].x,P[j].y);c.stroke()}}c.globalAlpha=1;c.fillStyle='rgba(59,91,219,.25)';P.forEach(p=>{c.beginPath();c.arc(p.x,p.y,2,0,6.28);c.fill()})}};\nfunction frame(ms){c.clearRect(0,0,W,H);D[T](ms/1000);if(!matchMedia('(prefer
