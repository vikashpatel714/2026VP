pan.ln{display:block;padding:0 8px;border-left:3px solid transparent;transition:.3s;white-space:pre}\npre.code span.ln.on{background:rgba(245,158,11,.28);border-left-color:var(--warn)}\n.cells{display:grid;grid-template-columns:repeat(32,1fr);gap:2px;margin:8px 0}\n.cells i{aspect-ratio:1;background:var(--inbg);border:1px solid var(--border);border-radius:2px;transition:.2s}\n.cells i.done{background:var(--good);border-color:var(--good)}\n.blk{border:2px solid var(--border);border-radius:8px;padding:6px 8px;margin:6px 0;background:var(--inbg);transition:.3s}\n.blk>b{font-size:.78rem;color:var(--accent2);margin-right:6px}\n.thr{display:inline-grid;place-items:center;width:34px;height:30px;margin:2px;border-radius:5px;background:var(--inbg);border:1px solid var(--border);font-size:.7rem;cursor:pointer;transition:.3s}\n.thr.run{background:var(--warn);color:#000;transform:scale(1.15);border-color:var(--warn)}\n.thr.done{background:var(--good);color:#000;border-color:var(--good)}\n.thr.skip{background:var(--bad);color:#fff;opacity:.75}\n.thr.mask{opacity:.2}\n.mem{display:inline-block;min-width:54px;padding:6px;margin:3px;border:2px dashed var(--border);border-radius:8px;text-align:center;font-weight:700;transition:.3s}\n.mem.fill{border-style:solid;background:var(--accent);color:var(--btntext)}\n.mem.new{animation:pop .6s}\n.memhost{border:2px solid var(--border);border-radius:12px;padding:10px;background:var(--inbg);min-height:120px}\n.memhost h4{margin:0 0 6px;color:var(--muted);font-size:.85rem}\n.plist{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}\n.pcol{border:2px solid var(--border);border-radius:10px;padding:6px;min-height:120px;background:var(--inbg)}\n.pcol h5{margin:0 0 6px;font-size:.78rem;text-align:center}\n.pcol h5 small{display:block;color:var(--muted);font-weight:400}\n.chip{display:inline-block;margin:2px;padding:3px 8px;border-radius:6px;color:#fff;font-size:.75rem;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.7);animation:pop .4s}\n.rbar{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--border);margin:6px 0}\n.rbar div{display:grid;place-items:center;font-size:.72rem;color:#fff;font-weight:700;text-shadow:0 1px 2px #000;overflow:hidden;white-space:nowrap;border-right:1px solid rgba(255,255,255,.4);cursor:pointer;transition:.3s}\n.rbar div.free{background:repeating-linear-gradient(45deg,rgba(128,128,128,.25) 0 6px,rgba(128,128,128,.08) 6px 12px);color:var(--muted);text-shadow:none;cursor:default}\n.rbar.over{border-color:var(--bad);box-shadow:0 0 14px var(--bad)}\n.bitsg{font-family:Consolas,monospace;font-size:1rem;margin:8px 0;word-break:break-all}\n.bitsg span{padding:2px 5px;border-radius:5px;margin-right:3px;color:#fff;text-shadow:0 1px 2px #000}\ncanvas.ch{width:100%;height:280px;background:var(--inbg);border-radius:10px}\nselect.sm{padding:4px 8px}\n<\/style>\n<\/head>\n<body data-theme=\"galaxy\">\n<canvas id=\"bg\"><\/canvas>\n<div id=\"prog\"><\/div>\n<header class=\"top\"><div class=\"brand\">\ud83d\udda5\ufe0f Modern OS Lab<\/div><div id=\"themes\" class=\"themes\"><\/div><\/header>\n<nav class=\"nav\" id=\"nav\"><\/nav>\n<main>\n\n<div class=\"hero\">\n  <h1>Modern Operating Systems<\/h1>\n  <p>Virtual Machines &amp; Hypervisors \u00b7 GPU \u00b7 CUDA Programming \u00b7 Windows 10 Virtual Memory Case Study. Visual notes with live simulations. Switch themes from the top bar anytime.<\/p>\n  <div class=\"road\">\n    <a href=\"#vm\">Virtual Machines<\/a><i>\u279c<\/i><a href=\"#hyp\">Hypervisor<\/a><i>\u279c<\/i><a href=\"#gpu\">GPU<\/a><i>\u279c<\/i><a href=\"#cuda\">CUDA<\/a><i>\u279c<\/i><a href=\"#win\">Windows 10 Paging<\/a><i>\u279c<\/i><a href=\"#exam\">Practice<\/a>\n  <\/div>\n<\/div>\n\n<\!-- 01 VM -->\n<section id=\"vm\" class=\"sec reveal\" data-nav=\"Virtual Machines\">\n<h2><span class=\"num\">01<\/span> Virtual Machines<\/h2>\n<div class=\"grid2\">\n <div class=\"card notes\"><h3>\ud83d\udcdd Notes<\/h3><ul>\n  <li><b>Virtual machine (VM):<\/b> a software copy of a complete computer (virtual CPU, RAM, disk, network card). A <b>guest OS<\/b> runs inside it and believes it owns real hardware.<\/li>\n  <li><b>Hypervisor / VMM (Virtual Machine Monitor):<\/b> the software layer that creates VMs, shares real hardware between them and keeps them isolated.<\/li>\n  <li><b>Host<\/b> = the real machine (and its OS, if any). <b>Guest<\/b> = the OS inside a VM.<\/li>\n  <li><b>Popek\u2013Goldberg requirements:<\/b> <b>equivalence<\/b> (guest behaves as on real hardware), <b>resource control<\/b> (VMM stays in charge of hardware), <b>efficiency<\/b> (most guest instructions run directly on the CPU).<\/li>\n  <li><b>Why use VMs:<\/b> server consolidation, isolation and security, run different OSes on one PC, snapshots and rollback, <b>live migration<\/b>, easy testing, the base of cloud computing (IaaS).<\/li>\n  <li><b>Costs:<\/b> some overhead (traps, double address translation), shared resource contention, the hypervisor is a high-value attack target.<\/li>\n  <li><b>VM vs container:<\/b> a VM carries its own full OS kernel (heavy, strong isolation). A container shares the host kernel (light, starts in seconds).<\/li>\n <\/ul><\/div>\n <div class=\"card\"><h3>\ud83e\uddf1 Architecture: Type 1 vs Type 2<\/h3>\n  <div class=\"tabs ctrl\"><button class=\"btn pri\" id=\"hvB1\" onclick=\"hvSet(1)\">Type 1 \u00b7 Bare-metal<\/button><button class=\"btn\" id=\"hvB2\" onclick=\"hvSet(2)\">Type 2 \u00b7 Hosted<\/button><\/div>\n  <div id=\"hvStack\"><\/div>\n  <div class=\"callout\" id=\"hvInfo\"><\/div>\n <\/div>\n<\/div>\n<div class=\"card\"><h3>\u2696\ufe0f Type 1 vs Type 2 at a glance<\/h3><div class=\"scroll\"><table>\n <tr><th><\/th><th>Type 1 (bare-metal)<\/th><th>Type 2 (hosted)<\/th><\/tr>\n <tr><td>Runs on<\/td><td>Directly on hardware<\/td><td>On top of a host OS as an application<\/td><\/tr>\n <tr><td>Performance<\/td><td class=\"ok\">Higher, less overhead<\/td><td class=\"no\">Lower (extra OS layer)<\/td><\/tr>\n <tr><td>Typical use<\/td><td>Data centers, cloud<\/td><td>Desktops, developers, learning<\/td><\/tr>\n <tr><td>Examples<\/td><td>VMware ESXi, Xen, Microsoft Hyper-V, KVM*<\/td><td>Oracle VirtualBox, VMware Workstation, Parallels<\/td><\/tr>\n <tr><td>Setup<\/td><td>Needs dedicated machine<\/td><td>Install like any program<\/td><\/tr><\/table><\/div>\n <div class=\"callout\">*KVM turns the Linux kernel itself into a hypervisor, so it is usually counted as Type 1 (the line between types is blurry). Windows 10 also uses Hyper-V underneath features like WSL 2, Windows Sandbox and virtualization-based security.<\/div>\n<\/div>\n<\/section>\n\n<\!-- 02 HYPERVISOR -->\n<section id=\"hyp\" class=\"sec reveal\" data-nav=\"Hypervisor\">\n<h2><span class=\"num\">02<\/span> Hypervisor: How It Works<\/h2>\n<div class=\"grid2\">\n <div class=\"card notes\"><h3>\ud83d\udcdd Notes<\/h3><ul>\n  <li><b>CPU virtualization:<\/b> the guest kernel is <b>de-privileged<\/b>. Normal instructions run directly at native speed. <b>Privileged / sensitive<\/b> instructions <b>trap<\/b> to the hypervisor, which <b>emulates<\/b> them on the VM's virtual CPU state, then resumes the guest. This is <b>trap-and-emulate<\/b>.<\/li>\n  <li>Classic x86 had sensitive instructions that did <i>not<\/i> trap, so three solutions appeared:\n   <br>\u2460 <b>Full virtualization with binary translation<\/b> (rewrite risky code on the fly, unmodified guest).\n   <br>\u2461 <b>Para-virtualization<\/b> (guest is modified and calls the hypervisor via <b>hypercalls<\/b>, e.g. Xen).\n   <br>\u2462 <b>Hardware-assisted<\/b> (Intel <b>VT-x<\/b>, AMD <b>AMD-V<\/b>): CPU has a special guest mode; a <b>VM exit<\/b> switches to the hypervisor, a <b>VM entry<\/b> resumes the guest.<\/li>\n  <li><b>Memory virtualization:<\/b> three address levels: guest-virtual \u2192 guest-physical \u2192 host-physical. Done by <b>shadow page tables<\/b> (software) or <b>nested paging<\/b> (Intel <b>EPT<\/b>, AMD <b>NPT/RVI<\/b>, in hardware).<\/li>\n  <li><b>Memory over-commit tricks:<\/b> <b>ballooning<\/b> (a driver in the guest grabs unused pages so the host can reuse them), <b>page sharing<\/b> (identical pages stored once, KSM), <b>host swapping<\/b> (last resort, slow).<\/li>\n  <li><b>I/O virtualization:<\/b> emulated devices (slow, compatible), <b>paravirtual drivers<\/b> like virtio (fast), <b>passthrough<\/b> with IOMMU / SR-IOV (near native, even a whole GPU).<\/li>\n  <li><b>vCPU scheduling:<\/b> the hypervisor time-slices virtual CPUs over physical cores (CPU over-commit is normal and usually safe).<\/li>\n <\/ul><\/div>\n <div class=\"card\"><h3>\ud83d\udd2c Trap-and-emulate simulator<\/h3>\n  <div class=\"ctrl\"><button class=\"btn pri\" onclick=\"trStep()\">\u23ed Next instruction<\/button><button class=\"btn\" onclick=\"trAuto()\">\u25b6 Auto<\/button><button class=\"btn\" onclick=\"trReset()\">\u21ba Reset<\/button><\/div>\n  <div id=\"trList\"><\/div>\n  <div class=\"flow\"><div class=\"node\" id=\"trG\">Guest OS<small>de-privileged<\/small><\/div><span class=\"arrow\">\u21c4<\/span><div class=\"node\" id=\"trH\">Hypervisor<small>emulates<\/small><\/div><span class=\"arrow\">\u21c4<\/span><div class=\"node\" id=\"trCpu\">Real CPU<small>native speed<\/small><\/div><\/div>\n  <div class=\"stat\"><div>Direct<b id=\"trD\">0<\/b><\/div><div>Traps (VM exits)<b id=\"trT\">0<\/b><\/div><div>Cycles used<b id=\"trC\">0<\/b><\/div><\/div>\n  <div class=\"big\" id=\"trMsg\">Assume: a normal instruction = 1 cycle, a trap round trip \u2248 1500 cycles.<\/div>\n <\/div>\n<\/div>\n<div class=\"grid2\">\n <div class=\"card\"><h3>\ud83e\uddea VM resource allocator (host: 32 GB RAM, 8 cores)<\/h3>\n  <div class=\"ctrl\"><button class=\"btn\" onclick=\"raAdd(4,1)\">+ VM 4 GB / 1 vCPU<\/button><button class=\"btn\" onclick=\"raAdd(8,2)\">+ VM 8 GB / 2 vCPU<\/button><button class=\"btn\" onclick=\"raAdd(16,4)\">+ VM 16 GB / 4 vCPU<\/button><button class=\"btn\" onclick=\"RA.vms=[];raN=0;raRender()\">Clear<\/button><\/div>\n  <b style=\"font-size:.85rem\">RAM<\/b><div class=\"rbar\" id=\"raRam\"><\/div>\n  <b style=\"font-size:.85rem\">vCPUs on 8 physical cores<\/b><div class=\"rbar\" id=\"raCpu\"><\/div>\n  <div class=\"big\" id=\"raMsg\"><\/div>\n  <div style=\"font-size:.8rem;color:var(--muted)\">Click a VM block to remove it.<\/div>\n <\/div>\n <div class=\"card\"><h3>\ud83d\udd2c Nested paging: guest-virtual \u2192 guest-physical \u2192 host-physical<\/h3>\n  <div class=\"ctrl\"><label>Guest virtual address (0\u201316383)<\/label><input id=\"ntA\" type=\"number\" value=\"9000\" style=\"width:90px\"><button class=\"btn pri\" onclick=\"ntGo()\">\u25b6 Translate<\/button><\/div>\n  <div class=\"flow\"><div class=\"node\" id=\"nt1\">GVA<small id=\"nt1t\">page | offset<\/small><\/div><span class=\"arrow\">\u279c<\/span><div class=\"node\" id=\"nt2\">Guest page table<small id=\"nt2t\">\u2192 GPA page<\/small><\/div><span class=\"arrow\">\u279c<\/span><div class=\"node\" id=\"nt3\">EPT / NPT<small id=\"nt3t\">\u2192 host frame<\/small><\/div><span class=\"arrow\">\u279c<\/span><div class=\"node\" id=\"nt4\">Host physical<small id=\"nt4t\">HPA<\/small><\/div><\/div>\n  <div class=\"grid2\"><div><b style=\"font-size:.85rem\">Guest page table (VM's OS)<\/b><table id=\"ntG\"><\/table><\/div><div><b style=\"font-size:.85rem\">EPT (hypervisor)<\/b><table id=\"ntE\"><\/table><\/div><\/div>\n  <div class=\"big\" id=\"ntOut\">Page size 4 KB. Press Translate.<\/div>\n  <div class=\"callout\">With 4-level tables on both sides, a TLB miss can need up to <b>(4+1)\u00d7(4+1)\u22121 = 24<\/b> memory references. That is why TLBs and large pages matter in VMs.<\/div>\n <\/div>\n<\/div>\n<\/section>\n\n<\!-- 03 GPU -->\n<section id=\"gpu\" class=\"sec reveal\" data-nav=\"GPU\">\n<h2><span class=\"num\">03<\/span> Introduction to GPU<\/h2>\n<div class=\"grid2\">\n <div class=\"card notes\"><h3>\ud83d\udcdd Notes<\/h3><ul>\n  <li><b>GPU (Graphics Processing Unit):<\/b> a processor built for <b>massive data parallelism<\/b>: thousands of simple cores doing the same operation on many data items. Originally for graphics, now also for AI, simulation, video, crypto (<b>GPGPU<\/b>).<\/li>\n  <li><b>CPU = latency-optimized:<\/b> few (4\u201364) powerful cores, big caches, branch prediction, great for serial and branchy code, OS tasks.<\/li>\n  <li><b>GPU = throughput-optimized:<\/b> thousands of small cores, small caches, hides memory delay by switching between many threads, high memory bandwidth (GDDR/HBM).<\/li>\n  <li><b>SIMT<\/b> (Single Instruction, Multiple Threads): threads run in lock-step groups. NVIDIA: a group of <b>32 threads = 1 warp<\/b>. Related to Flynn's <b>SIMD<\/b>.<\/li>\n  <li><b>Hardware hierarchy (NVIDIA):<\/b> GPU \u2192 many <b>Streaming Multiprocessors (SMs)<\/b> \u2192 each SM has CUDA cores, warp schedulers, registers, <b>shared memory<\/b>.<\/li>\n  <li><b>Memory hierarchy:<\/b> registers (per thread, fastest) \u2192 shared memory (per block, on-chip) \u2192 L2 cache \u2192 <b>global memory<\/b> (big, slow, off-chip).<\/li>\n  <li><b>Warp divergence:<\/b> if threads of a warp take different branches, both paths run one after another with idle lanes masked, so time adds up.<\/li>\n  <li><b>Good for:<\/b> matrix math, image processing, neural networks, simulations. <b>Bad for:<\/b> serial dependent logic, tiny data (copy over PCIe costs more than it saves).<\/li>\n  <li><b>OS role:<\/b> GPU driver, a GPU scheduler (Windows <b>WDDM<\/b>), GPU virtual memory and context switching between apps. Other vendors: AMD (ROCm/HIP), Intel (oneAPI); <b>OpenCL<\/b> is vendor-neutral.<\/li>\n <\/ul><\/div>\n <div class=\"card\"><h3>\ud83c\udfd7\ufe0f CPU vs GPU silicon (idea)<\/h3>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n   <div><b style=\"color:var(--accent2)\">CPU<\/b><div style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:6px 0\"><div class=\"layer\" style=\"background:#2563eb;margin:0;padding:22px 4px\">Core<\/div><div class=\"layer\" style=\"background:#2563eb;margin:0;padding:22px 4px\">Core<\/div><div class=\"layer\" style=\"background:#2563eb;margin:0;padding:22px 4px\">Core<\/div><div class=\"layer\" style=\"background:#2563eb;margin:0;padding:22px 4px\">Core<\/div><\/div><div class=\"layer\" style=\"background:#d97706\">Large cache + control logic<\/div><\/div>\n   <div><b style=\"color:var(--accent2)\">GPU<\/b><div class=\"cells\" style=\"grid-template-columns:repeat(12,1fr);margin:6px 0\" id=\"gpuDie\"><\/div><div class=\"layer\" style=\"background:#0ea5a4\">Small cache \u00b7 high-bandwidth memory<\/div><\/div>\n  <\/div>\n  <table style=\"margin-top:8px\"><tr><th><\/th><th>CPU<\/th><th>GPU<\/th><\/tr><tr><td>Cores<\/td><td>few, fast<\/td><td>thousands, simple<\/td><\/tr><tr><td>Goal<\/td><td>low latency<\/td><td>high throughput<\/td><\/tr><tr><td>Best at<\/td><td>serial / branchy<\/td><td>data-parallel<\/td><\/tr><\/table>\n <\/div>\n<\/div>\n<div class=\"grid2\">\n <div class=\"card\"><h3>\ud83c\udfc1 CPU vs GPU race<\/h3>\n  <div class=\"ctrl\"><label>Work<\/label><select id=\"grMode\"><option value=\"par\">Independent elements (C[i]=A[i]+B[i])<\/option><option value=\"ser\">Dependent chain (each step needs the previous)<\/option><\/select><label>Elements<\/label><select id=\"grN\"><option>256<\/option><option selected>512<\/option><option>1024<\/option><\/select><button class=\"btn pri\" onclick=\"grRun()\">\u25b6 Start race<\/button><\/div>\n  <div style=\"font-size:.8rem;color:var(--muted)\">CPU: 4 cores, each does 2 elements per tick. GPU: 128 lanes, each does 1 element per tick.<\/div>\n  <b>\ud83e\udde0 CPU<\/b> <span id=\"grCt\"><\/span><div class=\"cells\" id=\"grCpu\"><\/div>\n  <b>\ud83c\udfae GPU<\/b> <span id=\"grGt\"><\/span><div class=\"cells\" id=\"grGpu\"><\/div>\n  <div class=\"big\" id=\"grMsg\">Try both modes. Parallel work favours the GPU; serial work favours the CPU.<\/div>\n <\/div>\n <div class=\"card\"><h3>\ud83d\udd00 Warp divergence (32 threads)<\/h3>\n  <div class=\"ctrl\"><label>if (condition)<\/label><select id=\"wpPat\"><option value=\"none\">all threads true (no divergence)<\/option><option value=\"half\">threadIdx &lt; 16<\/option><option value=\"even\">threadIdx % 2 == 0<\/option><\/select><button class=\"btn pri\" onclick=\"wpRun()\">\u25b6 Run warp<\/button><\/div>\n  <div id=\"wpLanes\"><\/div>\n  <div class=\"big\" id=\"wpMsg\">if (cond) { A } else { B } : press Run.<\/div>\n <\/div>\n<\/div>\n<\/section>\n\n<\!-- 04 CUDA -->\n<section id=\"cuda\" class=\"sec reveal\" data-nav=\"CUDA\">\n<h2><span class=\"num\">04<\/span> Introduction to CUDA Programming<\/h2>\n<div class=\"grid2\">\n <div class=\"card notes\"><h3>\ud83d\udcdd Notes<\/h3><ul>\n  <li><b>CUDA<\/b> (Compute Unified Device Architecture): NVIDIA's platform and extension of C/C++ to run general code on GPUs. Compile with <code>nvcc<\/code>.<\/li>\n  <li><b>Heterogeneous model:<\/b> <b>host<\/b> = CPU + RAM, <b>device<\/b> = GPU + its memory. Host controls everything and launches <b>kernels<\/b>.<\/li>\n  <li><b>Function qualifiers:<\/b> <code>__global__<\/code> (runs on device, called from host = kernel, returns void), <code>__device__<\/code> (device only), <code>__host__<\/code> (CPU).<\/li>\n  <li><b>Thread hierarchy:<\/b> <b>grid<\/b> of <b>blocks<\/b>, each block has <b>threads<\/b>. Launch: <code>kernel&lt;&lt;&lt;numBlocks, threadsPerBlock&gt;&gt;&gt;(args)<\/code>.<\/li>\n  <li><b>Built-in variables:<\/b> <code>threadIdx<\/code>, <code>blockIdx<\/code>, <code>blockDim<\/code>, <code>gridDim<\/code> (each has .x .y .z).<\/li>\n  <li><b>Global index (1-D):<\/b> <code>i = blockIdx.x * blockDim.x + threadIdx.x<\/code>. Always guard with <code>if (i &lt; N)<\/code>.<\/li>\n  <li><b>Blocks needed:<\/b> <code>(N + threads \u2212 1) / threads<\/code> (ceiling division). Use a block size that is a multiple of 32 (128\u2013512 is typical).<\/li>\n  <li><b>Memory API:<\/b> <code>cudaMalloc<\/code>, <code>cudaMemcpy<\/code> (HostToDevice / DeviceToHost), <code>cudaFree<\/code>. <code>cudaMallocManaged<\/code> gives <b>unified memory<\/b> (the driver pages data between CPU and GPU on demand, like demand paging).<\/li>\n  <li><b>Sync:<\/b> kernel launch is asynchronous. <code>cudaDeviceSynchronize()<\/code> waits. Inside a block <code>__syncthreads()<\/code> is a barrier (used with <b>shared memory<\/b>).<\/li>\n  <li><b>Blocks are independent<\/b> and scheduled onto SMs in any order; threads of a block share one SM and shared memory.<\/li>\n  <li><b>Performance tips:<\/b> reduce host\u2194device copies (PCIe is slow), use <b>coalesced<\/b> memory access, use shared memory for reuse, avoid divergence, check errors with <code>cudaGetLastError()<\/code>.<\/li>\n <\/ul><\/div>\n <div class=\"card\"><h3>\ud83d\udd2c Thread indexing visualizer (vector add)<\/h3>\n  <div class=\"ctrl\"><label>N<\/label><input id=\"ciN\" type=\"number\" value=\"50\" min=\"1\" max=\"400\" style=\"width:70px\"><label>threads/block<\/label><select id=\"ciT\"><option>8<\/option><option selected>16<\/option><option>32<\/option><\/select><label>blocks<\/label><input id=\"ciB\" type=\"number\" value=\"4\" min=\"1\" max=\"16\" style=\"width:60px\"><button class=\"btn\" onclick=\"ciAuto()\">Auto blocks<\/button><\/div>\n  <div class=\"ctrl\"><button class=\"btn pri\" onclick=\"ciRun()\">\u25b6 Launch kernel<\/button><span style=\"font-size:.8rem;color:var(--muted)\">2 SMs run 2 blocks at a time. Click any thread to see its index maths.<\/span><\/div>\n  <div id=\"ciGrid\" style=\"max-height:340px;overflow:auto\"><\/div>\n  <div class=\"big\" id=\"ciMsg\"><\/div>\n <\/div>\n<\/div>\n<div class=\"card\"><h3>\ud83c\udfac CUDA program flow: step by step<\/h3>\n <div class=\"ctrl\"><button class=\"btn pri\" onclick=\"cwNext()\">\u23ed Next step<\/button><button class=\"btn\" onclick=\"cwAuto()\">\u25b6 Auto<\/button><button class=\"btn\" onclick=\"cwReset()\">\u21ba Reset<\/button><\/div>\n <div class=\"grid2\">\n  <div><pre class=\"code\" id=\"cwCode\"><\/pre><\/div>\n  <div>\n   <div class=\"memhost\"><h4>HOST (CPU RAM)<\/h4><div id=\"cwHost\"><\/div><\/div>\n   <div style=\"text-align:center;font-size:1.4rem;color:var(--accent2)\" id=\"cwArrow\">\u21c5 PCIe<\/div>\n   <div class=\"memhost\"><h4>DEVICE (GPU global memory)<\/h4><div id=\"cwDev\"><\/div><\/div>\n  <\/div>\n <\/div>\n <div class=\"big\" id=\"cwMsg\">Press Next step.<\/div>\n<\/div>\n<div class=\"card\"><h3>\ud83e\uddee Launch-configuration calculator<\/h3>\n <div class=\"ctrl\"><label>N elements<\/label><input id=\"lcN\" type=\"number\" value=\"1000000\" style=\"width:120px\"><label>threads/block<\/label><input id=\"lcT\" type=\"number\" value=\"256\" style=\"width:80px\"><\/div>\n <div class=\"stat\"><div>Blocks<b id=\"lcB\">\u2013<\/b><\/div><div>Total threads<b id=\"lcTot\">\u2013<\/b><\/div><div>Extra (idle) threads<b id=\"lcX\">\u2013<\/b><\/div><div>Warps per block<b id=\"lcW\">\u2013<\/b><\/div><\/div>\n <div class=\"callout\">Extra threads exist because blocks come in whole units. The <code>if (i &lt; N)<\/code> check stops them from writing outside the array.<\/div>\n<\/div>\n<\/section>\n\n<\!-- 05 WINDOWS -->\n<section id=\"win\" class=\"sec reveal\" data-nav=\"Windows 10 Case Study\">\n<h2><span class=\"num\">05<\/span> Case Study: Virtual Memory in Windows 10 &amp; Paging Performance<\/h2>\n<div class=\"grid2\">\n <div class=\"card notes\"><h3>\ud83d\udcdd Design of the Windows memory manager<\/h3><ul>\n  <li><b>Demand-paged virtual memory<\/b> using <b>4 KB pages<\/b> (small) and optional <b>2 MB large pages<\/b> (fewer TLB misses; used by databases and VMs).<\/li>\n  <li><b>Address space:<\/b> each process gets a private virtual address space. On 64-bit Windows 10 x64 uses <b>48-bit addresses<\/b>, giving <b>128 TB for user mode<\/b> and 128 TB for the kernel. A 32-bit process sees 2 GB (4 GB if large-address-aware on 64-bit Windows).<\/li>\n  <li><b>4-level page tables on x64:<\/b> PML4 \u2192 PDPT \u2192 PD \u2192 PT, 9 bits each, + 12-bit offset = 48 bits. The <b>CR3<\/b> register points to the PML4 of the current process.<\/li>\n  <li><b>Reserve vs commit<\/b> (<code>VirtualAlloc<\/code>): <b>reserve<\/b> = claim address range only, <b>commit<\/b> = guarantee backing storage (RAM or pagefile). Pages are really brought into RAM only when first touched (demand paging).<\/li>\n  <li><b>Commit limit<\/b> = physical RAM + size of paging file(s). <b>Commit charge<\/b> = total committed memory. If charge reaches the limit, allocations fail.<\/li>\n  <li><b>Paging file:<\/b> <code>pagefile.sys<\/code> (backing store for private pages). Also <code>swapfile.sys<\/code> (modern apps) and <code>hiberfil.sys<\/code>. Normally <b>system-managed<\/b>.<\/li>\n  <li><b>Working set:<\/b> the pages of a process currently in RAM. When RAM is low the memory manager <b>trims<\/b> working sets (replacement is per-process, \"local\", with an aging / FIFO-like policy).<\/li>\n  <li><b>Page frame database (PFN)<\/b> tracks every physical page. Pages not in any working set sit on lists: <b>Standby<\/b> (clean, still holds data), <b>Modified<\/b> (dirty, must be written first), <b>Free<\/b>, <b>Zeroed<\/b> (ready for demand-zero requests), plus Bad.<\/li>\n  <li><b>Soft (minor) fault:<\/b> page is still in RAM (standby / modified list, or a demand-zero page): fixed in microseconds, no disk. <b>Hard (major) fault:<\/b> data must be read from disk: milliseconds.<\/li>\n  <li><b>Clustering:<\/b> on a hard fault Windows reads the faulting page plus some neighbouring pages in one I/O.<\/li>\n  <li><b>Windows 10 extras:<\/b> <b>memory compression<\/b> (rarely used pages are compressed inside RAM instead of written to disk, shown as \"Compressed\" in Task Manager), <b>SysMain (Superfetch)<\/b> preloads frequently used apps into the standby list, <b>ASLR<\/b>, <b>copy-on-write<\/b> and <b>shared DLL pages<\/b> (one physical copy mapped into many processes), <b>memory-mapped files<\/b> (section objects).<\/li>\n <\/ul><\/div>\n <div class=\"card\"><h3>\ud83d\udd2c x64 four-level address translation<\/h3>\n  <div class=\"ctrl\"><label>Virtual address (hex, 48-bit)<\/label><input id=\"pwA\" value=\"00007FF612345678\" style=\"width:170px\"><label><input type=\"checkbox\" id=\"pwLarge\"> 2 MB large page<\/label><button class=\"btn pri\" onclick=\"pwGo()\">\u25b6 Translate<\/button><\/div>\n  <div class=\"bitsg\" id=\"pwBits\"><\/div>\n  <div class=\"flow\"><div class=\"node\" id=\"pw0\">CR3<small>PML4 base<\/small><\/div><span class=\"arrow\">\u279c<\/span><div class=\"node\" id=\"pw1\">PML4<small id=\"pw1t\">idx<\/small><\/div><span class=\"arrow\">\u279c<\/span><div class=\"node\" id=\"pw2\">PDPT<small id=\"pw2t\">idx<\/small><\/div><span class=\"arrow\">\u279c<\/span><div class=\"node\" id=\"pw3\">PD<small id=\"pw3t\">idx<\/small><\/div><span class=\"arrow\">\u279c<\/span><div class=\"node\" id=\"pw4\">PT<small id=\"pw4t\">idx<\/small><\/div><span class=\"arrow\">\u279c<\/span><div class=\"node\" id=\"pw5\">RAM<small id=\"pw5t\">frame + offset<\/small><\/div><\/div>\n  <div class=\"big\" id=\"pwOut\">Frame numbers in this demo are made up. The index maths is real.<\/div>\n  <div class=\"callout\">A TLB miss walks 4 tables = 4 extra memory reads. The TLB caches finished translations so most accesses skip the walk.<\/div>\n <\/div>\n<\/div>\n\n<div class=\"card\"><h3>\u267b\ufe0f Page lifecycle: working set \u2192 standby / modified \u2192 free \u2192 zeroed<\/h3>\n <div class=\"ctrl\"><button class=\"btn pri\" onclick=\"plAlloc(false)\">New page (demand-zero)<\/button><button class=\"btn\" onclick=\"plAlloc(true)\">Page from disk (HARD fault)<\/button><button class=\"btn\" onclick=\"plTrim()\">\u2702\ufe0f Trim working set<\/button><button class=\"btn\" onclick=\"plSoft()\">Touch trimmed page (SOFT fault)<\/button><button class=\"btn\" onclick=\"plWrite()\">\ud83d\udcbe Modified-page writer<\/button><button class=\"btn\" onclick=\"plZero()\">0\ufe0f\u20e3 Zero-page thread<\/button><button class=\"btn\" onclick=\"plInit()\">\u21ba Reset<\/button><\/div>\n <div class=\"plist\" id=\"plList\"><\/div>\n <div class=\"stat\"><div>Soft faults<b id=\"plS\">0<\/b><\/div><div>Demand-zero<b id=\"plZ\">0<\/b><\/div><div>Hard faults (disk read)<b id=\"plH\">0<\/b><\/div><div>Disk writes<b id=\"plW\">0<\/b><\/div><\/div>\n <div class=\"log\" id=\"plLog\"><\/div>\n<\/div>\n\n<div class=\"grid2\">\n <div class=\"card\"><h3>\ud83d\udce6 Commit limit &amp; paging file<\/h3>\n  <div class=\"ctrl\"><label>RAM (GB)<\/label><input id=\"pcR\" type=\"number\" value=\"8\" style=\"width:70px\"><label>Paging file (GB)<\/label><input id=\"pcP\" type=\"number\" value=\"4\" style=\"width:70px\"><label>Committed (GB)<\/label><input id=\"pcC\" type=\"number\" value=\"10.5\" step=\"0.1\" style=\"width:80px\"><\/div>\n  <div class=\"rbar\" id=\"pcBar\"><\/div>\n  <div class=\"big\" id=\"pcOut\"><\/div>\n <\/div>\n <div class=\"card notes\"><h3>\ud83d\udee0\ufe0f Tools to observe paging<\/h3><ul>\n  <li><b>Task Manager \u2192 Performance \u2192 Memory:<\/b> In use, Committed, Cached, Compressed, Paged/Non-paged pool.<\/li>\n  <li><b>Resource Monitor \u2192 Memory:<\/b> Hard Faults/sec per process, Standby / Modified / Free bars.<\/li>\n  <li><b>Performance Monitor counters:<\/b> <code>Memory\\Pages/sec<\/code>, <code>Memory\\Page Faults/sec<\/code>, <code>Memory\\Available MBytes<\/code>, <code>Memory\\Committed Bytes<\/code>, <code>Paging File\\% Usage<\/code>.<\/li>\n  <li><b>Virtual memory settings:<\/b> System Properties \u2192 Advanced \u2192 Performance Settings \u2192 Advanced \u2192 Virtual memory \u2192 Change.<\/li>\n  <li>Page Faults/sec includes cheap soft faults. A sustained high <b>Pages/sec<\/b> together with a busy disk is the real warning sign (thresholds are rules of thumb, not laws).<\/li>\n <\/ul><\/div>\n<\/div>\n\n<div class=\"card\"><h3>\ud83d\udcc9 How paging impacts performance: memory-pressure simulator<\/h3>\n <div class=\"ctrl\"><label>RAM<\/label><select id=\"psRam\" class=\"sm\"><option>4<\/option><option selected>8<\/option><option>16<\/option><option>32<\/option><\/select><span>GB<\/span>\n  <label>Apps open<\/label><input id=\"psApps\" type=\"range\" min=\"1\" max=\"40\" value=\"14\"><b id=\"psAppsV\"><\/b>\n  <label>Working set / app<\/label><input id=\"psWs\" type=\"range\" min=\"2\" max=\"15\" value=\"5\"><b id=\"psWsV\"><\/b>\n  <label>Paging disk<\/label><select id=\"psDisk\" class=\"sm\"><option value=\"hdd\">HDD (8 ms)<\/option><option value=\"ssd\" selected>SATA SSD (0.1 ms)<\/option><option value=\"nvme\">NVMe SSD (0.03 ms)<\/option><\/select><\/div>\n <div class=\"stat\"><div>Memory demand<b id=\"psDem\">\u2013<\/b><\/div><div>Fault rate p<b id=\"psP\">\u2013<\/b><\/div><div>Slowdown<b id=\"psSl\">\u2013<\/b><\/div><div>Useful CPU work<b id=\"psCpu\">\u2013<\/b><\/div><\/div>\n <div class=\"big\" id=\"psMsg\"><\/div>\n <canvas id=\"psChart\" class=\"ch\"><\/canvas>\n <div class=\"callout\">Simplified model: OS uses 2 GB. When demand exceeds RAM, the excess fraction causes hard faults, and EAT = (1\u2212p)\u00d7100 ns + p\u00d7disk time. Real numbers vary, but the <b>shape<\/b> is real: flat, then a cliff (<b>thrashing<\/b>). The faster the paging disk, the later and softer the cliff.<\/div>\n<\/div>\n\n<div class=\"card notes\"><h3>\u2705 Paging impact: summary &amp; tuning<\/h3><ul>\n <li><b>Paging is what lets Windows run more than RAM can hold<\/b>, but every <b>hard fault<\/b> costs ~100,000\u00d7 a RAM access on HDD (~1,000\u00d7 on SSD).<\/li>\n <li><b>Symptoms of memory pressure:<\/b> disk light constantly on, apps freeze when switching, high Hard Faults/sec, Available MBytes near zero, high Committed %.<\/li>\n <li><b>Best fix:<\/b> add RAM (fewer hard faults). <b>Next:<\/b> SSD/NVMe for the paging file, close or limit startup apps, fix memory leaks (watch Committed grow).<\/li>\n <li><b>Do not disable the paging file:<\/b> programs reserve commit they never touch, crash dumps need it, and the memory manager works better with it.<\/li>\n <li><b>Memory compression and SysMain<\/b> reduce disk I/O: compress instead of write, and prefetch to turn would-be hard faults into soft ones.<\/li>\n<\/ul><\/div>\n<\/section>\n\n<\!-- 06 PRACTICE -->\n<section id=\"exam\" class=\"sec reveal\" data-nav=\"Practice\">\n<h2><span class=\"num\">06<\/span> Solved Questions (tap to reveal)<\/h2>\n<div class=\"card\">\n<details><summary>Q1. Differentiate Type 1 and Type 2 hypervisors.<\/summary><p><b>Type 1<\/b> runs directly on hardware (ESXi, Xen, Hyper-V): better performance, used in data centers. <b>Type 2<\/b> runs as an app on a host OS (VirtualBox, VMware Workstation): easier to install, extra overhead from the host OS.<\/p><\/details>\n<details><summary>Q2. Explain trap-and-emulate. Why was classic x86 hard to virtualize?<\/summary><p>Guest kernel runs de-privileged. When it executes a privileged instruction the CPU traps to the hypervisor, which emulates the effect on the virtual CPU and resumes the guest. Classic x86 had <b>sensitive but non-privileged<\/b> instructions that did not trap, so the hypervisor never saw them. Fixes: binary translation, para-virtualization, or hardware support (VT-x / AMD-V).<\/p><\/details>\n<details><summary>Q3. Host 32 GB RAM, three VMs of 16 GB each. Over-commit ratio? What does the hypervisor do?<\/summary><p>48 / 32 = <b>1.5\u00d7<\/b>. It uses ballooning, page sharing and, last, host swapping (slow). Memory over-commit is riskier than CPU over-commit because swapping hurts badly.<\/p><\/details>\n<details><summary>Q4. Worst-case memory references on a TLB miss with 4-level guest and 4-level nested tables?<\/summary><p>(4+1) \u00d7 (4+1) \u2212 1 = <b>24<\/b> references.<\/p><\/details>\n<details><summary>Q5. N = 1,000,000 elements, 256 threads per block. Blocks? Idle threads?<\/summary><p>Blocks = \u23081,000,000 / 256\u2309 = \u23083906.25\u2309 = <b>3907<\/b>. Total threads = 3907 \u00d7 256 = 1,000,192. Idle = <b>192<\/b>, stopped by <code>if (i &lt; N)<\/code>.<\/p><\/details>\n<details><summary>Q6. blockIdx.x = 5, blockDim.x = 128, threadIdx.x = 17. Global index?<\/summary><p>i = 5 \u00d7 128 + 17 = <b>657<\/b>.<\/p><\/details>\n<details><summary>Q7. How many warps in a block of 100 threads? Of 256 threads?<\/summary><p>\u2308100/32\u2309 = <b>4 warps<\/b> (128 lanes, 28 idle). 256/32 = <b>8 warps<\/b>.<\/p><\/details>\n<details><summary>Q8. Give the paging indices of 48-bit virtual address 0x0000_0000_0040_1ABC (x64, 4 KB pages).<\/summary><p>Offset = 0xABC = <b>2748<\/b>. PT index = (0x401 &amp; 0x1FF) = <b>1<\/b>. PD index = 0x401 &gt;&gt; 9 = <b>2<\/b>. PDPT index = <b>0<\/b>, PML4 index = <b>0<\/b>.<\/p><\/details>\n<details><summary>Q9. RAM 8 GB, paging file 4 GB, committed 10.5 GB. Commit limit and usage?<\/summary><p>Limit = 8 + 4 = <b>12 GB<\/b>. Usage = 10.5 / 12 = <b>87.5%<\/b>. Close to the limit: allocations may soon fail.<\/p><\/details>\n<details><summary>Q10. ma = 100 ns. p = 10<sup>\u22124<\/sup>. Compute EAT on SSD (100 \u00b5s) and HDD (8 ms).<\/summary><p>SSD: 0.9999\u00d7100 + 10\u207b\u2074\u00d7100,000 = 99.99 + 10 = <b>109.99 ns<\/b> (\u22481.1\u00d7). HDD: 99.99 + 10\u207b\u2074\u00d78,000,000 = 99.99 + 800 = <b>899.99 ns<\/b> (\u22489\u00d7). Same fault rate, very different damage.<\/p><\/details>\n<details><summary>Q11. Soft fault vs hard fault in Windows?<\/summary><p><b>Soft:<\/b> page still in RAM (standby / modified list or demand-zero): fixed without disk I/O, microseconds. <b>Hard:<\/b> page must be read from disk (pagefile or file): milliseconds. Only hard faults hurt badly.<\/p><\/details>\n<\/div>\n<\/section>\n\n<\!-- 07 CHEAT -->\n<section id=\"cheat\" class=\"sec reveal\" data-nav=\"Cheat Sheet\">\n<h2><span class=\"num\">07<\/span> One-Page Cheat Sheet<\/h2>\n<div class=\"card scroll\"><table>\n<tr><th>Topic<\/th><th>Remember<\/th><\/tr>\n<tr><td>VM / hypervisor<\/td><td>Hypervisor shares hardware among guest OSes. Type 1 = bare-metal, Type 2 = hosted<\/td><\/tr>\n<tr><td>Trap-and-emulate<\/td><td>Privileged instr \u2192 VM exit \u2192 emulate \u2192 VM entry. Normal instr run natively<\/td><\/tr>\n<tr><td>CPU virtualization<\/td><td>Binary translation \u00b7 Para-virtualization (hypercalls) \u00b7 VT-x / AMD-V<\/td><\/tr>\n<tr><td>Memory virtualization<\/td><td>Shadow page tables or nested paging (EPT/NPT). Ballooning, page sharing, host swap<\/td><\/tr>\n<tr><td>GPU vs CPU<\/td><td>GPU = throughput, many simple cores, SIMT, warp = 32 threads. CPU = latency<\/td><\/tr>\n<tr><td>CUDA model<\/td><td>Grid \u2192 blocks \u2192 threads. <code>kernel&lt;&lt;&lt;blocks, threads&gt;&gt;&gt;<\/code><\/td><\/tr>\n<tr><td>Global index<\/td><td>i = blockIdx.x \u00d7 blockDim.x + threadIdx.x ; guard with if (i &lt; N)<\/td><\/tr>\n<tr><td>Blocks needed<\/td><td>(N + T \u2212 1) / T<\/td><\/tr>\n<tr><td>CUDA flow<\/td><td>cudaMalloc \u2192 cudaMemcpy H\u2192D \u2192 kernel \u2192 cudaMemcpy D\u2192H \u2192 cudaFree<\/td><\/tr>\n<tr><td>Windows x64 paging<\/td><td>48-bit VA = 9+9+9+9+12. 4 KB pages, 2 MB large pages. 128 TB user space<\/td><\/tr>\n<tr><td>Commit limit<\/td><td>RAM + pagefile. Reserve \u2260 commit<\/td><\/tr>\n<tr><td>Page lists<\/td><td>Standby (clean) \u00b7 Modified (dirty) \u00b7 Free \u00b7 Zeroed<\/td><\/tr>\n<tr><td>Faults<\/td><td>Soft = in RAM (\u00b5s). Hard = disk (ms). EAT = (1\u2212p)\u00b7ma + p\u00b7fault time<\/td><\/tr>\n<tr><td>Windows 10 extras<\/td><td>Memory compression, SysMain prefetch, ASLR, copy-on-write, shared DLL pages<\/td><\/tr>\n<\/table><\/div>\n<footer>Tip: finish every simulation once, then try to predict its result before pressing the button.<\/footer>\n<\/section>\n<\/main>\n\n<script>\n\nconst $=(s,r=document)=>r.querySelector(s);\nconst $$=(s,r=document)=>[...r.querySelectorAll(s)];\nconst sleep=ms=>new Promise(r=>setTimeout(r,ms));\nconst COLORS=['#7c5cff','#0ea5a4','#ef4444','#d97706','#2563eb','#db2777','#65a30d','#9333ea'];\nconst clamp=(v,a,b)=>Math.max(a,Math.min(b,v));\n\n/* ================= THEMES + BACKGROUND ================= */\nconst THEMES=[['galaxy','\ud83c\udf0c Galaxy'],['blackhole','\ud83d\udd73\ufe0f Black Hole'],['supernova','\ud83d\udca5 Supernova'],['aurora','\ud83c\udf3f Aurora'],['cyber','\u26a1 Cyberpunk Neon'],['ocean','\ud83c\udf0a Deep Ocean'],['sunset','\ud83c\udf07 Sunset Retro'],['paper','\ud83d\udcc4 Light Paper']];\nconst cv=$('#bg'),cx=cv.getContext('2d');\nlet W=0,H=0,T=0,mode='galaxy',P=[],Q=[];\nfunction resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;initBg(mode);}\nfunction initBg(m){\n  mode=m;P=[];Q=[];const R=Math.random;\n  if(m==='galaxy'){for(let i=0;i<230;i++)P.push({x:R()*W,y:R()*H,r:R()*1.6+.3,ph:R()*6.28,sp:.6+R()*2.2});}\n  if(m==='blackhole'){for(let i=0;i<650;i++){const r=95+R()*280;P.push({a:R()*6.28,r,w:.9/Math.pow(r/100,1.5),s:.6+R()*1.8,h:18+R()*34});}for(let i=0;i<80;i++)Q.push({x:R()*W,y:R()*H,r:R()*1.2+.2,ph:R()*6});}\n  if(m==='supernova'){Q=[{r:0}];}\n  if(m==='aurora'){for(let i=0;i<120;i++)Q.push({x:R()*W,y:R()*H*.7,r:R()*1.3+.2,ph:R()*6,sp:1+R()*2});}\n  if(m==='ocean'){for(let i=0;i<70;i++)P.push({x:R()*W,y:R()*H,r:2+R()*11,vy:.3+R()*1.1,ph:R()*6.28});for(let i=0;i<70;i++)Q.push({x:R()*W,y:R()*H,r:1+R()*2.5,ph:R()*6.28,vx:(R()-.5)*.3,vy:(R()-.5)*.3,g:R()>.5});}\n  if(m==='sunset'){for(let i=0;i<7;i++)P.push({x:R()*W,y:H*(.15+R()*.4),w:140+R()*220,s:.15+R()*.4});for(let i=0;i<90;i++)Q.push({x:R()*W,y:R()*H*.45,r:R()*1.3+.2,ph:R()*6});}\n  if(m==='paper'){for(let i=0;i<34;i++)P.push({x:R()*W,y:R()*H,r:20+R()*70,vx:(R()-.5)*.25,vy:(R()-.5)*.25,c:R()>.5?'79,70,229':'13,148,136'});}\n}\nfunction frame(){\n  T+=.016;cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,W,H);cx.globalCompositeOperation='source-over';cx.globalAlpha=1;\n  const R=Math.random;\n  if(mode==='galaxy'){\n    for(const s of P){const a=.35+.65*Math.abs(Math.sin(T*s.sp+s.ph));cx.fillStyle=`rgba(255,255,255,${a})`;cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.3);cx.fill();}\n    if(R()<.012)Q.push({x:R()*W,y:R()*H*.5,vx:6+R()*5,vy:2+R()*3,l:1});\n    for(let i=Q.length-1;i>=0;i--){const s=Q[i];s.x+=s.vx;s.y+=s.vy;s.l-=.02;cx.strokeStyle=`rgba(200,210,255,${s.l})`;cx.lineWidth=2;cx.beginPath();cx.moveTo(s.x,s.y);cx.lineTo(s.x-s.vx*5,s.y-s.vy*5);cx.stroke();if(s.l<=0)Q.splice(i,1);}\n  }\n  else if(mode==='blackhole'){\n    const x0=W*.5,y0=H*.45,k=Math.min(W,H)/800;\n    for(const s of Q){cx.fillStyle=`rgba(255,235,210,${.3+.4*Math.abs(Math.sin(T+s.ph))})`;cx.fillRect(s.x,s.y,s.r,s.r);}\n    const g=cx.createRadialGradient(x0,y0,40*k,x0,y0,380*k);g.addColorStop(0,'rgba(255,150,50,.35)');g.addColorStop(1,'rgba(255,150,50,0)');cx.fillStyle=g;cx.fillRect(0,0,W,H);\n    const draw=front=>{for(const p of P){p.a+=p.w*.016*2.2;const sn=Math.sin(p.a);if((sn>0)!==front)continue;const x=x0+Math.cos(p.a)*p.r*k*1.25,y=y0+sn*p.r*k*.3;cx.fillStyle=`hsla(${p.h},100%,${60+ (300-p.r)/8}%,${.55+.4*Math.cos(p.a)*0})`;cx.beginPath();cx.arc(x,y,p.s*k+.3,0,6.3);cx.fill();}};\n    cx.globalCompositeOperation='lighter';draw(false);cx.globalCompositeOperation='source-over';\n    const bg=cx.createRadialGradient(x0,y0,50*k,x0,y0,95*k);bg.addColorStop(0,'#000');bg.addColorStop(.85,'#000');bg.addColorStop(1,'rgba(255,200,120,.9)');\n    cx.fillStyle=bg;cx.beginPath();cx.arc(x0,y0,95*k,0,6.3);cx.fill();\n    cx.globalCompositeOperation='lighter';draw(true);cx.globalCompositeOperation='source-over';\n  }\n  else if(mode==='supernova'){\n    const x0=W*.5,y0=H*.45;\n    cx.globalCompositeOperation='lighter';\n    const g=cx.createRadialGradient(x0,y0,0,x0,y0,200+40*Math.sin(T*3));g.addColorStop(0,'rgba(255,240,150,.55)');g.addColorStop(.4,'rgba(255,100,30,.25)');g.addColorStop(1,'rgba(255,40,0,0)');cx.fillStyle=g;cx.fillRect(0,0,W,H);\n    for(let i=0;i<7;i++){const a=R()*6.28,v=1+R()*6;P.push({x:x0,y:y0,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,d:.006+R()*.014,h:R()*55,s:1+R()*3});}\n    for(let i=P.length-1;i>=0;i--){const p=P[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.995;p.vy*=.995;p.l-=p.d;if(p.l<=0||p.x<-50||p.x>W+50||p.y<-50||p.y>H+50){P.splice(i,1);continue;}cx.fillStyle=`hsla(${p.h},100%,55%,${p.l})`;cx.beginPath();cx.arc(p.x,p.y,p.s*p.l+.4,0,6.3);cx.fill();}\n    const rr=(T*160)%Math.max(W,H);cx.strokeStyle=`rgba(255,160,60,${1-rr/Math.max(W,H)})`;cx.lineWidth=3;cx.beginPath();cx.arc(x0,y0,rr,0,6.3);cx.stroke();\n  }\n  else if(mode==='aurora'){\n    for(const s of Q){cx.fillStyle=`rgba(255,255,255,${.3+.6*Math.abs(Math.sin(T*s.sp+s.ph))})`;cx.fillRect(s.x,s.y,s.r,s.r);}\n    cx.globalCompositeOperation='lighter';\n    for(let b=0;b<4;b++){const base=H*(.12+b*.07),hue=[150,170,190,130][b];const g=cx.createLinearGradient(0,0,0,260);g.addColorStop(0,`hsla(${hue},95%,60%,0)`);g.addColorStop(.35,`hsla(${hue},95%,60%,.5)`);g.addColorStop(1,`hsla(${hue},95%,60%,0)`);cx.fillStyle=g;\n      for(let x=0;x<W;x+=5){const y=base+Math.sin(x*.004+T*.5+b)*60+Math.sin(x*.011-T*.8+b*2)*25;cx.setTransform(1,0,0,1,0,y);cx.globalAlpha=.25+.4*Math.abs(Math.sin(x*.006+T*.7+b));cx.fillRect(x,0,5,260);}\n      cx.setTransform(1,0,0,1,0,0);}\n    cx.globalAlpha=1;\n  }\n  else if(mode==='cyber'){\n    const hz=H*.58;\n    const sg=cx.createLinearGradient(0,hz-220,0,hz);sg.addColorStop(0,'rgba(255,43,214,.9)');sg.addColorStop(1,'rgba(0,240,255,.7)');\n    cx.fillStyle=sg;cx.beginPath();cx.arc(W/2,hz,Math.min(W,H)*.2,Math.PI,0);cx.fill();\n    cx.globalCompositeOperation='destination-out';for(let i=0;i<7;i++){const y=hz-i*i*3-8-((T*10)%12);cx.fillRect(0,y,W,2+i*.9);}cx.globalCompositeOperation='source-over';\n    cx.lineWidth=1.6;cx.shadowBlur=10;cx.shadowColor='#ff2bd6';cx.strokeStyle='rgba(255,43,214,.8)';\n    for(let i=-24;i<=24;i++){cx.beginPath();cx.moveTo(W/2+i*8,hz);cx.lineTo(W/2+i*(W/9),H);cx.stroke();}\n    cx.shadowColor='#00f0ff';cx.strokeStyle='rgba(0,240,255,.75)';\n    for(let k=0;k<14;k++){const t=((k+T*.5)%14)/14,y=hz+(H-hz)*t*t;cx.beginPath();cx.moveTo(0,y);cx.lineTo(W,y);cx.stroke();}\n    cx.shadowBlur=0;cx.strokeStyle='rgba(0,240,255,.8)';cx.beginPath();cx.moveTo(0,hz);cx.lineTo(W,hz);cx.stroke();\n  }\n  else if(mode==='ocean'){\n    cx.globalCompositeOperation='lighter';\n    for(let i=0;i<5;i++){const x=W*(.1+i*.2)+Math.sin(T*.3+i)*60;const g=cx.createLinearGradient(x,0,x+120,H*.8);g.addColorStop(0,'rgba(120,220,255,.10)');g.addColorStop(1,'rgba(120,220,255,0)');cx.fillStyle=g;cx.beginPath();cx.moveTo(x,0);cx.lineTo(x+90,0);cx.lineTo(x+260,H*.8);cx.lineTo(x+60,H*.8);cx.fill();}\n    cx.globalCompositeOperation='source-over';\n    for(const q of Q){q.x+=q.vx;q.y+=q.vy;if(q.x<0)q.x=W;if(q.x>W)q.x=0;if(q.y<0)q.y=H;if(q.y>H)q.y=0;const a=.3+.7*Math.abs(Math.sin(T*1.5+q.ph));const g=cx.createRadialGradient(q.x,q.y,0,q.x,q.y,q.r*6);const c=q.g?'79,255,208':'37,208,255';g.addColorStop(0,`rgba(${c},${a})`);g.addColorStop(1,`rgba(${c},0)`);cx.fillStyle=g;cx.beginPath();cx.arc(q.x,q.y,q.r*6,0,6.3);cx.fill();}\n    for(const b of P){b.y-=b.vy;b.x+=Math.sin(T*1.4+b.ph)*.5;if(b.y<-20){b.y=H+20;b.x=Math.random()*W;}cx.strokeStyle='rgba(150,235,255,.55)';cx.fillStyle='rgba(37,208,255,.08)';cx.lineWidth=1.2;cx.beginPath();cx.arc(b.x,b.y,b.r,0,6.3);cx.fill();cx.stroke();cx.fillStyle='rgba(255,255,255,.6)';cx.beginPath();cx.arc(b.x-b.r*.35,b.y-b.r*.35,b.r*.18,0,6.3);cx.fill();}\n  }\n  else if(mode==='sunset'){\n    for(const s of Q){cx.fillStyle=`rgba(255,255,255,${.25+.5*Math.abs(Math.sin(T+s.ph))})`;cx.fillRect(s.x,s.y,s.r,s.r);}\n    const sx=W*.5,sy=H*.62,sr=Math.min(W,H)*.2*(1+.02*Math.sin(T));\n    const g=cx.createLinearGradient(0,sy-sr,0,sy+sr);g.addColorStop(0,'#ffe066');g.addColorStop(.5,'#ff8a4a');g.addColorStop(1,'#ff3d8b');\n    const gl=cx.createRadialGradient(sx,sy,sr*.8,sx,sy,sr*2.2);gl.addColorStop(0,'rgba(255,150,80,.35)');gl.addColorStop(1,'rgba(255,150,80,0)');cx.fillStyle=gl;cx.fillRect(0,0,W,H);\n    cx.fillStyle=g;cx.beginPath();cx.arc(sx,sy,sr,0,6.3);cx.fill();\n    cx.globalCompositeOperation='destination-out';for(let i=0;i<8;i++){const y=sy+sr*.05+i*sr*.14+((T*8)%(sr*.14));cx.fillRect(sx-sr,y,sr*2,2+i*1.6);}cx.globalCompositeOperation='source-over';\n    for(const c of P){c.x+=c.s;if(c.x>W+c.w)c.x=-c.w;cx.fillStyle='rgba(255,190,220,.2)';cx.beginPath();cx.ellipse(c.x,c.y,c.w/2,16,0,0,6.3);cx.fill();cx.beginPath();cx.ellipse(c.x+c.w*.2,c.y-8,c.w/3,12,0,0,6.3);cx.fill();}\n    cx.fillStyle='rgba(30,5,50,.55)';cx.beginPath();cx.moveTo(0,H);for(let x=0;x<=W;x+=40)cx.lineTo(x,H*.86+Math.sin(x*.01)*14+Math.sin(x*.037)*8);cx.lineTo(W,H);cx.fill();\n  }\n  else if(mode==='paper'){\n    for(const b of P){b.x+=b.vx;b.y+=b.vy;if(b.x<-100)b.x=W+100;if(b.x>W+100)b.x=-100;if(b.y<-100)b.y=H+100;if(b.y>H+100)b.y=-100;const g=cx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);g.addColorStop(0,`rgba(${b.c},.12)`);g.addColorStop(1,`rgba(${b.c},0)`);cx.fillStyle=g;cx.beginPath();cx.arc(b.x,b.y,b.r,0,6.3);cx.fill();}\n    cx.fillStyle='rgba(60,70,110,.09)';for(let x=20;x<W;x+=36)for(let y=20;y<H;y+=36)cx.fillRect(x,y,1.5,1.5);\n  }\n  requestAnimationFrame(frame);\n}\nfunction setTheme(name){\n  document.body.dataset.theme=name;$$('#themes button').forEach(b=>b.classList.toggle('act',b.dataset.t===name));\n  initBg(name);try{localStorage.setItem('memlab-theme',name)}catch(e){}\n  if(typeof perfDraw==='function')perfDraw();\n}\n$('#themes').innerHTML=THEMES.map(t=>`<button data-t=\"${t[0]}\">${t[1]}<\/button>`).join('');\n$('#themes').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setTheme(b.dataset.t);});\naddEventListener('resize',()=>{resize();if(typeof perfDraw==='function')perfDraw();$$('.pgwrap svg').forEach(s=>s.innerHTML='');});\n\n/* ================= NAV + REVEAL + PROGRESS ================= */\n$('#nav').innerHTML=$$('section.sec').map(s=>`<a href=\"#${s.id}\">${s.dataset.nav}<\/a>`).join('');\nconst io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in')}),{threshold:.05});\n$$('.reveal').forEach(r=>io.observe(r));\naddEventListener('scroll',()=>{const h=document.documentElement;$('#prog').style.width=(h.scrollTop/(h.scrollHeight-h.clientHeight)*100)+'%';});\n\n\n/* ================= HELPERS ================= */\nconst esc=s=>s.replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/>/g,'&gt;');\n\n/* ================= 01 HYPERVISOR STACK ================= */\nlet hvType=1;\nfunction hvSet(t){hvType=t;$('#hvB1').classList.toggle('pri',t===1);$('#hvB2').classList.toggle('pri',t===2);hvRender();}\nfunction hvRender(){\n  const L=(t,c,s='')=>`<div class=\"layer\" style=\"background:${c};${s}\">${t}<\/div>`;\n  const vms=`<div style=\"display:flex;gap:8px\">${[1,2,3].map(i=>`<div style=\"flex:1;border:2px dashed var(--border);border-radius:10px;padding:6px\"><div style=\"font-size:.72rem;color:var(--muted)\">VM${i}<\/div>${L('Apps','#2563eb')}${L(['Windows 10','Linux','Ubuntu'][i-1]+' (guest OS)','#7c5cff','font-size:.72rem')}${L('Virtual HW','#0ea5a4','font-size:.7rem')}<\/div>`).join('')}<\/div>`;\n  let h,info;\n  if(hvType===1){\n    h=vms+L('Hypervisor (VMM): ESXi \u00b7 Xen \u00b7 Hyper-V \u00b7 KVM','#d97706')+L('Physical hardware: CPU \u00b7 RAM \u00b7 Disk \u00b7 NIC','#64748b');\n    info='Hypervisor owns the hardware directly: best performance and a small attack surface. Management happens through a special console or privileged VM (Hyper-V \"root partition\", Xen \"Dom0\").';\n  }else{\n    h=`<div style=\"display:flex;gap:8px\"><div style=\"flex:3\">${vms}<\/div><div style=\"flex:1;display:grid;align-content:end\">${L('Host apps','#2563eb')}<\/div><\/div>`+L('Hypervisor application: VirtualBox \u00b7 VMware Workstation','#d97706')+L('Host OS (Windows / Linux / macOS)','#9333ea')+L('Physical hardware','#64748b');\n    info='The host OS owns the hardware and the hypervisor is just a program on it, so every I/O passes through two OS layers. Great for laptops and learning, not for production servers.';\n  }\n  $('#hvStack').innerHTML=h;$('#hvInfo').textContent=info;\n}\n\n/* ================= TRAP AND EMULATE ================= */\nconst TI=[['mov eax, 5','n'],['add eax, 3','n'],['cli    ; disable interrupts','p'],['mov ebx, [0x2000]','n'],['out 0x60, al   ; talk to a device','p'],['inc ecx','n'],['cmp ecx, 10','n'],['hlt    ; halt the CPU','p']];\nconst TR={i:0,direct:0,traps:0,cyc:0,busy:false,tok:0};\nfunction trRender(){\n  $('#trList').innerHTML=TI.map((r,k)=>`<div class=\"trow2 ${k===TR.i?'cur':''} ${k<TR.i?'past':''}\"><code>${esc(r[0])}<\/code><span>${r[1]==='n'?'normal':'privileged / I/O'}<\/span><\/div>`).join('');\n  $('#trD').textContent=TR.direct;$('#trT').textContent=TR.traps;$('#trC').textContent=TR.cyc;\n}\nfunction trReset(){TR.tok++;TR.i=0;TR.direct=0;TR.traps=0;TR.cyc=0;TR.busy=false;['trG','trH','trCpu'].forEach(i=>$('#'+i).className='node');$('#trMsg').textContent='Assume: a normal instruction = 1 cycle, a trap round trip \u2248 1500 cycles.';trRender();}\nasync function trStep(){\n  if(TR.busy)return false;const tok=TR.tok;\n  if(TR.i>=TI.length){$('#trMsg').innerHTML=`Finished: ${TR.direct} of ${TI.length} instructions ran directly, ${TR.traps} trapped. Total \u2248 <b>${TR.cyc}<\/b> cycles (bare metal would be ${TI.length}). Fewer traps = faster VM.`;return false;}\n  TR.busy=true;const r=TI[TR.i];['trG','trH','trCpu'].forEach(i=>$('#'+i).className='node');\n  if(r[1]==='n'){\n    $('#trCpu').classList.add('good');$('#trMsg').innerHTML=`<code>${esc(r[0])}<\/code> is a normal instruction: runs <b>directly on the real CPU<\/b> at native speed (1 cycle).`;TR.direct++;TR.cyc+=1;await sleep(800);\n  }else{\n    $('#trG').classList.add('bad');$('#trMsg').innerHTML=`<code>${esc(r[0])}<\/code> is <b>privileged<\/b>: the de-privileged guest cannot do it \u2192 CPU <b>traps (VM exit)<\/b>.`;await sleep(1200);if(tok!==TR.tok)return false;\n    $('#trG').className='node';$('#trH').classList.add('on');$('#trMsg').innerHTML='Hypervisor <b>emulates<\/b> it on the VM\\'s <i>virtual<\/i> CPU state (the real hardware flag is never touched by the guest).';TR.traps++;TR.cyc+=1500;await sleep(1500);if(tok!==TR.tok)return false;\n    $('#trH').className='node good';$('#trMsg').innerHTML='<b>VM entry<\/b>: guest resumes at the next instruction. Cost \u2248 1500 cycles.';await sleep(800);\n  }\n  if(tok!==TR.tok)return false;\n  TR.i++;TR.busy=false;trRender();return true;\n}\nasync function trAuto(){const tok=TR.tok;while(TR.i<=TI.length&&tok===TR.tok){if(TR.busy){await sleep(150);continue;}const ok=await trStep();if(!ok)break;await sleep(300);}}\n\n/* ================= RESOURCE ALLOCATOR ================= */\nlet raN=2;const RA={vms:[{n:'VM1',r:8,c:2},{n:'VM2',r:8,c:2}]};\nfunction raAdd(r,c){if(RA.vms.length>=8)return;RA.vms.push({n:'VM'+(++raN),r,c});raRender();}\nfunction raDel(i){RA.vms.splice(i,1);raRender();}\nfunction raRender(){\n  const used=RA.vms.reduce((a,v)=>a+v.r,0),vc=RA.vms.reduce((a,v)=>a+v.c,0);\n  const bar=(key,total,usedv)=>RA.vms.map((v,i)=>`<div style=\"flex:${v[key]} 1 0;background:${COLORS[i%8]}\" onclick=\"raDel(${i})\" title=\"remove ${v.n}\">${v.n} \u00b7 ${v[key]}<\/div>`).join('')+(usedv<total?`<div class=\"free\" style=\"flex:${total-usedv} 1 0\">${total-usedv} free<\/div>`:'');\n  $('#raRam').innerHTML=bar('r',32,used);$('#raRam').classList.toggle('over',used>32);\n  $('#raCpu').innerHTML=bar('c',8,vc);$('#raCpu').classList.toggle('over',vc>8);\n  let m=`RAM assigned <b>${used} GB<\/b> of 32 GB (${(used/32).toFixed(2)}\u00d7). vCPUs <b>${vc}<\/b> on 8 cores (${(vc/8).toFixed(2)}\u00d7). `;\n  if(used>32)m+='\u26a0\ufe0f <b>Memory over-committed<\/b>: hypervisor needs ballooning, page sharing or host swapping (slow). ';\n  else m+='\u2705 Memory fits. ';\n  if(vc>8)m+='vCPUs exceed cores: they are time-sliced (usually acceptable, but adds scheduling delay).';\n  $('#raMsg').innerHTML=m;\n}\n\n/* ================= NESTED PAGING ================= */\nconst NT={g:[3,0,2,1],e:[6,9,4,11]};\n$('#ntG').innerHTML='<tr><th>guest page<\/th><th>guest-physical page<\/th><\/tr>'+NT.g.map((x,i)=>`<tr id=\"ng${i}\"><td>${i} \nasync function grRun(){\n  const tok=++GR.tok,ser=$('#grMode').value==='ser',n=ser?64:+$('#grN').value;\n  $('#grCpu').innerHTML='<i><\/i>'.repeat(n);$('#grGpu').innerHTML='<i><\/i>'.repeat(n);\n  const cc=$$('#grCpu i'),gc=$$('#grGpu i'),cper=ser?2:8,gper=ser?1:128;let cd=0,gd=0,ct=0,gt=0;\n  $('#grMsg').textContent=ser?'Dependent chain: step k needs the result of step k\u22121, so only ONE element can be processed at a time.':'Independent elements: every element can be processed at the same time.';\n  while((cd<n||gd<n)&&tok===GR.tok){\n    await sleep(70);\n    if(cd<n){ct++;for(let k=0;k<cper&&cd<n;k++)cc[cd++].classList.add('done');}\n    if(gd<n){gt++;for(let k=0;k<gper&&gd<n;k++)gc[gd++].classList.add('done');}\n    $('#grCt').textContent=`\u00b7 ${ct} ticks`;$('#grGt').textContent=`\u00b7 ${gt} ticks`;\n  }\n  if(tok!==GR.tok)return;\n  $('#grMsg').innerHTML=ser?`CPU needs ${ct} ticks, GPU needs ${gt}. <b>CPU wins ${(gt/ct).toFixed(1)}\u00d7<\/b>: a CPU core is faster per step and the GPU cannot use its thousands of lanes.`:`CPU ${ct} ticks vs GPU ${gt} ticks: <b>GPU wins ${(ct/gt).toFixed(1)}\u00d7<\/b> because all independent elements run at once.`;\n}\nfunction wpInit(){$('#wpLanes').innerHTML=Array.from({length:32},(_,t)=>`<span class=\"thr\" id=\"wl${t}\">${t}<\/span>`).join('');}\nasync function wpRun(){\n  const pat=$('#wpPat').value;wpInit();const c=t=>pat==='none'?true:pat==='half'?t<16:t%2===0;\n  const all=[...Array(32).keys()],A=all.filter(c),B=all.filter(t=>!c(t));\n  const pass=async(set,label)=>{all.forEach(t=>{const e=$('#wl'+t);e.classList.remove('run','mask');e.classList.add(set.includes(t)?'run':'mask');});$('#wpMsg').textContent=label;await sleep(1400);set.forEach(t=>{const e=$('#wl'+t);e.classList.remove('run');e.classList.add('done');});};\n  await pass(A,'Pass 1: threads with condition TRUE execute block A. The others are masked (idle).');\n  if(B.length){await pass(B,'Pass 2: now the FALSE threads execute block B while the first group idles.');all.forEach(t=>$('#wl'+t).classList.remove('mask'));$('#wpMsg').innerHTML='\u26a0\ufe0f <b>Divergence:<\/b> the warp needed <b>2 passes<\/b> (A then B) = half the efficiency.';}\n  else{all.forEach(t=>$('#wl'+t).classList.remove('mask'));$('#wpMsg').innerHTML='\u2705 No divergence: <b>1 pass<\/b>, all 32 lanes busy.';}\n}\nwpInit();\n\n/* ================= CUDA INDEXING ================= */\nconst CI={tok:0};\nfunction ciRender(){\n  const n=clamp(+$('#ciN').value||1,1,400),th=+$('#ciT').value,bl=clamp(+$('#ciB').value||1,1,64);let h='';\n  for(let b=0;b<bl;b++){h+=`<div class=\"blk\" id=\"cb${b}\"><b>Block ${b}<\/b>`;for(let t=0;t<th;t++){const g=b*th+t;h+=`<span class=\"thr ${g>=n?'skip':''}\" id=\"ct${g}\" onclick=\"ciInfo(${b},${t})\">${g}<\/span>`;}h+='<\/div>';}\n  $('#ciGrid').innerHTML=h;const tot=bl*th;\n  $('#ciMsg').innerHTML=tot>=n?`Total threads = ${bl} \u00d7 ${th} = ${tot}. N = ${n}. <b>${tot-n}<\/b> idle thread(s) (red) fail the <code>if (i &lt; N)<\/code> check.`:`<span class=\"no\">\u26a0 Only ${tot} threads for N = ${n}: elements ${tot}\u2026${n-1} are never processed.<\/span> Press Auto blocks.`;\n}\nfunction ciAuto(){const n=+$('#ciN').value||1,th=+$('#ciT').value;$('#ciB').value=clamp(Math.ceil(n/th),1,64);ciRender();}\nfunction ciInfo(b,t){const th=+$('#ciT').value,n=+$('#ciN').value,g=b*th+t;$('#ciMsg').innerHTML=`<code>i = blockIdx.x \u00d7 blockDim.x + threadIdx.x = ${b} \u00d7 ${th} + ${t} = ${g}<\/code> \u2192 `+(g<n?`computes <code>C[${g}] = A[${g}] + B[${g}]<\/code>`:`i \u2265 N, so the thread does nothing.`);}\nasync function ciRun(){\n  const tok=++CI.tok;ciRender();const n=+$('#ciN').value,th=+$('#ciT').value,bl=clamp(+$('#ciB').value||1,1,64);\n  for(let w=0;w*2<bl;w++){\n    const bs=[w*2,w*2+1].filter(b=>b<bl),ids=[];\n    bs.forEach(b=>{for(let t=0;t<th;t++){const g=b*th+t;if(g<n)ids.push(g);}$('#cb'+b).style.borderColor='var(--warn)';});\n    ids.forEach(g=>$('#ct'+g).classList.add('run'));$('#ciMsg').innerHTML=`Wave amily:inherit;color:var(--muted)\">PML4 idx ${ix[0]} | PDPT idx ${ix[1]} | PD idx ${ix[2]} | PT idx ${ix[3]} | offset ${(a&0xFFFn).toString()}${big?' (with a 2 MB page, PT bits + offset form a 21-bit offset)':''}<\/small>`;\n  ['pw0','pw1','pw2','pw3','pw4','pw5'].forEach(i=>{$('#'+i).className='node';$('#'+i).style.opacity=1;});\n  $('#pw1t').textContent='idx '+ix[0];$('#pw2t').textContent='idx '+ix[1];$('#pw3t').textContent='idx '+ix[2];$('#pw4t').textContent=big?'skipped':'idx '+ix[3];$('#pw5t').textContent='frame + offset';\n  const fr=(l,x)=>(x*40503+l*7919+12345)%1048576;\n  for(let k=0;k<=3;k++){$('#pw'+k).classList.add('on');$('#pwOut').innerHTML=k===0?'CR3 holds the physical address of this process\\'s PML4 table.':`Level ${k}: use index ${ix[k-1]} to read an entry; it points to the next table.`;await sleep(850);if(tok!==PW.tok)return;$('#pw'+k).className='node good';}\n  let F,PA;\n  if(big){$('#pw4').style.opacity=.3;F=fr(3,ix[2])%262144;PA=BigInt(F)*0x200000n+off;}\n  else{$('#pw4').classList.add('on');$('#pwOut').textContent=`Level 4: PT entry ${ix[3]} gives the physical frame.`;await sleep(850);if(tok!==PW.tok)return;$('#pw4').className='node good';F=fr(4,ix[3]);PA=BigInt(F)*4096n+off;}\n  $('#pw5').classList.add('good');$('#pw5t').textContent='0x'+PA.toString(16).toUpperCase();\n  $('#pwOut').innerHTML=`\u2705 Physical address = frame 0x${F.toString(16).toUpperCase()} \u00d7 ${big?'2 MB':'4 KB'} + offset ${off} = <b>0x${PA.toString(16).toUpperCase()}<\/b>${big?'<br>Large page: one table level less, and one TLB entry covers 2 MB.':''}`;\n}\n\n/* ================= PAGE LISTS ================= */\nconst PLS={active:['Active','in working sets','#2563eb'],standby:['Standby','clean, cached','#0ea5a4'],modified:['Modified','dirty, not yet written','#d97706'],free:['Free','needs zeroing','#64748b'],zeroed:['Zeroed','ready for demand-zero','#7c5cff']};\nconst PL={pages:[],s:0,z:0,h:0,w:0,clock:0};\nfunction plLog(t){const l=$('#plLog');l.insertAdjacentHTML('beforeend','<div>'+t+'<\/div>');l.scrollTop=l.scrollHeight;}\nfunction plInit(){\n  PL.pages=[];PL.s=PL.z=PL.h=PL.w=PL.clock=0;let id=0;const mk=(st,n)=>{for(let k=0;k<n;k++){PL.pages.push({id:id,st,t:++PL.clock});id++;}};\n  mk('active',4);mk('standby',2);mk('modified',2);mk('free',4);mk('zeroed',4);$('#plLog').innerHTML='';plRender();plLog('16 physical pages shown. Try the buttons and watch pages move between lists.');\n}\nfunction plRender(){\n  $('#plList').innerHTML=Object.keys(PLS).map(k=>{const ps=PL.pages.filter(p=>p.st===k);return `<div class=\"pcol\"><h5 style=\"color:${PLS[k][2]}\">${PLS[k][0]} (${ps.length})<small>${PLS[k][1]}<\/small><\/h5>${ps.map(p=>`<span class=\"chip\" style=\"background:${PLS[k][2]}\">P${p.id}<\/span>`).join('')}<\/div>`;}).join('');\n  $('#plS').textContent=PL.s;$('#plZ').textContent=PL.z;$('#plH').textContent=PL.h;$('#plW').textContent=PL.w;\n}\nfunction plTake(){\n  let p=PL.pages.find(x=>x.st==='zeroed');if(p)return [p,'a zeroed page (already cleared)'];\n  p=PL.pages.find(x=>x.st==='free');if(p)return [p,'a free page (zeroed first)'];\n  const sb=PL.pages.filter(x=>x.st==='standby').sort((a,b)=>a.t-b.t);if(sb.length)return [sb[0],'the oldest standby page (its cached data is dropped)'];\n  return [null,''];\n}\nfunction plAlloc(hard){\n  const [p,why]=plTake();if(!p){plLog('\u274c No zeroed, free or standby page left. The system must write modified pages and trim working sets first.');return;}\n  p.st='active';if(hard){PL.h++;plLog(`\ud83d\udcbd <b>HARD fault:<\/b> took ${why}; data read from disk into P${p.id} (milliseconds).`);}else{PL.z++;plLog(`\ud83c\udd95 <b>Demand-zero fault:<\/b> took ${why} for P${p.id}.`);}plRender();\n}\nfunction plTrim(){\n  const act=PL.pages.filter(x=>x.st==='active');if(!act.length){plLog('No active pages to trim.');return;}\n  act.sort(()=>Math.random()-.5).slice(0,3).forEach(p=>{const dirty=Math.random()<.5;p.st=dirty?'modified':'standby';p.t=++PL.clock;plLog(`\u2702\ufe0f Trimmed P${p.id} from a working set \u2192 <b>${dirty?'Modified (dirty)':'Standby (clean)'}<\/b>. Still in RAM.`);});plRender();\n}\nfunction plSoft(){\n  const c=PL.pages.filter(x=>x.st==='standby'||x.st==='modified');if(!c.length){plLog('No trimmed pages in RAM to reclaim.');return;}\n  const p=c[Math.floor(Math.random()*c.length)];plLog(`\u26a1 <b>SOFT fault:<\/b> P${p.id} was still in RAM (${p.st}); mapped back into the working set with <b>no disk I/O<\/b> (microseconds).`);p.st='active';PL.s++;plRender();\n}\nfunction plWrite(){\n  const m=PL.pages.filter(x=>x.st==='modified');if(!m.length){plLog('No modified pages to write.');return;}\n  m.forEach(p=>{p.st='standby';p.t=++PL.clock;PL.w++;});plLog(`\ud83d\udcbe Modified-page writer wrote ${m.length} page(s) to the paging file/file; they are now clean <b>Standby<\/b> pages.`);plRender();\n}\nfunction plZero(){\n  const f=PL.pages.find(x=>x.st==='free');if(!f){plLog('No free pages to zero.');return;}\n  f.st='zeroed';plLog(`0\ufe0f\u20e3 Zero-page thread cleared P${f.id}; it can serve demand-zero faults quickly.`);plRender();\n}\n\n/* ================= COMMIT CALCULATOR ================= */\nfunction pcUpd(){\n  const R=+$('#pcR').value||0,P=+$('#pcP').value||0,C=+$('#pcC').value||0,lim=R+P,pct=lim?C/lim*100:0;\n  const col=pct<80?'#16a34a':pct<95?'#d97706':'#dc2626';\n  $('#pcBar').innerHTML=`<div style=\"flex:${Math.min(C,lim)} 1 0;background:${col}\">Committed ${C} GB<\/div>`+(lim>C?`<div class=\"free\" style=\"flex:${lim-C} 1 0\">${(lim-C).toFixed(1)} GB left<\/div>`:'');\n  $('#pcOut').innerHTML=`Commit limit = ${R} + ${P} = <b>${lim} GB<\/b>. Usage = ${C} / ${lim} = <b>${pct.toFixed(1)}%<\/b>. `+(C>lim?'<span class=\"no\">Over the limit: allocations fail (\"out of memory\").<\/span>':pct>=90?'Nearly full: risk of allocation failures.':'Healthy headroom.')+(R<C?` Committed is more than RAM, so part of it must live in the paging file.`:'');\n}\n['pcR','pcP','pcC'].forEach(i=>$('#'+i).addEventListener('input',pcUpd));pcUpd();\n\n/* ================= PRESSURE SIMULATOR ================= */\nconst DISK={hdd:8e6,ssd:1e5,nvme:3e4},DNAME={hdd:'the HDD',ssd:'the SSD',nvme:'the NVMe SSD'};\nfunction psModel(apps,ram,ws,disk){const demand=2+apps*ws,over=Math.max(0,(demand-ram)/demand),p=1e-7+0.02*over*over;return {demand,over,p,s:((1-p)*100+p*DISK[disk])/100};}\nfunction psUpd(){\n  const ram=+$('#psRam').value,apps=+$('#psApps').value,ws=+$('#psWs').value/10,disk=$('#psDisk').value;\n  $('#psAppsV').textContent=apps;$('#psWsV').textContent=ws.toFixed(1)+' GB';\n  const r=psModel(apps,ram,ws,disk),s=r.s;\n  $('#psDem').textContent=r.demand.toFixed(1)+' GB';$('#psP').textContent=r.p.toExponential(1);$('#psSl').textContent=(s<10?s.toFixed(2):s<1000?s.toFixed(0):s.toExponential(1))+'\u00d7';$('#psCpu').textContent=(100/s<10?(100/s).toFixed(2):(100/s).toFixed(0))+'%';\n  const feel=s<1.1?'\ud83d\udfe2 Smooth':s<2?'\ud83d\udfe1 Slight lag':s<10?'\ud83d\udfe0 Noticeably slow':s<100?'\ud83d\udd34 Very sluggish':'\ud83d\udca5 THRASHING';\n  $('#psMsg').innerHTML=`<b>${feel}<\/b>. `+(r.over===0?'Everything fits in RAM: only cheap soft faults and demand-zero faults, no real paging cost.':`Demand ${r.demand.toFixed(1)} GB &gt; RAM ${ram} GB, so about <b>${(r.over*100).toFixed(0)}%<\/b> of needed pages cannot stay in memory. Each miss is a hard fault to ${DNAME[disk]}.`);\n  psDraw();\n}\nfunction psDraw(){\n  const c=$('#psChart');if(!c)return;const dpr=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;if(!w)return;c.width=w*dpr;c.height=h*dpr;const g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);\n  const cs=getComputedStyle(document.body),cl={hdd:cs.getPropertyValue('--bad').trim(),ssd:cs.getPropertyValue('--accent').trim(),nvme:cs.getPropertyValue('--good').trim()},tx=cs.getPropertyValue('--muted').trim(),a2=cs.getPropertyValue('--accent2').trim();\n  const ram=+$('#psRam').value,ws=+$('#psWs').value/10,apps=+$('#psApps').value,disk=$('#psDisk').value;\n  const ymax=Math.max(1,Math.ceil(Math.log10(psModel(40,ram,ws,'hdd').s)));\n  const L=50,R=14,T=22,B=30,pw=w-L-R,ph=h-T-B,X=a=>L+(a-1)/39*pw,Y=v=>T+ph-(Math.log10(v)/ymax)*ph;\n  g.font='11px sans-serif';g.fillStyle=tx;g.strokeStyle=tx;g.lineWidth=1;g.globalAlpha=.25;\n  for(let k=0;k<=ymax;k++){g.beginPath();g.moveTo(L,Y(Math.pow(10,k)));g.lineTo(L+pw,Y(Math.pow(10,k)));g.stroke();}\n  for(let a=5;a<=40;a+=5){g.beginPath();g.moveTo(X(a),T);g.lineTo(X(a),T+ph);g.stroke();}\n  g.globalAlpha=1;for(let k=0;k<=ymax;k++)g.fillText(Math.pow(10,k)+'\u00d7',4,Y(Math.pow(10,k))+4);for(let a=5;a<=40;a+=5)g.fillText(a,X(a)-6,h-14);g.fillText('apps open \u2192',L+pw/2-30,h-2);\n  ['hdd','ssd','nvme'].forEach((d,k)=>{g.strokeStyle=cl[d];g.lineWidth=d===disk?4:2;g.beginPath();for(let a=1;a<=40;a++){const y=Y(Math.max(1,psModel(a,ram,ws,d).s));a===1?g.moveTo(X(a),y):g.lineTo(X(a),y);}g.stroke();g.fillStyle=cl[d];g.fillText({hdd:'HDD',ssd:'SATA SSD',nvme:'NVMe'}[d],L+8+k*80,14);});\n  const my=Y(Math.max(1,psModel(apps,ram,ws,disk).s));g.fillStyle=a2;g.beginPath();g.arc(X(apps),my,7,0,6.3);g.fill();\n}\n['psRam','psApps','psWs','psDisk'].forEach(i=>$('#'+i).addEventListener('input',psUpd));\nfunction perfDraw(){psDraw();}\n\n/* ================= INIT ================= */\nhvRender();trRender();raRender();plInit();psUpd();cwRender();\nlet saved='galaxy';try{saved=localStorage.getItem('memlab-theme')||'galaxy'}catch(e){}\nresize();setTheme(THEMES.some(t=>t[0]===saved)?saved:'galaxy');frame();\n\n<\/script>\n<\/body>\n<\/html>\n"};
